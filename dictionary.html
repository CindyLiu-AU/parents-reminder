<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查词典</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 12px;
      gap: 10px;
    }

    /* ── Header ── */
    header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .back-btn {
      background: #1e3a6e; border: 1px solid #2e5f9e; border-radius: 50%;
      width: 48px; height: 48px; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: #90caf9; flex-shrink: 0;
    }
    header h1 { font-size: 26px; font-weight: 900; color: #f59e0b; letter-spacing: 2px; }

    /* ── Direction toggle ── */
    .lang-toggle { display: flex; gap: 10px; flex-shrink: 0; }
    .lang-btn {
      flex: 1;
      background: #112240; border: 2px solid #2e5f9e; border-radius: 14px;
      padding: 12px 8px; font-size: 22px; font-family: inherit;
      color: #546e7a; cursor: pointer; font-weight: 700; transition: all 0.15s;
    }
    .lang-btn:active { opacity: 0.7; }
    .lang-btn.active { background: #1e3a6e; border-color: #f59e0b; color: #f59e0b; }

    /* ── Input area ── */
    .input-wrap { position: relative; flex-shrink: 0; }
    textarea {
      width: 100%;
      background: #112240; border: 2px solid #2e5f9e; border-radius: 16px;
      padding: 16px 20px; font-size: 34px; font-weight: 700; color: #f0f4f8;
      font-family: inherit; outline: none; resize: none;
      line-height: 1.35; height: 110px; letter-spacing: 1px;
      transition: border-color 0.2s;
    }
    textarea::placeholder { color: #334d66; font-weight: 400; }
    textarea:focus { border-color: #f59e0b; }
    .clear-btn {
      position: absolute; top: 12px; right: 12px;
      background: #1e3a6e; border: 1px solid #2e5f9e; border-radius: 50%;
      width: 40px; height: 40px; font-size: 18px; color: #64748b; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .clear-btn:active { background: #2e5a8f; }

    /* ── Translate + mic row ── */
    .action-row { display: flex; gap: 10px; flex-shrink: 0; }
    .translate-btn {
      background: #f59e0b; border: none; border-radius: 16px; padding: 16px;
      font-size: 30px; font-weight: 900; font-family: inherit; color: #1a1000;
      cursor: pointer; flex: 1; letter-spacing: 4px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .translate-btn:active { opacity: 0.8; transform: scale(0.98); }
    .translate-btn:disabled { opacity: 0.4; }

    .mic-btn {
      background: #1e3a6e; border: 2px solid #2e5f9e; border-radius: 16px;
      width: 72px; font-size: 30px; color: #90caf9; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .mic-btn:active { opacity: 0.7; }
    .mic-btn.recording {
      background: #450a0a; border-color: #ef4444; color: #fca5a5;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── Result box — fills all remaining space ── */
    .result-box {
      background: #0d2745; border: 2px solid #1e3a5f; border-radius: 16px;
      padding: 16px; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 8px; overflow: hidden;
    }
    .result-placeholder { font-size: 24px; color: #1e3a5f; }
    .result-text { font-size: 52px; font-weight: 900; line-height: 1.2; word-break: break-all; }
    .result-text.zh { color: #2dd4bf; }
    .result-text.en { color: #f59e0b; }
    .result-loading { font-size: 26px; color: #475569; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .result-error { font-size: 24px; color: #f87171; }

    /* ── Speak button ── */
    .speak-btn {
      background: #1e3a6e; border: 1px solid #2e5f9e; border-radius: 14px;
      padding: 12px; font-size: 22px; font-family: inherit; color: #90caf9;
      cursor: pointer; width: 100%; font-weight: 700; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .speak-btn:active { opacity: 0.7; }

    /* ── Repeat section ── */
    .repeat-section { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .repeat-row { display: flex; gap: 10px; }
    .repeat-btn {
      flex: 1; background: #112240; border: 2px solid #2e5f9e; border-radius: 14px;
      padding: 12px 6px; font-size: 22px; font-family: inherit; color: #90caf9;
      cursor: pointer; font-weight: 700; transition: all 0.15s;
    }
    .repeat-btn:active { opacity: 0.7; }
    .repeat-btn.running { background: #1a3a1a; border-color: #22c55e; color: #86efac; }
    .repeat-progress { text-align: center; font-size: 20px; color: #64748b; font-weight: 700; }
    .stop-btn {
      background: #450a0a; border: 2px solid #ef4444; border-radius: 14px;
      padding: 12px; font-size: 22px; font-family: inherit; color: #fca5a5;
      cursor: pointer; font-weight: 700; width: 100%; transition: opacity 0.15s;
    }
    .stop-btn:active { opacity: 0.7; }

    /* ── History — only shown when no result, scrolls internally ── */
    .history-wrap {
      flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
    }
    .history-label { font-size: 15px; color: #334d66; letter-spacing: 1px; flex-shrink: 0; }
    .history-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .history-item {
      background: #112240; border: 1px solid #1e3a5f; border-radius: 12px;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;
      flex-shrink: 0;
    }
    .history-item:active { background: #1e3a5f; }
    .hist-src { font-size: 22px; font-weight: 700; color: #f59e0b; flex: 1; }
    .hist-res { font-size: 22px; font-weight: 700; color: #2dd4bf; }
    .hist-res.en { color: #f59e0b; }
    .hist-src.zh { color: #2dd4bf; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">←</a>
  <h1>🔍 查词典</h1>
</header>

<div class="lang-toggle">
  <button class="lang-btn active" id="btn-en-zh" onclick="setDir('en-zh')">英文 → 中文</button>
  <button class="lang-btn"        id="btn-zh-en" onclick="setDir('zh-en')">中文 → 英文</button>
</div>

<div class="input-wrap">
  <textarea id="input" placeholder="输入英文单词或句子…" rows="3"></textarea>
  <button class="clear-btn" onclick="clearInput()">✕</button>
</div>

<div class="action-row">
  <button class="translate-btn" id="trans-btn" onclick="doTranslate()">翻 译</button>
  <button class="mic-btn" id="mic-btn" onclick="toggleVoice()">🎤</button>
</div>

<div class="result-box" id="result-box">
  <div class="result-placeholder">翻译结果显示在这里</div>
</div>

<button class="speak-btn"     id="speak-btn"     style="display:none" onclick="speakBoth()">🔊 再次朗读</button>

<div class="repeat-section" id="repeat-section" style="display:none">
  <div class="repeat-row">
    <button class="repeat-btn" id="rep3"  onclick="startRepeat(3)">🔁 3次</button>
    <button class="repeat-btn" id="rep5"  onclick="startRepeat(5)">🔁 5次</button>
    <button class="repeat-btn" id="rep10" onclick="startRepeat(10)">🔁 10次</button>
  </div>
  <div class="repeat-progress" id="repeat-progress" style="display:none"></div>
  <button class="stop-btn" id="stop-btn" onclick="stopRepeat()" style="display:none">⏹ 停止朗读</button>
</div>

<!-- History only shown when no result is displayed -->
<div class="history-wrap" id="history-wrap" style="display:none">
  <div class="history-label">最近查过的词</div>
  <div class="history-list" id="history-list"></div>
</div>

<script>
  const HIST_KEY = 'dict_history';
  let direction  = 'en-zh';
  let currentSrc = '';
  let currentRes = '';

  /* ── Direction toggle ── */
  function setDir(dir) {
    direction = dir;
    document.getElementById('btn-en-zh').classList.toggle('active', dir === 'en-zh');
    document.getElementById('btn-zh-en').classList.toggle('active', dir === 'zh-en');
    document.getElementById('input').placeholder =
      dir === 'en-zh' ? '输入英文单词或句子…' : '输入中文词语或句子…';
    clearInput();
  }

  /* ── TTS voices ── */
  let ttsVoiceEn = null;
  let ttsVoiceCn = null;

  function initVoices() {
    const v = speechSynthesis.getVoices();
    ttsVoiceEn = v.find(x => x.lang === 'en-AU')
              || v.find(x => x.lang === 'en-GB')
              || v.find(x => x.lang.startsWith('en') && x.localService)
              || v.find(x => x.lang.startsWith('en')) || null;
    ttsVoiceCn = v.find(x => x.lang === 'zh-CN')
              || v.find(x => x.lang === 'zh-TW')
              || v.find(x => x.lang.startsWith('zh')) || null;
  }
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.addEventListener('voiceschanged', initVoices);
  initVoices();

  const delay = ms => new Promise(r => setTimeout(r, ms));

  /* ── English TTS ── */
  function sayEnglish(text) {
    return new Promise(resolve => {
      if (!text) { resolve(); return; }
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-AU'; utt.rate = 0.85;
      if (ttsVoiceEn) utt.voice = ttsVoiceEn;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      utt.onend = finish; utt.onerror = finish;
      setTimeout(finish, Math.max(3000, text.length * 120));
      speechSynthesis.speak(utt);
    });
  }

  /* ── Chinese TTS: device voice → Google TTS audio fallback ── */
  async function sayChinese(text) {
    if (!text) return;
    const ok = await new Promise(resolve => {
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'zh-CN';
      if (ttsVoiceCn) utt.voice = ttsVoiceCn;
      let done = false;
      utt.onend   = () => { if (!done) { done = true; resolve(true);  } };
      utt.onerror = () => { if (!done) { done = true; resolve(false); } };
      setTimeout(()  => { if (!done) { done = true; resolve(false); } }, 3000);
      speechSynthesis.speak(utt);
    });
    if (!ok) {
      speechSynthesis.cancel();
      await new Promise(resolve => {
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-CN&client=tw-ob&q=${encodeURIComponent(text.slice(0, 200))}`;
        const audio = new Audio(url);
        audio.onended = resolve; audio.onerror = resolve;
        setTimeout(resolve, 5000);
        audio.play().catch(resolve);
      });
    }
  }

  /* ── Speak both in correct order for direction ── */
  async function speakBoth() {
    if (!currentSrc && !currentRes) return;
    stopRepeat();
    if (direction === 'en-zh') {
      await sayEnglish(currentSrc); await delay(500); await sayChinese(currentRes);
    } else {
      await sayChinese(currentSrc); await delay(500); await sayEnglish(currentRes);
    }
  }

  /* ── Repeat loop ── */
  let isRepeating = false;
  let repeatMax   = 0;

  async function startRepeat(times) {
    if (!currentSrc && !currentRes) return;
    stopRepeat();
    isRepeating = true; repeatMax = times;
    document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('running'));
    document.getElementById('rep' + times).classList.add('running');
    document.getElementById('stop-btn').style.display        = 'block';
    document.getElementById('repeat-progress').style.display = 'block';

    for (let i = 1; i <= repeatMax && isRepeating; i++) {
      document.getElementById('repeat-progress').textContent = `第 ${i} / ${repeatMax} 次`;
      if (direction === 'en-zh') {
        await sayEnglish(currentSrc); if (!isRepeating) break;
        await delay(500);             if (!isRepeating) break;
        await sayChinese(currentRes);
      } else {
        await sayChinese(currentSrc); if (!isRepeating) break;
        await delay(500);             if (!isRepeating) break;
        await sayEnglish(currentRes);
      }
      if (!isRepeating) break;
      if (i < repeatMax) await delay(800);
    }

    if (isRepeating) document.getElementById('repeat-progress').textContent = `✓ 已朗读 ${repeatMax} 次`;
    isRepeating = false;
    document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('running'));
    document.getElementById('stop-btn').style.display = 'none';
  }

  function stopRepeat() {
    isRepeating = false;
    speechSynthesis.cancel();
    document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('running'));
    document.getElementById('stop-btn').style.display        = 'none';
    document.getElementById('repeat-progress').style.display = 'none';
  }

  /* ── Show / hide panels ── */
  function showResultPanel() {
    document.getElementById('speak-btn').style.display      = 'block';
    document.getElementById('repeat-section').style.display = 'flex';
    document.getElementById('history-wrap').style.display   = 'none';
  }
  function showHistoryPanel() {
    document.getElementById('speak-btn').style.display      = 'none';
    document.getElementById('repeat-section').style.display = 'none';
    const hist = loadHistory();
    document.getElementById('history-wrap').style.display   = hist.length ? 'flex' : 'none';
  }

  /* ── Clear ── */
  function clearInput() {
    stopRepeat();
    document.getElementById('input').value = '';
    document.getElementById('result-box').innerHTML = '<div class="result-placeholder">翻译结果显示在这里</div>';
    currentSrc = ''; currentRes = '';
    showHistoryPanel();
    document.getElementById('input').focus();
  }

  /* ── Translate ── */
  async function doTranslate() {
    const text = document.getElementById('input').value.trim();
    if (!text) { showError('请先输入文字'); return; }

    stopRepeat();
    document.getElementById('result-box').innerHTML = '<div class="result-loading">翻译中…</div>';
    const btn = document.getElementById('trans-btn');
    btn.disabled = true;

    const isEnZh  = direction === 'en-zh';
    const pair     = isEnZh ? 'en|zh-CN' : 'zh-CN|en';
    const apiFrom  = isEnZh ? 'en'        : 'zh-CN';
    const apiTo    = isEnZh ? 'zh-CN'     : 'en';

    let result = '';
    try {
      const res  = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${pair}`);
      const data = await res.json();
      result = data.responseData?.translatedText || '';
    } catch(e) {}

    if (!result) {
      try {
        const res  = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${apiFrom}&tl=${apiTo}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        result = data[0]?.map(x => x[0])?.join('') || '';
      } catch(e) {}
    }

    btn.disabled = false;

    if (result) {
      currentSrc = text; currentRes = result;
      const cls = isEnZh ? 'zh' : 'en';
      document.getElementById('result-box').innerHTML = `<div class="result-text ${cls}">${result}</div>`;
      showResultPanel();
      saveHistory(text, result, direction);
      speakBoth();
    } else {
      showError('翻译失败，请检查网络后重试');
    }
  }

  function showError(msg) {
    document.getElementById('result-box').innerHTML = `<div class="result-error">${msg}</div>`;
  }

  /* ── History ── */
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
  }
  function saveHistory(src, res, dir) {
    let hist = loadHistory().filter(h => !(h.src === src && h.dir === dir));
    hist.unshift({ src, res, dir: dir || 'en-zh' });
    if (hist.length > 20) hist = hist.slice(0, 20);
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  }
  function renderHistory() {
    const hist = loadHistory();
    const list = document.getElementById('history-list');
    list.innerHTML = hist.map(h => {
      const src = h.src || h.en || '';
      const res = h.res || h.cn || '';
      const dir = h.dir || 'en-zh';
      const srcCls = dir === 'zh-en' ? 'zh' : '';
      const resCls = dir === 'zh-en' ? 'en' : '';
      const se = src.replace(/'/g,"\\'"); const re = res.replace(/'/g,"\\'");
      return `<div class="history-item" onclick="fillFromHistory('${se}','${re}','${dir}')">
        <span class="hist-src ${srcCls}">${src}</span>
        <span class="hist-res ${resCls}">${res}</span>
      </div>`;
    }).join('');
  }
  function fillFromHistory(src, res, dir) {
    stopRepeat();
    if (dir && dir !== direction) setDir(dir);
    document.getElementById('input').value = src;
    currentSrc = src; currentRes = res;
    const cls = (dir || 'en-zh') === 'en-zh' ? 'zh' : 'en';
    document.getElementById('result-box').innerHTML = `<div class="result-text ${cls}">${res}</div>`;
    showResultPanel();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    speakBoth();
  }

  /* ── Voice input ── */
  let recognition = null;

  function toggleVoice() {
    if (recognition) { stopVoice(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showError('此设备不支持语音输入'); return; }

    recognition = new SR();
    recognition.lang        = direction === 'en-zh' ? 'en-AU' : 'zh-CN';
    recognition.continuous  = false;
    recognition.interimResults = false;

    recognition.onresult = e => {
      const text = e.results[0][0].transcript.trim();
      document.getElementById('input').value = text;
      stopVoice();
      doTranslate();
    };
    recognition.onerror = () => stopVoice();
    recognition.onend   = () => stopVoice();

    recognition.start();
    const btn = document.getElementById('mic-btn');
    btn.textContent = '🔴';
    btn.classList.add('recording');
  }

  function stopVoice() {
    if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    const btn = document.getElementById('mic-btn');
    btn.textContent = '🎤';
    btn.classList.remove('recording');
  }

  /* ── Init ── */
  renderHistory();
  showHistoryPanel();

  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doTranslate(); }
  });
</script>
</body>
</html>
