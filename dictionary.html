<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查词典</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 28px 24px 24px;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: #1e3a6e;
      border: 1px solid #2e5f9e;
      border-radius: 50%;
      width: 56px; height: 56px;
      font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: #90caf9;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 32px;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 2px;
    }

    /* ── Input area ── */
    .input-wrap { position: relative; }
    textarea {
      width: 100%;
      background: #112240;
      border: 2px solid #2e5f9e;
      border-radius: 20px;
      padding: 24px 28px;
      font-size: 42px;
      font-weight: 700;
      color: #f0f4f8;
      font-family: inherit;
      outline: none;
      resize: none;
      line-height: 1.4;
      min-height: 160px;
      letter-spacing: 2px;
      transition: border-color 0.2s;
    }
    textarea::placeholder { color: #334d66; font-weight: 400; }
    textarea:focus { border-color: #f59e0b; }

    .clear-btn {
      position: absolute;
      top: 16px; right: 16px;
      background: #1e3a6e;
      border: 1px solid #2e5f9e;
      border-radius: 50%;
      width: 48px; height: 48px;
      font-size: 22px;
      color: #64748b;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .clear-btn:active { background: #2e5a8f; }

    /* ── Translate button ── */
    .translate-btn {
      background: #f59e0b;
      border: none;
      border-radius: 20px;
      padding: 24px;
      font-size: 36px;
      font-weight: 900;
      font-family: inherit;
      color: #1a1000;
      cursor: pointer;
      width: 100%;
      letter-spacing: 4px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .translate-btn:active { opacity: 0.8; transform: scale(0.98); }
    .translate-btn:disabled { opacity: 0.4; }

    /* ── Speak button ── */
    .speak-btn {
      background: #1e3a6e;
      border: 1px solid #2e5f9e;
      border-radius: 20px;
      padding: 20px;
      font-size: 30px;
      font-family: inherit;
      color: #90caf9;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      transition: opacity 0.15s;
    }
    .speak-btn:active { opacity: 0.7; }

    /* ── Result area ── */
    .result-box {
      background: #0d2745;
      border: 2px solid #1e3a5f;
      border-radius: 20px;
      padding: 28px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      flex: 1;
    }
    .result-placeholder { font-size: 28px; color: #1e3a5f; }
    .result-cn {
      font-size: 64px;
      font-weight: 900;
      color: #2dd4bf;
      line-height: 1.3;
      word-break: break-all;
    }
    .result-loading {
      font-size: 32px;
      color: #475569;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .result-error { font-size: 28px; color: #f87171; }

    /* ── Repeat section ── */
    .repeat-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .repeat-row {
      display: flex;
      gap: 12px;
    }
    .repeat-btn {
      flex: 1;
      background: #112240;
      border: 2px solid #2e5f9e;
      border-radius: 18px;
      padding: 18px 8px;
      font-size: 26px;
      font-family: inherit;
      color: #90caf9;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.15s;
    }
    .repeat-btn:active { opacity: 0.7; }
    .repeat-btn.running {
      background: #1a3a1a;
      border-color: #22c55e;
      color: #86efac;
    }
    .repeat-progress {
      text-align: center;
      font-size: 26px;
      color: #64748b;
      font-weight: 700;
    }
    .stop-btn {
      background: #450a0a;
      border: 2px solid #ef4444;
      border-radius: 18px;
      padding: 18px;
      font-size: 28px;
      font-family: inherit;
      color: #fca5a5;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      transition: opacity 0.15s;
    }
    .stop-btn:active { opacity: 0.7; }

    /* ── History ── */
    .history-label {
      font-size: 18px;
      color: #334d66;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }
    .history-item:active { background: #1e3a5f; }
    .history-en { font-size: 26px; font-weight: 700; color: #f59e0b; flex: 1; }
    .history-cn { font-size: 26px; font-weight: 700; color: #2dd4bf; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">←</a>
  <h1>🔍 查词典</h1>
</header>

<div class="input-wrap">
  <textarea id="input" placeholder="输入英文单词或句子…" rows="3"></textarea>
  <button class="clear-btn" onclick="clearInput()">✕</button>
</div>

<button class="translate-btn" id="trans-btn" onclick="doTranslate()">翻 译</button>

<div class="result-box" id="result-box">
  <div class="result-placeholder">翻译结果显示在这里</div>
</div>

<button class="speak-btn" id="speak-btn" style="display:none" onclick="speakBoth()">🔊 再次朗读（英文 + 中文）</button>

<div class="repeat-section" id="repeat-section" style="display:none">
  <div class="repeat-row">
    <button class="repeat-btn" id="rep3"  onclick="startRepeat(3)">🔁 3次</button>
    <button class="repeat-btn" id="rep5"  onclick="startRepeat(5)">🔁 5次</button>
    <button class="repeat-btn" id="rep10" onclick="startRepeat(10)">🔁 10次</button>
  </div>
  <div class="repeat-progress" id="repeat-progress" style="display:none"></div>
  <button class="stop-btn" id="stop-btn" onclick="stopRepeat()" style="display:none">⏹ 停止朗读</button>
</div>

<div class="history-label" id="hist-label" style="display:none">最近查过的词</div>
<div class="history-list" id="history-list"></div>

<script>
  const HIST_KEY = 'dict_history';
  let currentEn = '';
  let currentCn = '';

  /* ── TTS voices ── */
  let ttsVoiceEn = null;
  let ttsVoiceCn = null;

  function initVoices() {
    const v = speechSynthesis.getVoices();
    ttsVoiceEn = v.find(x => x.lang === 'en-AU')
              || v.find(x => x.lang === 'en-GB')
              || v.find(x => x.lang.startsWith('en') && x.localService)
              || v.find(x => x.lang.startsWith('en'))
              || null;
    ttsVoiceCn = v.find(x => x.lang === 'zh-CN')
              || v.find(x => x.lang === 'zh-TW')
              || v.find(x => x.lang.startsWith('zh'))
              || null;
  }
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.addEventListener('voiceschanged', initVoices);
  initVoices();

  const delay = ms => new Promise(r => setTimeout(r, ms));

  /* ── Speak English via Web Speech API ── */
  function sayEnglish(text) {
    return new Promise(resolve => {
      if (!text) { resolve(); return; }
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-AU'; utt.rate = 0.85;
      if (ttsVoiceEn) utt.voice = ttsVoiceEn;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      utt.onend = finish; utt.onerror = finish;
      setTimeout(finish, Math.max(3000, text.length * 120));
      speechSynthesis.speak(utt);
    });
  }

  /* ── Speak Chinese: device TTS first, Google TTS audio fallback ── */
  async function sayChinese(text) {
    if (!text) return;

    // Try device TTS — resolve(true) on success, resolve(false) on failure/timeout
    const ok = await new Promise(resolve => {
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'zh-CN';
      if (ttsVoiceCn) utt.voice = ttsVoiceCn;
      let done = false;
      utt.onend   = () => { if (!done) { done = true; resolve(true);  } };
      utt.onerror = () => { if (!done) { done = true; resolve(false); } };
      setTimeout(()  => { if (!done) { done = true; resolve(false); } }, 3000);
      speechSynthesis.speak(utt);
    });

    if (!ok) {
      // Fallback: Google Translate TTS audio
      speechSynthesis.cancel();
      await new Promise(resolve => {
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-CN&client=tw-ob&q=${encodeURIComponent(text.slice(0, 200))}`;
        const audio = new Audio(url);
        audio.onended = resolve;
        audio.onerror = resolve;
        setTimeout(resolve, 5000);
        audio.play().catch(resolve);
      });
    }
  }

  /* ── Speak English then Chinese ── */
  async function speakBoth() {
    if (!currentEn && !currentCn) return;
    stopRepeat();
    await sayEnglish(currentEn);
    await delay(500);
    await sayChinese(currentCn);
  }

  /* ── Repeat loop ── */
  let isRepeating = false;
  let repeatMax   = 0;

  async function startRepeat(times) {
    if (!currentEn && !currentCn) return;
    stopRepeat();
    isRepeating = true;
    repeatMax   = times;

    document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('running'));
    document.getElementById('rep' + times).classList.add('running');
    document.getElementById('stop-btn').style.display        = 'block';
    document.getElementById('repeat-progress').style.display = 'block';

    for (let i = 1; i <= repeatMax && isRepeating; i++) {
      document.getElementById('repeat-progress').textContent = `第 ${i} / ${repeatMax} 次`;
      await sayEnglish(currentEn);
      if (!isRepeating) break;
      await delay(500);
      if (!isRepeating) break;
      await sayChinese(currentCn);
      if (!isRepeating) break;
      if (i < repeatMax) await delay(800);
    }

    if (isRepeating) {
      document.getElementById('repeat-progress').textContent = `✓ 已朗读 ${repeatMax} 次`;
    }
    isRepeating = false;
    document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('running'));
    document.getElementById('stop-btn').style.display = 'none';
  }

  function stopRepeat() {
    isRepeating = false;
    speechSynthesis.cancel();
    document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('running'));
    document.getElementById('stop-btn').style.display        = 'none';
    document.getElementById('repeat-progress').style.display = 'none';
  }

  /* ── Clear ── */
  function clearInput() {
    stopRepeat();
    document.getElementById('input').value = '';
    showPlaceholder();
    document.getElementById('speak-btn').style.display    = 'none';
    document.getElementById('repeat-section').style.display = 'none';
    document.getElementById('input').focus();
    currentEn = ''; currentCn = '';
  }

  /* ── Translate ── */
  async function doTranslate() {
    const text = document.getElementById('input').value.trim();
    if (!text) { showError('请先输入英文单词或句子'); return; }

    stopRepeat();
    showLoading();
    const btn = document.getElementById('trans-btn');
    btn.disabled = true;

    let cn = '';

    // Try 1: MyMemory
    try {
      const res  = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-CN`);
      const data = await res.json();
      cn = data.responseData?.translatedText || '';
    } catch(e) {}

    // Try 2: Google Translate
    if (!cn) {
      try {
        const res  = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        cn = data[0]?.map(x => x[0])?.join('') || '';
      } catch(e) {}
    }

    btn.disabled = false;

    if (cn) {
      showResult(text, cn);
      saveHistory(text, cn);
      speakBoth();
    } else {
      showError('翻译失败，请检查网络后重试');
    }
  }

  /* ── Result display ── */
  function showPlaceholder() {
    document.getElementById('result-box').innerHTML = `<div class="result-placeholder">翻译结果显示在这里</div>`;
    currentEn = ''; currentCn = '';
  }
  function showLoading() {
    document.getElementById('result-box').innerHTML = `<div class="result-loading">翻译中…</div>`;
  }
  function showResult(en, cn) {
    currentEn = en; currentCn = cn;
    document.getElementById('result-box').innerHTML = `<div class="result-cn">${cn}</div>`;
    document.getElementById('speak-btn').style.display    = 'block';
    document.getElementById('repeat-section').style.display = 'flex';
    document.getElementById('repeat-progress').style.display = 'none';
    document.getElementById('stop-btn').style.display     = 'none';
  }
  function showError(msg) {
    document.getElementById('result-box').innerHTML = `<div class="result-error">${msg}</div>`;
  }

  /* ── History ── */
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
  }
  function saveHistory(en, cn) {
    let hist = loadHistory().filter(h => h.en.toLowerCase() !== en.toLowerCase());
    hist.unshift({ en, cn });
    if (hist.length > 20) hist = hist.slice(0, 20);
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
    renderHistory();
  }
  function renderHistory() {
    const hist = loadHistory();
    const label = document.getElementById('hist-label');
    const list  = document.getElementById('history-list');
    if (!hist.length) { label.style.display = 'none'; list.innerHTML = ''; return; }
    label.style.display = 'block';
    list.innerHTML = hist.map(h => `
      <div class="history-item" onclick="fillFromHistory('${h.en.replace(/'/g,"\\'")}','${h.cn.replace(/'/g,"\\'")}')">
        <span class="history-en">${h.en}</span>
        <span class="history-cn">${h.cn}</span>
      </div>`).join('');
  }
  function fillFromHistory(en, cn) {
    stopRepeat();
    document.getElementById('input').value = en;
    showResult(en, cn);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    speakBoth();
  }

  /* ── Init ── */
  renderHistory();

  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doTranslate(); }
  });
</script>
</body>
</html>
