<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>备用单词队列</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      padding: 28px 28px 80px;
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e3a5f;
    }
    header h1 { font-size: 26px; font-weight: 700; color: #f59e0b; }
    header .sub { font-size: 14px; color: #64748b; margin-top: 4px; line-height: 1.5; }

    /* ── Token bar ── */
    .token-bar {
      background: #0d2137;
      border: 1px solid #2e5f9e;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .token-bar .tok-label { font-size: 13px; color: #64748b; flex-shrink: 0; }
    .token-bar input {
      flex: 1; min-width: 180px; background: #112240;
      border: 1px solid #1e3a5f; border-radius: 8px;
      padding: 8px 12px; color: #f0f4f8; font-size: 13px;
      font-family: monospace; outline: none;
    }
    .token-bar input:focus { border-color: #3b7dd8; }
    .token-bar button {
      background: #1e3a6e; border: 1px solid #2e5f9e;
      color: #90caf9; font-size: 13px; font-weight: 600;
      font-family: inherit; border-radius: 8px;
      padding: 8px 16px; cursor: pointer; white-space: nowrap;
    }
    .token-bar button:hover { background: #2e5a8f; }
    .tok-status { font-size: 12px; flex-shrink: 0; }
    .tok-ok   { color: #22c55e; }
    .tok-none { color: #f59e0b; }

    .info-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .badge {
      background: #1e3a5f;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      color: #94a3b8;
    }
    .badge strong { color: #f0f4f8; font-size: 18px; display: block; }

    .next-rotation {
      background: #1a2e1a;
      border: 1px solid #22c55e44;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      color: #86efac;
    }
    .next-rotation strong { color: #22c55e; font-size: 16px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 16px; }

    .week-group { margin-bottom: 28px; }
    .week-label {
      font-size: 13px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .week-label span {
      background: #1e3a5f;
      color: #7dd3fc;
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 12px;
    }
    .push-batch-btn {
      background: #064e3b;
      border: 1px solid #059669;
      color: #6ee7b7;
      font-size: 12px; font-weight: 700; font-family: inherit;
      border-radius: 8px; padding: 4px 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .push-batch-btn:hover { background: #065f46; }
    .push-batch-btn:disabled { opacity: 0.4; cursor: default; }

    .word-row {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .word-row:hover { border-color: #2e5a8f; }

    .queue-num {
      font-size: 13px;
      color: #475569;
      width: 22px;
      text-align: right;
      flex-shrink: 0;
    }

    .word-main { flex: 1; min-width: 0; }
    .word-en {
      font-size: 20px;
      font-weight: 700;
      color: #f0f4f8;
      margin-bottom: 2px;
    }
    .word-cn {
      font-size: 14px;
      color: #7dd3fc;
      margin-bottom: 4px;
    }
    .word-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .audio-btn {
      background: #1e3a5f;
      border: none;
      border-radius: 8px;
      color: #7dd3fc;
      font-size: 18px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .audio-btn:hover { background: #2e5a8f; }
    .audio-btn.speaking { color: #f59e0b; background: #2e3a1f; }
    .speak-preview-btn {
      background: #1e3a6e; border: 1px solid #2e5f9e;
      color: #90caf9; font-size: 14px; font-weight: 600;
      font-family: inherit; border-radius: 8px;
      padding: 10px 14px; cursor: pointer; white-space: nowrap;
      transition: all 0.2s; flex-shrink: 0;
    }
    .speak-preview-btn:hover { background: #2e5a8f; }

    .push-word-btn {
      background: #064e3b;
      border: 1px solid #059669;
      color: #6ee7b7;
      font-size: 12px; font-weight: 700; font-family: inherit;
      border-radius: 8px; padding: 6px 12px; cursor: pointer;
      flex-shrink: 0; transition: all 0.15s; white-space: nowrap;
    }
    .push-word-btn:hover { background: #065f46; }
    .push-word-btn:disabled { opacity: 0.4; cursor: default; }

    .active-section {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid #1e3a5f;
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .active-word {
      background: #0d1b2a;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #475569;
    }
    .active-word .aw-en { color: #64748b; font-weight: 600; width: 140px; flex-shrink: 0; }
    .active-word .aw-cn { color: #475569; }

    /* ── Page nav tabs ── */
    .page-tabs {
      display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; flex-shrink: 0;
    }
    .page-tab {
      padding: 10px 24px; border-radius: 20px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      text-decoration: none;
      border: 1px solid #1e3a5f; background: #112240; color: #7b9eb5;
      transition: all 0.2s;
    }
    .page-tab:hover { border-color: #3b7dd8; color: #90caf9; }
    .page-tab.active {
      background: #f59e0b22; border-color: #f59e0b; color: #f59e0b;
    }

    /* ── Add Word Form ── */
    .add-word-section {
      background: #0d2137;
      border: 1px solid #2e5f9e;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .add-word-section h2 {
      font-size: 17px; font-weight: 700; color: #90caf9;
      margin-bottom: 18px;
    }
    .add-form-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 20px;
      align-items: start;
    }
    .img-upload-box {
      width: 180px; height: 180px;
      border: 2px dashed #2e5a8f;
      border-radius: 12px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; color: #475569; font-size: 13px;
      text-align: center; gap: 8px;
      overflow: hidden; position: relative;
      background: #112240;
      transition: border-color 0.2s;
    }
    .img-upload-box:hover { border-color: #3b7dd8; color: #90caf9; }
    .img-upload-box img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .img-upload-box input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .form-fields { display: flex; flex-direction: column; gap: 12px; }
    .form-row { display: flex; gap: 10px; align-items: center; }
    .form-label { font-size: 13px; color: #64748b; width: 80px; flex-shrink: 0; }
    .form-input {
      flex: 1; background: #112240; border: 1px solid #1e3a5f;
      border-radius: 8px; padding: 10px 14px;
      color: #f0f4f8; font-size: 15px; font-family: inherit;
      outline: none;
    }
    .form-input:focus { border-color: #3b7dd8; }
    textarea.form-input { resize: vertical; min-height: 72px; line-height: 1.6; }
    .translate-btn {
      background: #1e3a6e; border: 1px solid #2e5f9e;
      color: #90caf9; font-size: 14px; font-weight: 600;
      font-family: inherit; border-radius: 8px;
      padding: 10px 16px; cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .translate-btn:hover { background: #2e5a8f; }
    .translate-btn:disabled { opacity: 0.5; cursor: default; }
    .save-btn {
      background: #f59e0b; border: none; color: #1a1000;
      font-size: 15px; font-weight: 700; font-family: inherit;
      border-radius: 10px; padding: 12px 24px; cursor: pointer;
      align-self: flex-start; transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.85; }
    .save-btn:disabled { opacity: 0.5; cursor: default; }

    .form-feedback {
      font-size: 13px; padding: 10px 14px; border-radius: 8px;
      display: none; margin-top: 4px;
    }
    .form-feedback.ok  { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .form-feedback.err { background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      background: #064e3b; border: 1px solid #059669; color: #6ee7b7;
      font-size: 14px; font-weight: 700; padding: 12px 24px; border-radius: 24px;
      display: none; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    #toast.err { background: #450a0a; border-color: #dc2626; color: #fca5a5; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <div>
    <h1>📋 备用单词队列</h1>
    <div class="sub" id="next-info">计算中…</div>
  </div>
  <div class="page-tabs">
    <a class="page-tab" href="flashcards.html">📖 单词卡</a>
    <a class="page-tab" href="phonics.html">🔤 自然拼读</a>
    <a class="page-tab active" href="standby-admin.html">📋 备用队列</a>
  </div>
</header>

<!-- GitHub token bar -->
<div class="token-bar">
  <span class="tok-label">🔑 GitHub Token</span>
  <input type="password" id="tok-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" oninput="onTokenInput()">
  <button onclick="saveToken()">保存</button>
  <span class="tok-status" id="tok-status"></span>
</div>

<!-- Add word form -->
<div class="add-word-section">
  <h2>➕ 添加新单词到备用队列</h2>
  <div class="add-form-grid">
    <div class="img-upload-box" id="img-box" title="点击上传图片">
      <span style="font-size:28px">📷</span>
      <span>上传图片<br>（可选）</span>
      <img id="img-preview" src="" alt="" style="display:none">
      <input type="file" accept="image/*" onchange="handleImage(this)">
    </div>
    <div class="form-fields">
      <div class="form-row">
        <span class="form-label">英文单词</span>
        <input class="form-input" id="inp-word" type="text" placeholder="e.g. Organic" onkeydown="if(event.key==='Enter')autoTranslate()">
        <button class="speak-preview-btn" onclick="tts(document.getElementById('inp-word').value)" title="听发音">🔊</button>
        <button class="translate-btn" id="trans-btn" onclick="autoTranslate()">🔄 翻译</button>
      </div>
      <div class="form-row">
        <span class="form-label">中文翻译</span>
        <input class="form-input" id="inp-cn" type="text" placeholder="中文意思（可编辑）">
      </div>
      <div class="form-row" style="align-items:flex-start">
        <span class="form-label" style="margin-top:10px">说明</span>
        <textarea class="form-input" id="inp-desc" placeholder="例子句子或说明（可选）"></textarea>
      </div>
      <button class="save-btn" id="save-standby-btn" onclick="saveToStandby()">保存到备用队列 →</button>
      <div class="form-feedback" id="form-feedback"></div>
    </div>
  </div>
</div>

<div class="info-bar">
  <div class="badge">
    <strong id="standby-count">—</strong>
    备用单词
  </div>
  <div class="badge">
    <strong id="weeks-count">—</strong>
    可用周数
  </div>
  <div class="next-rotation" id="next-rotation-badge">
    <strong>下次推送：</strong> 计算中…
  </div>
</div>

<div id="standby-list"></div>

<div class="active-section">
  <div class="section-title">已激活单词（words.json，共 <span id="active-count">—</span> 个）</div>
  <div id="active-list"></div>
</div>

<div id="toast"></div>

<script>
  const GH_REPO = 'CindyLiu-AU/parents-reminder';
  const TOK_KEY = 'parents_gh_token';

  let standbyData = [];
  let wordsData   = [];
  let standbySha  = null;
  let wordsSha    = null;

  /* ── Token ── */
  function token() { return localStorage.getItem(TOK_KEY) || ''; }

  function onTokenInput() {}

  function saveToken() {
    const val = document.getElementById('tok-input').value.trim();
    if (!val) return;
    localStorage.setItem(TOK_KEY, val);
    document.getElementById('tok-input').value = '••••••••••••••••••••';
    refreshTokStatus();
    showToast('Token 已保存 ✓');
  }

  function refreshTokStatus() {
    const el = document.getElementById('tok-status');
    if (token()) { el.textContent = '✅ 已连接'; el.className = 'tok-status tok-ok'; }
    else          { el.textContent = '⚠️ 未设置'; el.className = 'tok-status tok-none'; }
  }

  /* ── GitHub API ── */
  async function ghGet(file) {
    const tok = token();
    const headers = { 'Cache-Control': 'no-cache' };
    if (tok) headers.Authorization = `Bearer ${tok}`;
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${file}?t=${Date.now()}`, { headers });
    if (res.status === 404) return { data: [], sha: null };
    if (!res.ok) throw new Error(`GitHub ${res.status}`);
    const json = await res.json();
    const data = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g,'')))));
    return { data, sha: json.sha };
  }

  async function ghPut(file, data, sha, message) {
    const tok = token();
    if (!tok) throw new Error('没有 GitHub Token，请先填写');
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = { message, content, branch: 'main' };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${file}`, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) { const t = await res.text(); throw new Error(t); }
    const json = await res.json();
    return json.content.sha;
  }

  /* ── Toast ── */
  let toastTimer;
  function showToast(msg, isErr) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'err' : '';
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
  }

  /* ── Image upload ── */
  let imgDataUrl = '';
  function handleImage(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      imgDataUrl = e.target.result;
      const preview = document.getElementById('img-preview');
      preview.src = imgDataUrl;
      preview.style.display = 'block';
      document.getElementById('img-box').querySelector('span:first-child').style.display = 'none';
      document.getElementById('img-box').querySelector('span:last-of-type').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  /* ── Auto-translate ── */
  async function autoTranslate() {
    const word = document.getElementById('inp-word').value.trim();
    if (!word) return;
    const btn = document.getElementById('trans-btn');
    btn.disabled = true; btn.textContent = '翻译中…';
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`);
      const data = await res.json();
      const translated = data.responseData?.translatedText || '';
      if (translated) document.getElementById('inp-cn').value = translated;
    } catch { alert('翻译失败，请手动输入中文'); }
    finally { btn.disabled = false; btn.textContent = '🔄 翻译'; }
  }

  /* ── Save to standby ── */
  async function saveToStandby() {
    const word = document.getElementById('inp-word').value.trim();
    const cn   = document.getElementById('inp-cn').value.trim();
    const desc = document.getElementById('inp-desc').value.trim();
    if (!word || !cn) { showFeedback('请填写英文单词和中文翻译', true); return; }

    const btn = document.getElementById('save-standby-btn');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      const { data, sha } = await ghGet('standby.json');
      const entry = { word, word_cn: cn, desc: desc || '', audio: '' };
      if (imgDataUrl) entry.image = imgDataUrl;
      data.push(entry);
      await ghPut('standby.json', data, sha, `Add "${word}" to standby`);

      // Reset form
      document.getElementById('inp-word').value = '';
      document.getElementById('inp-cn').value   = '';
      document.getElementById('inp-desc').value  = '';
      imgDataUrl = '';
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('img-preview').src = '';

      showFeedback(`"${word}" 已保存到备用队列 ✓`, false);
      showToast(`"${word}" 已加入备用队列 ✓`);
      await load();
    } catch(e) {
      showFeedback('保存失败：' + e.message, true);
      showToast('保存失败 ✗', true);
    } finally {
      btn.disabled = false; btn.textContent = '保存到备用队列 →';
    }
  }

  function showFeedback(msg, isErr) {
    const el = document.getElementById('form-feedback');
    el.textContent = msg;
    el.className = 'form-feedback ' + (isErr ? 'err' : 'ok');
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  /* ── Push single word to learning ── */
  async function pushWord(idx) {
    const btn = document.querySelector(`[data-push="${idx}"]`);
    if (btn) { btn.disabled = true; btn.textContent = '推送中…'; }
    try {
      // Fetch fresh SHAs each time to avoid conflicts
      const [sbResult, wResult] = await Promise.all([ghGet('standby.json'), ghGet('words.json')]);
      const sb = sbResult.data; const sbSha = sbResult.sha;
      const ws = wResult.data; const wsSha = wResult.sha;

      const word = sb[idx];
      if (!word) throw new Error('单词不存在');
      sb.splice(idx, 1);
      word.addedAt = new Date().toISOString();
      ws.unshift(word); // prepend to words.json (newest first)

      await ghPut('standby.json', sb, sbSha, `Remove "${word.word}" from standby`);
      await ghPut('words.json',   ws, wsSha,  `Add "${word.word}" to active words`);

      showToast(`"${word.word}" 已推送到学习页 ✓`);
      await load();
    } catch(e) {
      showToast('推送失败：' + e.message, true);
      if (btn) { btn.disabled = false; btn.textContent = '推送到学习'; }
    }
  }

  /* ── Push entire batch (3 words) ── */
  async function pushBatch(startIdx) {
    const btn = document.querySelector(`[data-batch="${startIdx}"]`);
    if (btn) { btn.disabled = true; btn.textContent = '推送中…'; }
    try {
      const [sbResult, wResult] = await Promise.all([ghGet('standby.json'), ghGet('words.json')]);
      const sb = sbResult.data; const sbSha = sbResult.sha;
      const ws = wResult.data; const wsSha = wResult.sha;

      const batch = sb.splice(startIdx, 3);
      if (!batch.length) throw new Error('没有可推送的单词');
      const now = new Date().toISOString();
      batch.forEach(w => { w.addedAt = now; });
      ws.unshift(...batch.reverse()); // prepend maintaining order

      await ghPut('standby.json', sb, sbSha, `Push batch starting at ${startIdx} to active`);
      await ghPut('words.json',   ws, wsSha,  `Add ${batch.length} words from standby`);

      showToast(`${batch.length} 个单词已推送到学习页 ✓`);
      await load();
    } catch(e) {
      showToast('推送失败：' + e.message, true);
      if (btn) { btn.disabled = false; btn.textContent = '推送本批 (3个)'; }
    }
  }

  /* ── TTS ── */
  let ttsVoice = null;
  function initVoices() {
    const voices = speechSynthesis.getVoices();
    ttsVoice = voices.find(v => v.lang === 'en-AU')
            || voices.find(v => v.lang === 'en-GB')
            || voices.find(v => v.lang.startsWith('en') && v.localService)
            || voices.find(v => v.lang.startsWith('en'))
            || null;
  }
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.addEventListener('voiceschanged', initVoices);
  initVoices();

  function tts(text) {
    if (!text || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text.trim());
    utt.lang  = 'en-AU';
    utt.rate  = 0.88;
    utt.pitch = 1;
    if (ttsVoice) utt.voice = ttsVoice;
    speechSynthesis.speak(utt);
  }

  /* ── Utils ── */
  function nextMonday() {
    const d = new Date();
    const day = d.getDay();
    const daysUntil = day === 1 ? 7 : (8 - day) % 7;
    d.setDate(d.getDate() + daysUntil);
    d.setHours(11, 0, 0, 0);
    return d;
  }
  function formatDate(d) {
    return `${d.getMonth()+1}月${d.getDate()}日（${['日','一','二','三','四','五','六'][d.getDay()]}）`;
  }
  function playAudio(path) {
    if (!path) return;
    new Audio(path + '?v=1').play().catch(() => {});
  }

  /* ── Load ── */
  async function load() {
    const [sbResult, wResult] = await Promise.all([ghGet('standby.json'), ghGet('words.json')]);
    standbyData = sbResult.data; standbySha = sbResult.sha;
    wordsData   = wResult.data;  wordsSha   = wResult.sha;

    document.getElementById('standby-count').textContent = standbyData.length;
    document.getElementById('weeks-count').textContent   = Math.floor(standbyData.length / 3) + (standbyData.length % 3 ? '+' : '');
    document.getElementById('active-count').textContent  = wordsData.length;

    const mon = nextMonday();
    const monStr = formatDate(mon);
    document.getElementById('next-rotation-badge').innerHTML = `<strong>下次推送：</strong> 周一 ${monStr} 上午11点`;
    document.getElementById('next-info').innerHTML = `下次自动推送<br><strong style="color:#22c55e">${monStr}</strong>`;

    // Standby list
    const container = document.getElementById('standby-list');
    if (!standbyData.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <p>备用队列是空的</p>
          <p style="margin-top:8px;font-size:14px">在上方表单添加新单词</p>
        </div>`;
    } else {
      let html = '';
      for (let i = 0; i < standbyData.length; i += 3) {
        const batch = standbyData.slice(i, i + 3);
        const weekNum = Math.floor(i / 3) + 1;
        const weekDate = new Date(mon);
        weekDate.setDate(weekDate.getDate() + (weekNum - 1) * 7);
        html += `<div class="week-group">
          <div class="week-label">
            <span>第 ${weekNum} 批 · ${weekDate.getMonth()+1}月${weekDate.getDate()}日推送</span>
            <button class="push-batch-btn" data-batch="${i}" onclick="pushBatch(${i})">⬆ 推送本批 (${batch.length}个)</button>
          </div>`;
        batch.forEach((w, j) => {
          const idx = i + j;
          html += `
          <div class="word-row">
            <div class="queue-num">${idx + 1}</div>
            <div class="word-main">
              <div class="word-en">${w.word}</div>
              <div class="word-cn">${w.word_cn || ''}</div>
              ${w.desc ? `<div class="word-desc">${w.desc}</div>` : ''}
            </div>
            <button class="audio-btn" onclick="tts('${w.word.replace(/'/g,"\\'")}')">🔊</button>
            <button class="push-word-btn" data-push="${idx}" onclick="pushWord(${idx})">⬆ 推送到学习</button>
          </div>`;
        });
        html += '</div>';
      }
      container.innerHTML = html;
    }

    // Active words
    const activeContainer = document.getElementById('active-list');
    if (!wordsData.length) {
      activeContainer.innerHTML = '<div style="color:#475569;font-size:14px">暂无</div>';
    } else {
      activeContainer.innerHTML = wordsData.map(w => `
        <div class="active-word">
          <span class="aw-en">${w.word}</span>
          <span class="aw-cn">${w.word_cn || ''}</span>
        </div>`).join('');
    }
  }

  /* ── Init ── */
  refreshTokStatus();
  const existing = token();
  if (existing) document.getElementById('tok-input').value = '••••••••••••••••••••';
  load();
</script>
<script src="theme.js"></script>
</body>
</html>
