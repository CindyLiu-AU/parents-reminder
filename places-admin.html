<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理地点</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100vh;
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: #091525; border-bottom: 2px solid #1e3a5f;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #header h1 { font-size: 22px; font-weight: 800; color: #f59e0b; }
    .back-btn {
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 10px;
      color: #90caf9; font-size: 14px; font-weight: 700; font-family: inherit;
      padding: 8px 14px; cursor: pointer; text-decoration: none;
    }

    #content {
      padding: 88px 16px 40px;
      max-width: 640px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* ── Add form ── */
    .form-card {
      background: #112240; border: 2px solid #1e3a5f; border-radius: 20px;
      padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .form-card h2 { font-size: 18px; font-weight: 800; color: #64b5f6; margin-bottom: 2px; }

    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 13px; color: #64748b; font-weight: 600; letter-spacing: 1px; }
    .form-input, .form-select {
      background: #0a1628; border: 2px solid #1e3a5f; border-radius: 12px;
      color: #f0f4f8; font-size: 18px; font-family: inherit;
      padding: 12px 16px; outline: none; width: 100%;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus { border-color: #f59e0b; }
    .form-input::placeholder { color: #334d66; }
    .form-select option { background: #0a1628; }

    .add-btn {
      background: #f59e0b; border: none; border-radius: 14px;
      color: #1a1000; font-size: 20px; font-weight: 900; font-family: inherit;
      padding: 14px; cursor: pointer; width: 100%;
      transition: opacity 0.15s, transform 0.1s;
    }
    .add-btn:active { opacity: 0.85; transform: scale(0.98); }

    /* ── Place list ── */
    .section-title {
      font-size: 14px; color: #334d66; font-weight: 700;
      letter-spacing: 2px; padding: 0 4px;
    }

    .places-list { display: flex; flex-direction: column; gap: 10px; }

    .place-row {
      background: #112240; border: 1px solid #1e3a5f; border-radius: 16px;
      padding: 16px 18px; display: flex; align-items: center; gap: 14px;
    }
    .place-row.from-json { border-style: dashed; opacity: 0.75; }

    .row-emoji { font-size: 28px; flex-shrink: 0; }
    .row-info { flex: 1; min-width: 0; }
    .row-name { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .row-addr { font-size: 13px; color: #64b5f6; }
    .row-source { font-size: 11px; color: #334d66; margin-top: 3px; }

    .row-clicks { font-size: 13px; color: #f59e0b; font-weight: 700; white-space: nowrap; }

    .delete-btn {
      background: #450a0a; border: 1px solid #7f1d1d; border-radius: 10px;
      color: #fca5a5; font-size: 14px; font-weight: 700; font-family: inherit;
      padding: 8px 14px; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s;
    }
    .delete-btn:active { background: #7f1d1d; }

    .clear-clicks-btn {
      background: #0a1e35; border: 1px solid #1e3a5f; border-radius: 10px;
      color: #546e7a; font-size: 13px; font-family: inherit;
      padding: 8px 14px; cursor: pointer; flex-shrink: 0;
    }

    .empty { color: #334d66; font-size: 16px; padding: 16px 4px; }

    /* ── Light mode ── */
    html.light body { background: #f0f4f8; color: #1e293b; }
    html.light #header { background: #e2e8f0; border-color: #cbd5e1; }
    html.light #header h1 { color: #d97706; }
    html.light .back-btn { background: #dbeafe; border-color: #93c5fd; color: #1e40af; }
    html.light .form-card { background: #fff; border-color: #cbd5e1; }
    html.light .form-input, html.light .form-select { background: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
    html.light .place-row { background: #fff; border-color: #cbd5e1; }
    html.light .row-name { color: #1e293b; }
  </style>
</head>
<body>

<div id="header">
  <a href="places.html" class="back-btn">← 返回</a>
  <h1>✏️ 管理地点</h1>
  <div></div>
</div>

<div id="content">

  <!-- Add form -->
  <div class="form-card">
    <h2>➕ 添加新地点</h2>
    <div class="form-row">
      <div class="form-label">地点名称（中文）</div>
      <input class="form-input" id="inp-name" placeholder="例：全科医生诊所" />
    </div>
    <div class="form-row">
      <div class="form-label">地址（English）</div>
      <input class="form-input" id="inp-addr" placeholder="e.g. 21 Channel Hwy, Kingston TAS 7050" />
    </div>
    <div class="form-row">
      <div class="form-label">分类</div>
      <select class="form-select" id="inp-cat">
        <option value="医疗">🏥 医疗</option>
        <option value="购物">🛒 购物</option>
        <option value="餐厅">🍜 餐厅</option>
        <option value="交通">🚌 交通</option>
        <option value="学校">🏫 学校</option>
        <option value="银行">🏦 银行</option>
        <option value="其他" selected>📍 其他</option>
      </select>
    </div>
    <button class="add-btn" onclick="addPlace()">保存地点</button>
  </div>

  <!-- Existing places -->
  <div class="section-title">已有地点</div>
  <div class="places-list" id="places-list"></div>

</div>

<script>
  const CUSTOM_KEY = 'places_custom';
  const CLICKS_KEY = 'place_clicks';
  const CAT = { 医疗:'🏥', 购物:'🛒', 餐厅:'🍜', 交通:'🚌', 学校:'🏫', 银行:'🏦', 其他:'📍' };

  let jsonPlaces   = [];
  let customPlaces = [];

  function getCustom() {
    try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch { return []; }
  }
  function saveCustom(arr) {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(arr));
  }
  function getClicks() {
    try { return JSON.parse(localStorage.getItem(CLICKS_KEY) || '{}'); } catch { return {}; }
  }

  function addPlace() {
    const name = document.getElementById('inp-name').value.trim();
    const addr = document.getElementById('inp-addr').value.trim();
    const cat  = document.getElementById('inp-cat').value;
    if (!name || !addr) { alert('请填写地点名称和地址'); return; }

    const custom = getCustom();
    const id = 'custom-' + Date.now();
    custom.push({ id, name, address: addr, category: cat });
    saveCustom(custom);

    document.getElementById('inp-name').value = '';
    document.getElementById('inp-addr').value = '';
    customPlaces = custom;
    render();
  }

  function deletePlace(id) {
    if (!confirm('确定删除这个地点？')) return;
    const custom = getCustom().filter(p => p.id !== id);
    saveCustom(custom);
    customPlaces = custom;
    render();
  }

  function clearClicks(id) {
    const clicks = getClicks();
    delete clicks[id];
    localStorage.setItem(CLICKS_KEY, JSON.stringify(clicks));
    render();
  }

  function render() {
    const clicks = getClicks();
    const list   = document.getElementById('places-list');
    const all    = [...jsonPlaces, ...customPlaces];

    if (!all.length) {
      list.innerHTML = '<div class="empty">暂时没有地点</div>';
      return;
    }

    list.innerHTML = all.map(p => {
      const emoji    = CAT[p.category] || '📍';
      const c        = clicks[p.id] || { count: 0 };
      const isJson   = jsonPlaces.some(j => j.id === p.id);
      const countStr = c.count ? `去过 ${c.count} 次` : '从未去过';

      return `<div class="place-row${isJson ? ' from-json' : ''}">
        <span class="row-emoji">${emoji}</span>
        <div class="row-info">
          <div class="row-name">${p.name}</div>
          <div class="row-addr">${p.address}</div>
          <div class="row-source">${isJson ? '🔒 系统地点' : '✏️ 手动添加'}</div>
        </div>
        <span class="row-clicks">${countStr}</span>
        ${c.count ? `<button class="clear-clicks-btn" onclick="clearClicks('${p.id}')">清除次数</button>` : ''}
        ${!isJson ? `<button class="delete-btn" onclick="deletePlace('${p.id}')">删除</button>` : ''}
      </div>`;
    }).join('');
  }

  async function init() {
    const t = Date.now();
    jsonPlaces   = await fetch('places.json?t=' + t).then(r => r.json()).catch(() => []);
    customPlaces = getCustom();
    render();
  }

  init();
</script>
<script src="theme.js"></script>
</body>
</html>
