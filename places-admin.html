<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理地点</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%; background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* ── Header ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: #091525; border-bottom: 2px solid #1e3a5f;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #header h1 { font-size: 22px; font-weight: 900; color: #f59e0b; }
    .back-btn {
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 12px;
      color: #90caf9; font-size: 16px; font-weight: 700; font-family: inherit;
      padding: 10px 18px; cursor: pointer; text-decoration: none;
    }

    #content { padding: 80px 14px 40px; display: flex; flex-direction: column; gap: 20px; }

    /* ── Form ── */
    .form-card {
      background: #112240; border: 2px solid #1e3a5f; border-radius: 20px;
      padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;
    }
    .form-card h2 { font-size: 20px; font-weight: 800; color: #64b5f6; }

    .form-label { font-size: 14px; color: #64748b; font-weight: 700; margin-bottom: 6px; display: block; }
    .form-input, .form-select {
      width: 100%; background: #0a1628; border: 2px solid #1e3a5f; border-radius: 14px;
      color: #f0f4f8; font-size: 18px; font-family: inherit;
      padding: 14px 16px; outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: #f59e0b; }
    .form-input::placeholder { color: #334d66; font-size: 16px; }
    .form-select option { background: #0a1628; }

    .translate-name-btn {
      background: #1e3a6e; border: 2px solid #2e5a8f; border-radius: 14px;
      color: #90caf9; font-size: 16px; font-weight: 700; font-family: inherit;
      padding: 0 18px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .translate-name-btn:active { background: #2e5a8f; }

    .add-btn {
      width: 100%; background: #f59e0b; border: none; border-radius: 16px;
      color: #1a1000; font-size: 22px; font-weight: 900; font-family: inherit;
      padding: 16px; cursor: pointer; margin-top: 4px;
    }
    .add-btn:active { opacity: 0.85; transform: scale(0.98); }

    /* ── List ── */
    .section-title {
      font-size: 14px; color: #334d66; font-weight: 700; letter-spacing: 2px;
    }
    .places-list { display: flex; flex-direction: column; gap: 10px; }

    .place-row {
      background: #112240; border: 1px solid #1e3a5f; border-radius: 18px;
      padding: 16px;
    }
    .place-row.from-json { border-style: dashed; opacity: 0.7; }

    .row-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .row-emoji { font-size: 32px; flex-shrink: 0; }
    .row-info { flex: 1; min-width: 0; }
    .row-name { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 3px; }
    .row-addr { font-size: 13px; color: #64b5f6; line-height: 1.4; word-break: break-word; }
    .row-source { font-size: 12px; color: #334d66; margin-top: 3px; }

    .row-bottom { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row-clicks {
      font-size: 14px; font-weight: 800; color: #f59e0b;
      background: #0a1e35; border-radius: 8px; padding: 5px 12px;
    }

    .btn-sm {
      border-radius: 10px; font-size: 14px; font-weight: 700; font-family: inherit;
      padding: 8px 16px; cursor: pointer; border: 1px solid;
    }
    .btn-delete { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    .btn-delete:active { background: #7f1d1d; }
    .btn-clear  { background: #0a1628; border-color: #1e3a5f; color: #546e7a; }
    .btn-clear:active  { background: #1e3a5f; }
    .btn-edit   { background: #1e3a6e; border-color: #2e5a8f; color: #90caf9; }
    .btn-edit:active   { background: #2e5a8f; }

    .img-pick-btn {
      display: inline-block; background: #1e3a6e; border: 2px solid #2e5a8f;
      border-radius: 14px; color: #90caf9; font-size: 16px; font-weight: 700;
      padding: 12px 20px; cursor: pointer;
    }
    .cancel-btn {
      width: 100%; background: #1e3a6e; border: 2px solid #2e5a8f; border-radius: 16px;
      color: #90caf9; font-size: 18px; font-weight: 800; font-family: inherit;
      padding: 14px; cursor: pointer; margin-top: 6px;
    }
    .cancel-btn:active { background: #2e5a8f; }
    .form-card.editing { border-color: #f59e0b; }

    .img-clear-btn {
      background: #450a0a; border: 1px solid #7f1d1d; border-radius: 12px;
      color: #fca5a5; font-size: 14px; font-weight: 700; font-family: inherit;
      padding: 10px 16px; cursor: pointer; margin-left: 8px;
    }
    .empty { color: #334d66; font-size: 18px; padding: 12px 4px; }

    /* ── Lock screen ── */
    #lock-screen {
      position: fixed; inset: 0; z-index: 200;
      background: #0d1b2a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 40px;
    }
    .lock-icon { font-size: 52px; }
    .lock-title { font-size: 26px; font-weight: 900; color: #f59e0b; }
    .lock-sub { font-size: 15px; color: #546e7a; }
    .lock-input {
      width: 100%; max-width: 260px;
      background: #112240; border: 2px solid #1e3a5f; border-radius: 16px;
      color: #f0f4f8; font-size: 30px; font-family: inherit;
      padding: 16px 20px; outline: none; text-align: center; letter-spacing: 10px;
    }
    .lock-input:focus { border-color: #f59e0b; }
    .lock-btn {
      width: 100%; max-width: 260px;
      background: #f59e0b; border: none; border-radius: 16px;
      color: #1a1000; font-size: 20px; font-weight: 900; font-family: inherit;
      padding: 16px; cursor: pointer;
    }
    .lock-btn:active { opacity: 0.85; transform: scale(0.98); }
    .lock-error { color: #fca5a5; font-size: 15px; min-height: 22px; }
  </style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-icon">🔐</div>
  <div class="lock-title">管理地点</div>
  <div class="lock-sub">请输入密码</div>
  <input class="lock-input" id="lock-input" type="password" inputmode="numeric"
         placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter')unlock()" />
  <button class="lock-btn" onclick="unlock()">确认</button>
  <div class="lock-error" id="lock-error"></div>
</div>

<div id="header">
  <a href="places.html" class="back-btn">← 返回</a>
  <h1>✏️ 管理地点</h1>
  <div></div>
</div>

<div id="content">

  <div class="form-card">
    <h2>➕ 添加新地点</h2>
    <div>
      <label class="form-label">地点名称（English）</label>
      <div style="display:flex;gap:8px;align-items:stretch;">
        <input class="form-input" id="inp-name-en" placeholder="e.g. GP Clinic" style="flex:1"
               oninput="scheduleTranslate()" />
        <button class="translate-name-btn" onclick="translateName()" id="trans-btn" title="翻译">翻译</button>
      </div>
    </div>
    <div>
      <label class="form-label">中文名称 <span id="trans-status" style="color:#64748b;font-weight:400;font-size:12px;"></span></label>
      <input class="form-input" id="inp-name-zh" placeholder="自动翻译，或手动输入" />
    </div>
    <div>
      <label class="form-label">地址（English）</label>
      <input class="form-input" id="inp-addr" placeholder="e.g. 21 Channel Hwy, Kingston TAS 7050" />
    </div>
    <div>
      <label class="form-label">电话号码（可选）</label>
      <input class="form-input" id="inp-phone" placeholder="e.g. 03 6229 0000" type="tel" />
    </div>
    <div>
      <label class="form-label">图片（可选）</label>
      <div id="img-preview-wrap" style="display:none;margin-bottom:8px;">
        <img id="img-preview" style="width:100%;border-radius:12px;max-height:160px;object-fit:cover;" />
      </div>
      <label class="img-pick-btn">
        📷 选择图片
        <input type="file" accept="image/*" id="inp-img" style="display:none" onchange="previewImage(this)" />
      </label>
      <button class="img-clear-btn" id="img-clear-btn" onclick="clearImage()" style="display:none">✕ 移除图片</button>
    </div>
    <div>
      <label class="form-label">区域</label>
      <input class="form-input" id="inp-cat" list="area-suggestions"
             placeholder="e.g. 金斯顿、市中心、叁地贝" autocomplete="off" />
      <datalist id="area-suggestions">
        <option value="金斯顿">
        <option value="叁地贝">
        <option value="市中心">
        <option value="北区">
        <option value="东区">
      </datalist>
    </div>
    <button class="add-btn" id="save-btn" onclick="savePlace()">保存地点</button>
    <button class="cancel-btn" id="cancel-btn" onclick="cancelEdit()" style="display:none">取消编辑</button>
  </div>

  <div class="section-title">已有地点</div>
  <div class="places-list" id="places-list"></div>

</div>

<script>
  const ADMIN_PWD  = '8888';
  const CUSTOM_KEY = 'places_custom';
  const CLICKS_KEY = 'place_clicks';

  function unlock() {
    const val = document.getElementById('lock-input').value;
    if (val === ADMIN_PWD) {
      sessionStorage.setItem('admin_unlocked', '1');
      document.getElementById('lock-screen').style.display = 'none';
      loadData();
    } else {
      document.getElementById('lock-error').textContent = '密码错误，请重试';
      document.getElementById('lock-input').value = '';
      document.getElementById('lock-input').focus();
    }
  }

  let jsonPlaces   = [];
  let customPlaces = [];

  function getCustom() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch { return []; } }
  function saveCustom(a) { localStorage.setItem(CUSTOM_KEY, JSON.stringify(a)); }
  function getClicks() { try { return JSON.parse(localStorage.getItem(CLICKS_KEY) || '{}'); } catch { return {}; } }

  let translateTimer = null;

  function scheduleTranslate() {
    clearTimeout(translateTimer);
    translateTimer = setTimeout(translateName, 900);
  }

  async function translateName() {
    const en = document.getElementById('inp-name-en').value.trim();
    if (!en) return;
    document.getElementById('trans-status').textContent = '翻译中…';
    let zh = '';
    try {
      const res  = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(en)}`);
      const data = await res.json();
      zh = data[0]?.map(x => x[0])?.join('') || '';
    } catch(e) {}
    if (!zh) {
      try {
        const res  = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(en)}&langpair=en|zh-CN`);
        const data = await res.json();
        zh = data.responseData?.translatedText || '';
      } catch(e) {}
    }
    if (zh) {
      document.getElementById('inp-name-zh').value = zh;
      document.getElementById('trans-status').textContent = '✓ 已翻译';
    } else {
      document.getElementById('trans-status').textContent = '翻译失败，请手动输入';
    }
  }

  let pendingImage = '';

  function previewImage(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 600;
        const ratio = Math.min(max / img.width, max / img.height, 1);
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        pendingImage = canvas.toDataURL('image/jpeg', 0.75);
        document.getElementById('img-preview').src = pendingImage;
        document.getElementById('img-preview-wrap').style.display = 'block';
        document.getElementById('img-clear-btn').style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    pendingImage = '';
    document.getElementById('inp-img').value = '';
    document.getElementById('img-preview-wrap').style.display = 'none';
    document.getElementById('img-clear-btn').style.display = 'none';
  }

  let editingId = null;

  function savePlace() {
    const nameEn = document.getElementById('inp-name-en').value.trim();
    const nameZh = document.getElementById('inp-name-zh').value.trim();
    const addr   = document.getElementById('inp-addr').value.trim();
    const phone  = document.getElementById('inp-phone').value.trim();
    const cat    = document.getElementById('inp-cat').value.trim();
    if (!nameZh || !addr) { alert('请填写中文名称和地址'); return; }

    let custom = getCustom();
    if (editingId) {
      custom = custom.map(p => {
        if (p.id !== editingId) return p;
        const updated = { ...p, name: nameZh, nameEn: nameEn || '', address: addr, category: cat };
        if (phone) updated.phone = phone; else delete updated.phone;
        if (pendingImage) updated.image = pendingImage;
        return updated;
      });
    } else {
      const entry = { id: 'c' + Date.now(), name: nameZh, nameEn: nameEn || '', address: addr, category: cat };
      if (phone) entry.phone = phone;
      if (pendingImage) entry.image = pendingImage;
      custom.push(entry);
    }

    saveCustom(custom);
    customPlaces = custom;
    resetForm();
    render();
  }

  function editPlace(id) {
    const p = customPlaces.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('inp-name-en').value = p.nameEn || '';
    document.getElementById('inp-name-zh').value = p.name   || '';
    document.getElementById('inp-addr').value    = p.address || '';
    document.getElementById('inp-phone').value   = p.phone  || '';
    document.getElementById('inp-cat').value     = p.category || '其他';
    document.getElementById('trans-status').textContent = '';
    if (p.image) {
      pendingImage = p.image;
      document.getElementById('img-preview').src = p.image;
      document.getElementById('img-preview-wrap').style.display = 'block';
      document.getElementById('img-clear-btn').style.display = 'inline-block';
    } else {
      clearImage();
    }
    document.getElementById('save-btn').textContent = '更新地点';
    document.getElementById('cancel-btn').style.display = 'block';
    document.querySelector('.form-card').classList.add('editing');
    document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    resetForm();
  }

  function resetForm() {
    editingId = null;
    document.getElementById('inp-name-en').value = '';
    document.getElementById('inp-name-zh').value = '';
    document.getElementById('inp-addr').value    = '';
    document.getElementById('inp-phone').value   = '';
    document.getElementById('inp-cat').value     = '';
    document.getElementById('trans-status').textContent = '';
    document.getElementById('save-btn').textContent = '保存地点';
    document.getElementById('cancel-btn').style.display = 'none';
    document.querySelector('.form-card').classList.remove('editing');
    clearImage();
  }

  function deletePlace(id) {
    if (!confirm('确定删除？')) return;
    const custom = getCustom().filter(p => p.id !== id);
    saveCustom(custom);
    customPlaces = custom;
    render();
  }

  function clearClicks(id) {
    const clicks = getClicks();
    delete clicks[id];
    localStorage.setItem(CLICKS_KEY, JSON.stringify(clicks));
    render();
  }

  function render() {
    const clicks = getClicks();
    const all    = [...jsonPlaces, ...customPlaces];
    const list   = document.getElementById('places-list');

    if (!all.length) { list.innerHTML = '<div class="empty">暂时没有地点</div>'; return; }

    list.innerHTML = all.map(p => {
      const emoji  = '📍';
      const c      = clicks[p.id] || { count: 0 };
      const isJson = jsonPlaces.some(j => j.id === p.id);

      return `<div class="place-row${isJson ? ' from-json' : ''}" data-id="${p.id}">
        ${p.image ? `<img src="${p.image}" style="width:100%;border-radius:10px;max-height:120px;object-fit:cover;margin-bottom:10px;">` : ''}
        <div class="row-top">
          <span class="row-emoji">${emoji}</span>
          <div class="row-info">
            <div class="row-name">${p.name}</div>
            ${p.nameEn ? `<div style="font-size:13px;color:#64748b;margin-bottom:2px;">${p.nameEn}</div>` : ''}
            <div class="row-addr">${p.address}</div>
            ${p.phone ? `<div style="font-size:13px;color:#6ee7b7;margin-top:2px;">📞 ${p.phone}</div>` : ''}
            <div class="row-source">${isJson ? '🔒 系统地点' : '✏️ 手动添加'}${p.category ? ' · ' + p.category : ''}</div>
          </div>
        </div>
        <div class="row-bottom">
          <span class="row-clicks">${c.count ? '去过 ' + c.count + ' 次' : '从未去过'}</span>
          ${c.count ? `<button class="btn-sm btn-clear" onclick="clearClicks('${p.id}')">清除次数</button>` : ''}
          ${!isJson ? `<button class="btn-sm btn-edit" onclick="editPlace('${p.id}')">✏️ 编辑</button>` : ''}
          ${!isJson ? `<button class="btn-sm btn-delete" onclick="deletePlace('${p.id}')">删除</button>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  async function loadData() {
    const t = Date.now();
    jsonPlaces   = await fetch('places.json?t=' + t).then(r => r.json()).catch(() => []);
    customPlaces = getCustom();
    render();
    const editId = new URLSearchParams(location.search).get('edit');
    if (editId) {
      const isCustom = customPlaces.some(p => p.id === editId);
      if (isCustom) {
        editPlace(editId);
      } else {
        const row = document.querySelector(`[data-id="${editId}"]`);
        if (row) row.scrollIntoView({ behavior: 'smooth' });
      }
    }
  }

  function init() {
    if (sessionStorage.getItem('admin_unlocked')) {
      document.getElementById('lock-screen').style.display = 'none';
      loadData();
    } else {
      setTimeout(() => document.getElementById('lock-input').focus(), 300);
    }
  }

  init();
</script>
</body>
</html>
