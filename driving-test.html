<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>驾照模拟题</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0d1b2a; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }

    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: #1e3a6e; color: #fff;
      padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .back-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px; color: #fff; font-size: 14px; font-weight: 700;
      padding: 7px 12px; text-decoration: none; white-space: nowrap;
    }
    #header h1 { flex: 1; font-size: 17px; font-weight: 900; }
    .tts-btn {
      background: #16a34a; border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 800;
      padding: 7px 12px; cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .tts-btn.speaking { background: #dc2626; }
    .auto-btn {
      background: #7c3aed; border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 800;
      padding: 7px 12px; cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .auto-btn.active { background: #dc2626; }

    #progress-bar-wrap { position: fixed; top: 52px; left: 0; right: 0; z-index: 99; height: 4px; background: #1e3a5f; }
    #progress-bar { height: 100%; background: #f59e0b; transition: width 0.2s; width: 0%; }

    #viewer {
      position: fixed; top: 56px; bottom: 84px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; overflow: hidden;
    }
    #tile-wrap {
      width: 100%; flex: 1; min-height: 0;
      padding: 8px 12px 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    #diagram-img {
      width: 100%; object-fit: contain;
      display: none; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); background: #fff;
      max-height: 38vh;
    }
    #question-text {
      flex: 1; min-height: 0; overflow-y: auto;
      background: #112240; border-radius: 10px;
      padding: 14px 16px;
      font-size: 17px; line-height: 1.8; color: #f0f4f8;
      white-space: pre-wrap; display: none;
    }
    #question-text::-webkit-scrollbar { width: 4px; }
    #question-text::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
    #options-area { display: none; flex-direction: column; gap: 7px; }
    .opt-btn {
      width: 100%; background: #112240; border: 1px solid #1e3a5f; border-radius: 10px;
      color: #f0f4f8; font-size: 15px; text-align: left; line-height: 1.5;
      padding: 10px 14px; cursor: pointer; font-family: inherit;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .opt-btn:active { opacity: 0.8; }
    .opt-key {
      flex-shrink: 0; font-weight: 900; color: #90caf9;
      background: #1e3a6e; border-radius: 6px;
      padding: 1px 8px; font-size: 14px; margin-top: 1px;
    }
    .opt-btn.selected { border-color: #f59e0b; background: #1a2e50; }
    .opt-btn.correct  { border-color: #16a34a; background: #052e16; }
    .opt-btn.correct .opt-key { background: #16a34a; color: #fff; }
    .opt-btn.wrong    { border-color: #dc2626; background: #2d0a0a; }
    .opt-btn.wrong .opt-key   { background: #dc2626; color: #fff; }

    #answer-area {
      flex-shrink: 0; display: none;
      align-items: center; justify-content: center; gap: 12px;
      padding: 6px 0 2px;
    }
    #answer-btn {
      background: #1e3a6e; border: 1px solid #2e5a9e; border-radius: 20px;
      color: #90caf9; font-size: 14px; font-weight: 700;
      padding: 7px 20px; cursor: pointer; font-family: inherit;
    }
    #answer-reveal {
      display: none; background: #064e3b; border-radius: 20px;
      color: #34d399; font-size: 16px; font-weight: 900;
      padding: 7px 20px; letter-spacing: 1px;
    }
    #score-chip {
      background: #1e3a6e; border-radius: 8px;
      color: #f0f4f8; font-size: 13px; font-weight: 700;
      padding: 5px 10px; white-space: nowrap; display: none;
    }
    #pos-label {
      flex-shrink: 0; text-align: center;
      font-size: 13px; color: #64748b; padding: 4px 0; font-weight: 600;
    }
    #empty-msg {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #475569; text-align: center; gap: 12px; padding: 32px;
    }
    #empty-msg .em-icon { font-size: 64px; }
    #empty-msg .em-text { font-size: 18px; font-weight: 600; }
    #empty-msg .em-sub  { font-size: 14px; color: #334d66; }

    #nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: #0a1628; border-top: 2px solid #1e3a5f;
      padding: 8px 16px; display: flex; align-items: center; gap: 10px;
      height: 84px;
    }
    .nav-arrow {
      flex-shrink: 0; background: #1e3a6e; border: none; border-radius: 14px;
      color: #fff; font-size: 22px; font-weight: 900;
      width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .nav-arrow:active { opacity: 0.8; transform: scale(0.95); }
    .nav-arrow:disabled { background: #1e3a5f; color: #334d66; cursor: default; }
    #page-jump-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #jump-label { font-size: 12px; color: #475569; }
    #jump-row { display: flex; gap: 6px; align-items: center; width: 100%; max-width: 240px; }
    #page-inp {
      flex: 1; border: 2px solid #1e3a5f; border-radius: 10px; background: #112240;
      color: #f0f4f8; font-size: 17px; font-family: inherit; text-align: center;
      padding: 7px 6px; outline: none; min-width: 0;
    }
    #page-inp:focus { border-color: #f59e0b; }
    #jump-btn {
      background: #1e3a6e; border: none; border-radius: 10px;
      color: #fff; font-size: 13px; font-weight: 700;
      padding: 9px 12px; cursor: pointer; font-family: inherit; white-space: nowrap;
    }

    @media print {
      #header, #nav-bar, #progress-bar-wrap, #pos-label { display: none !important; }
      body { background: #fff; }
      #viewer { position: static; overflow: visible; }
      #tile-wrap { page-break-after: always; }
    }
  </style>
</head>
<body>

<div id="header">
  <a href="roadrules.html" class="back-btn">← 返回</a>
  <h1>🎯 驾照模拟题</h1>
  <span id="score-chip"></span>
  <button class="tts-btn" id="tts-btn" onclick="toggleTTS()">🔊 朗读</button>
  <button class="auto-btn" id="auto-btn" onclick="toggleAuto()">▶ 自动</button>
</div>

<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div id="viewer">
  <div id="tile-wrap">
    <img id="diagram-img" src="" alt="diagram" />
    <div id="question-text"></div>
    <div id="options-area"></div>
    <div id="answer-area">
      <button id="answer-btn" onclick="toggleAnswer()">🔍 查看答案</button>
      <span id="answer-reveal"></span>
    </div>
    <div id="empty-msg">
      <div class="em-icon">🎯</div>
      <div class="em-text">暂无题目</div>
      <div class="em-sub">请使用管理页面添加模拟题图片并生成语音</div>
    </div>
    <div id="pos-label"></div>
  </div>
</div>

<div id="nav-bar">
  <button class="nav-arrow" id="btn-prev" onclick="go(-1)" disabled>‹</button>
  <div id="page-jump-wrap">
    <div id="jump-label">跳到第几题</div>
    <div id="jump-row">
      <input id="page-inp" type="number" min="1" placeholder="题号"
             onkeydown="if(event.key==='Enter')jumpTo()" />
      <button id="jump-btn" onclick="jumpTo()">跳转</button>
    </div>
  </div>
  <button class="nav-arrow" id="btn-next" onclick="go(1)" disabled>›</button>
</div>

<script>
  let tiles       = [];
  let cur         = 0;
  let userAnswers = []; // per-question selected answer string (e.g. "A" or "AC")

  async function loadManifest() {
    try {
      const res  = await fetch('driving-test-imgs/manifest.json?t=' + Date.now());
      const data = await res.json();
      tiles = (data.tiles || []).filter(t => !/_diagram\.(png|jpg|jpeg)$/i.test(t.file));
    } catch { tiles = []; }
    userAnswers = new Array(tiles.length).fill(null);
    if (tiles.length > 0) {
      document.getElementById('empty-msg').style.display = 'none';
      // Show score chip if any tile has a known answer
      if (tiles.some(t => t.answer)) {
        const chip = document.getElementById('score-chip');
        chip.style.display = 'inline-block';
        chip.textContent   = '✓ 0 / 0';
      }
      show(0);
    }
  }

  function show(idx) {
    if (idx < 0 || idx >= tiles.length) return;
    cur = idx;
    const t = tiles[idx];

    // Diagram
    const diagEl = document.getElementById('diagram-img');
    if (t.diagram) {
      diagEl.src           = 'driving-test-imgs/' + t.diagram;
      diagEl.style.display = 'block';
    } else {
      diagEl.style.display = 'none';
    }

    // Question text (only the stem, not options)
    const textEl = document.getElementById('question-text');
    const stem   = t.question || (t.options ? null : t.text);
    if (stem) {
      textEl.textContent   = stem;
      textEl.style.display = 'block';
    } else {
      textEl.style.display = 'none';
    }

    // Options
    renderOptions();

    // Answer area (only for text-only questions without structured options)
    const ansArea   = document.getElementById('answer-area');
    const ansReveal = document.getElementById('answer-reveal');
    ansReveal.style.display = 'none';
    ansReveal.textContent   = '';
    if (t.answer && !t.options) {
      ansArea.style.display = 'flex';
      document.getElementById('answer-btn').style.display = 'inline-block';
    } else {
      ansArea.style.display = 'none';
    }

    const pct = tiles.length > 1 ? (cur / (tiles.length - 1)) * 100 : 100;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('pos-label').textContent    = `第 ${cur + 1} 题 / 共 ${tiles.length} 题`;
    document.getElementById('btn-prev').disabled = cur === 0;
    document.getElementById('btn-next').disabled = cur === tiles.length - 1;
  }

  function renderOptions() {
    const t    = tiles[cur];
    const area = document.getElementById('options-area');
    if (!t || !t.options || Object.keys(t.options).length === 0) {
      area.style.display = 'none';
      area.innerHTML = '';
      return;
    }
    area.style.display = 'flex';
    const ua       = userAnswers[cur] || '';
    const answered = !!ua;
    area.innerHTML = ['A','B','C','D']
      .filter(v => t.options[v])
      .map(v => {
        let cls = 'opt-btn';
        if (answered) {
          if (t.answer && t.answer.includes(v)) cls += ' correct';
          else if (ua.includes(v))              cls += ' wrong';
        } else if (ua.includes(v)) {
          cls += ' selected';
        }
        return `<button class="${cls}" onclick="selectOption('${v}')">` +
               `<span class="opt-key">${v}</span>` +
               `<span>${escHtmlViewer(t.options[v])}</span>` +
               `</button>`;
      }).join('');
  }

  function selectOption(v) {
    const t = tiles[cur];
    if (!t || !t.options) return;
    // Toggle multi-select (for questions with multiple correct answers)
    let ua = userAnswers[cur] || '';
    ua = ua.includes(v) ? ua.replace(v, '') : (ua + v).split('').sort().join('');
    userAnswers[cur] = ua || null;
    renderOptions();
    updateScore();
  }

  function updateScore() {
    let correct = 0, answered = 0;
    tiles.forEach((t, i) => {
      if (userAnswers[i] && t.answer) {
        answered++;
        if (userAnswers[i] === t.answer) correct++;
      }
    });
    const chip = document.getElementById('score-chip');
    if (chip && chip.style.display !== 'none') {
      chip.textContent = `✓ ${correct} / ${answered}`;
    }
  }

  function escHtmlViewer(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleAnswer() {
    const t      = tiles[cur];
    const reveal = document.getElementById('answer-reveal');
    const btn    = document.getElementById('answer-btn');
    if (reveal.style.display === 'none' || !reveal.style.display) {
      reveal.textContent   = `✓ 正确答案：${t.answer}`;
      reveal.style.display = 'inline-block';
      btn.style.display    = 'none';
    } else {
      reveal.style.display = 'none';
      btn.style.display    = 'inline-block';
    }
  }

  function go(delta) { stopAuto(); stopTTS(); show(cur + delta); }

  // ── TTS ──
  let ttsAudio = null;
  let autoMode = false;

  function stopTTS() {
    if (ttsAudio) { ttsAudio.pause(); ttsAudio.currentTime = 0; ttsAudio = null; }
    const btn = document.getElementById('tts-btn');
    if (btn) { btn.textContent = '🔊 朗读'; btn.classList.remove('speaking'); }
  }

  function stopAuto() {
    autoMode = false; stopTTS();
    const btn = document.getElementById('auto-btn');
    if (btn) { btn.textContent = '▶ 自动'; btn.classList.remove('active'); }
  }

  function toggleAuto() {
    if (autoMode) { stopAuto(); return; }
    autoMode = true;
    const btn = document.getElementById('auto-btn');
    btn.textContent = '⏹ 停止'; btn.classList.add('active');
    playAutoStep();
  }

  function playAutoStep() {
    if (!autoMode) return;
    const tile = tiles[cur];
    if (!tile) { stopAuto(); return; }
    if (!tile.audio) {
      if (cur < tiles.length - 1) { show(cur + 1); playAutoStep(); } else stopAuto();
      return;
    }
    ttsAudio = new Audio('driving-test-imgs/' + tile.audio);
    document.getElementById('tts-btn').textContent = '⏹ 停止';
    document.getElementById('tts-btn').classList.add('speaking');
    ttsAudio.onended = () => {
      ttsAudio = null;
      document.getElementById('tts-btn').textContent = '🔊 朗读';
      document.getElementById('tts-btn').classList.remove('speaking');
      if (!autoMode) return;
      if (cur < tiles.length - 1) { show(cur + 1); playAutoStep(); } else stopAuto();
    };
    ttsAudio.onerror = () => {
      ttsAudio = null;
      if (!autoMode) return;
      if (cur < tiles.length - 1) { show(cur + 1); playAutoStep(); } else stopAuto();
    };
    ttsAudio.play();
  }

  function toggleTTS() {
    if (autoMode) { stopAuto(); return; }
    const btn = document.getElementById('tts-btn');
    if (ttsAudio && !ttsAudio.paused) { stopTTS(); return; }
    const tile = tiles[cur];
    if (!tile || !tile.audio) { alert('此题暂无语音，请在管理页面生成'); return; }
    ttsAudio = new Audio('driving-test-imgs/' + tile.audio);
    ttsAudio.onended = () => stopTTS();
    ttsAudio.onerror = () => stopTTS();
    btn.textContent = '⏹ 停止'; btn.classList.add('speaking');
    ttsAudio.play();
  }

  function jumpTo() {
    const val = parseInt(document.getElementById('page-inp').value);
    if (!val) return;
    const idx = val - 1;
    if (idx >= 0 && idx < tiles.length) { stopAuto(); show(idx); }
    else alert(`请输入 1 到 ${tiles.length} 之间的数字`);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { stopAuto(); go(1); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { stopAuto(); go(-1); }
  });

  let touchX = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 60) { stopAuto(); go(dx < 0 ? 1 : -1); }
  });

  loadManifest();
</script>
</body>
</html>
