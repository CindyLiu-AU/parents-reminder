<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Crazy English</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #0d1b2a; --surface: #112240; --border: #1e3a5f;
      --text:     #f0f4f8; --muted:   #64748b; --dim:    #334d66;
      --accent:   #f59e0b; --accent2: #3b82f6;
      --green:    #22c55e; --red:     #ef4444;
    }
    html[data-theme="light"] {
      --bg:      #f0f6ff; --surface: #ffffff; --border: #c5d8f0;
      --text:    #0f1f35; --muted:   #475569; --dim:    #94a3b8;
      --accent:  #d97706; --accent2: #2563eb;
      --green:   #16a34a; --red:     #dc2626;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }

    /* ── Header ── */
    #header {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }
    .header-row1 { display: flex; align-items: center; gap: 8px; }
    .header-row1 h1 { flex: 1; font-size: 18px; font-weight: 900; color: var(--accent); }
    .hbtn {
      flex-shrink: 0; background: var(--surface); border: 2px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 700;
      font-family: inherit; padding: 7px 12px; cursor: pointer;
    }
    .hbtn:active { opacity: 0.7; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 6px; margin-top: 10px; }
    .tab {
      flex: 1; padding: 8px 0; border-radius: 10px; border: 2px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; text-align: center;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #1a1000; }

    /* ── View mode toggle (browse only) ── */
    #view-toggle { display: flex; gap: 6px; margin-top: 8px; }
    .view-btn {
      flex: 1; padding: 6px 4px; border-radius: 8px; border: 2px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 700;
      font-family: inherit; cursor: pointer; text-align: center;
    }
    .view-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

    /* ── Word list ── */
    #word-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }

    .word-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 14px 14px 10px; cursor: pointer;
    }
    .word-card.expanded { border-color: var(--accent); }

    .word-top { display: flex; align-items: center; gap: 10px; }
    .word-type { font-size: 11px; font-weight: 700; background: var(--border); border-radius: 6px; padding: 2px 7px; color: var(--muted); flex-shrink: 0; }
    .word-en { font-size: 20px; font-weight: 800; color: var(--text); flex: 1; }
    .word-zh { font-size: 15px; color: var(--accent); font-weight: 700; margin-top: 4px; }

    /* ── Masked (hidden) text ── */
    .word-mask {
      filter: blur(7px); cursor: pointer; user-select: none; border-radius: 4px;
      transition: filter 0.2s;
    }

    /* ── Read-aloud highlight ── */
    .rw-word { border-radius: 4px; padding: 1px 3px; transition: background 0.1s, color 0.1s; }
    .rw-word.active { background: var(--accent); color: #1a1000; }
    .word-en.reading-all { background: rgba(245,158,11,0.18); border-radius: 6px; padding: 1px 5px; }

    .word-body { display: none; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .word-card.expanded .word-body { display: block; }

    .word-example { font-size: 14px; color: var(--muted); font-style: italic; margin-bottom: 10px; line-height: 1.5; }

    /* ── Pronunciation buttons ── */
    .mode-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .mode-btn {
      flex: 1; padding: 7px 4px; border-radius: 8px;
      border: 2px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .mode-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    .say-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .say-btn {
      flex: 1; min-width: 60px; padding: 10px 6px; border-radius: 10px;
      border: 2px solid var(--accent2); background: rgba(59,130,246,0.1);
      color: var(--accent2); font-size: 13px; font-weight: 800; font-family: inherit;
      cursor: pointer; text-align: center;
    }
    .say-btn:active { opacity: 0.7; }
    .say-btn.running { background: rgba(59,130,246,0.25); border-color: var(--green); color: var(--green); }
    .say-progress { font-size: 13px; color: var(--green); font-weight: 700; margin-top: 6px; text-align: center; }

    /* ── Add form ── */
    #add-panel { padding: 14px; display: none; flex-direction: column; gap: 12px; }
    #add-panel.visible { display: flex; }
    .form-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--surface); border: 2px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 16px; font-family: inherit;
      padding: 10px 12px; outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--accent2); }
    .form-textarea { min-height: 70px; resize: vertical; }
    .form-select { cursor: pointer; }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--accent); color: #1a1000; font-size: 16px; font-weight: 900;
      font-family: inherit; cursor: pointer;
    }
    .submit-btn:active { opacity: 0.8; }

    /* ── Empty state ── */
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 16px; }

    /* ── Pull-to-refresh ── */
    #pull-indicator {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(-60px);
      background: var(--accent); color: #1a1000; border-radius: 0 0 20px 20px;
      padding: 6px 20px; font-size: 14px; font-weight: 800; z-index: 999;
      transition: transform 0.2s; pointer-events: none;
    }

    /* ── Delete button ── */
    .del-btn {
      float: right; background: none; border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--muted); font-size: 12px;
      padding: 4px 8px; cursor: pointer; font-family: inherit; margin-left: 8px;
    }
    .del-btn:active { color: var(--red); border-color: var(--red); }

    /* ── Game panel ── */
    #game-panel { display: none; padding: 14px; }
    #game-panel.visible { display: block; }

    .game-intro { text-align: center; color: var(--muted); padding: 20px 0 4px; font-size: 15px; line-height: 1.6; }
    .game-start-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--accent2); color: #fff; font-size: 16px; font-weight: 900;
      font-family: inherit; cursor: pointer; margin-top: 14px;
    }
    .game-start-btn:active { opacity: 0.8; }
    .game-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .game-score { font-size: 14px; font-weight: 800; }
    .game-score .ok { color: var(--green); }
    .game-score .err { color: var(--red); }
    .game-new-btn {
      margin-left: auto; padding: 6px 12px; border-radius: 8px; border: 2px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 700;
      font-family: inherit; cursor: pointer;
    }
    .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .game-tile {
      padding: 12px 8px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; text-align: center;
      min-height: 52px; display: flex; align-items: center; justify-content: center;
      word-break: break-word; transition: border-color 0.15s, background 0.15s;
    }
    .game-tile.selected { border-color: var(--accent2); background: rgba(59,130,246,0.18); color: var(--accent2); }
    .game-tile.matched  { border-color: var(--green);  background: rgba(34,197,94,0.12);  color: var(--green);  opacity: 0.55; cursor: default; }
    .game-tile.wrong    { border-color: var(--red);    background: rgba(239,68,68,0.15);  animation: shake 0.35s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
    .game-win {
      text-align: center; padding: 24px 0 10px; font-size: 22px; font-weight: 900;
    }
    .game-win .sub { font-size: 15px; color: var(--green); margin-top: 6px; }
  </style>
</head>
<body>

<div id="pull-indicator">↓ 下拉刷新</div>

<div id="header">
  <div class="header-row1">
    <h1>🗣 Crazy English</h1>
    <button class="hbtn" onclick="toggleTheme()">☀️</button>
    <button class="hbtn" id="count-badge" style="color:var(--accent)">0 词</button>
  </div>
  <div class="tabs" style="margin-top:10px">
    <button class="tab active" id="tab-browse" onclick="showTab('browse')">📖 学习</button>
    <button class="tab" id="tab-game"   onclick="showTab('game')">🎮 游戏</button>
    <button class="tab" id="tab-add"    onclick="showTab('add')">➕ 添加</button>
  </div>
  <div id="view-toggle">
    <button class="view-btn active" data-mode="both"    onclick="setViewMode('both')">👁 双语</button>
    <button class="view-btn"        data-mode="hide-en" onclick="setViewMode('hide-en')">🙈 隐藏英文</button>
    <button class="view-btn"        data-mode="hide-zh" onclick="setViewMode('hide-zh')">🙈 隐藏中文</button>
  </div>
</div>

<div id="word-list"></div>

<div id="game-panel">
  <div class="game-intro">把左边的英文和右边的中文连起来<br>点击左边一个，再点右边一个</div>
  <button class="game-start-btn" onclick="startGame()">🎮 开始游戏</button>
</div>

<div id="add-panel">
  <div>
    <div class="form-label">英文单词 / 短语 / 句子 *</div>
    <input class="form-input" id="f-word" placeholder="e.g. apple / turn left / How are you?" oninput="onWordInput()" />
    <div id="translate-status" style="font-size:12px;color:var(--muted);margin-top:4px;min-height:16px"></div>
  </div>
  <div>
    <div class="form-label">中文意思 *</div>
    <input class="form-input" id="f-zh" placeholder="e.g. 苹果" />
  </div>
  <div>
    <div class="form-label">类型</div>
    <select class="form-select" id="f-type">
      <option value="word">单词 Word</option>
      <option value="phrase">短语 Phrase</option>
      <option value="sentence">句子 Sentence</option>
    </select>
  </div>
  <div>
    <div class="form-label">例句 (选填)</div>
    <textarea class="form-textarea" id="f-example" placeholder="e.g. I eat an apple every day."></textarea>
  </div>
  <button class="submit-btn" onclick="addWord()">✅ 添加</button>
</div>

<script>
  const FB_URL = 'https://parents-reminder-places-default-rtdb.asia-southeast1.firebasedatabase.app/crazy-english.json';
  const THEME_KEY = 'ce_theme';

  let allWords    = [];
  let activeTab   = 'browse';
  let expandedId  = null;
  let ttsVoiceEn  = null;
  let isRepeating = false;
  let repeatStop  = false;
  let cardModes   = {};           // id -> 'word' | 'normal'
  let viewMode    = 'both';       // 'both' | 'hide-en' | 'hide-zh'

  // ── Theme ──
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); }
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem(THEME_KEY, next); applyTheme(next);
  }
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

  // ── TTS ──
  function initVoices() {
    const v = speechSynthesis.getVoices();
    if (!v.length) return false;
    const en = v.filter(x => x.lang.startsWith('en'));
    ttsVoiceEn = en.find(x => x.name.includes('Google') && x.lang === 'en-AU')
              || en.find(x => x.name.includes('Google') && x.lang === 'en-GB')
              || en.find(x => x.name.includes('Google'))
              || en.find(x => /Natural|Neural|Online/.test(x.name) && x.lang.startsWith('en-AU'))
              || en.find(x => /Natural|Neural|Online/.test(x.name) && x.lang.startsWith('en-GB'))
              || en.find(x => /Natural|Neural|Online/.test(x.name))
              || en.find(x => x.name === 'Karen')
              || en.find(x => x.name === 'Daniel')
              || en.find(x => x.name === 'Samantha')
              || en.find(x => !x.localService && x.lang === 'en-AU')
              || en.find(x => !x.localService && x.lang === 'en-GB')
              || en.find(x => !x.localService)
              || en.find(x => x.lang === 'en-AU')
              || en.find(x => x.lang === 'en-GB')
              || en[0] || null;
    return true;
  }
  speechSynthesis.addEventListener('voiceschanged', initVoices);
  let _vp = 0;
  const _vt = setInterval(() => { if (initVoices() || ++_vp > 30) clearInterval(_vt); }, 200);
  setInterval(() => { if (speechSynthesis.paused) speechSynthesis.resume(); }, 100);

  const delay = ms => new Promise(r => setTimeout(r, ms));

  function sayEnglish(text) {
    return new Promise(resolve => {
      if (!text) { resolve(); return; }
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-AU'; utt.rate = 0.8; utt.pitch = 1.0;
      if (ttsVoiceEn) utt.voice = ttsVoiceEn;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      utt.onend = finish; utt.onerror = finish;
      setTimeout(finish, Math.max(3000, text.length * 120));
      speechSynthesis.speak(utt);
    });
  }

  function setMode(id, mode) {
    cardModes[id] = mode;
    document.querySelectorAll('.mode-btn[data-id="' + id + '"]').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  }

  function clearHighlight(id) {
    const el = document.getElementById('word-en-' + id);
    if (!el) return;
    el.classList.remove('reading-all');
    const orig = el.dataset.orig;
    if (orig !== undefined) { el.textContent = orig; delete el.dataset.orig; }
  }

  async function sayWordByWord(text, id) {
    if (!text) return;
    const words = text.trim().split(/\s+/);
    const el = document.getElementById('word-en-' + id);
    if (el) {
      el.dataset.orig = text;
      el.innerHTML = words.map((w, i) => `<span class="rw-word" id="rw-${id}-${i}">${w}</span>`).join(' ');
    }
    for (let i = 0; i < words.length && !repeatStop; i++) {
      document.querySelectorAll(`#word-en-${id} .rw-word`).forEach(s => s.classList.remove('active'));
      const span = document.getElementById(`rw-${id}-${i}`);
      if (span) span.classList.add('active');
      await sayEnglish(words[i]);
      if (i < words.length - 1 && !repeatStop) await delay(600);
    }
    clearHighlight(id);
  }

  async function sayNormalHighlighted(text, id) {
    const el = document.getElementById('word-en-' + id);
    if (el) el.classList.add('reading-all');
    await sayEnglish(text);
    if (el) el.classList.remove('reading-all');
  }

  async function startRepeat(id, times) {
    const word = allWords.find(w => w.id === id);
    if (!word) return;
    stopRepeat();
    isRepeating = true; repeatStop = false;
    const isMulti = word.word.trim().split(/\s+/).length > 1;
    const mode = isMulti ? (cardModes[id] || 'normal') : 'normal';
    const prog = document.getElementById('prog-' + id);
    document.querySelectorAll('.say-btn[data-id="' + id + '"]').forEach(b => b.classList.remove('running'));
    document.getElementById('say-' + id + '-' + times).classList.add('running');
    for (let i = 1; i <= times && !repeatStop; i++) {
      if (prog) prog.textContent = `第 ${i} / ${times} 次`;
      if (mode === 'word') await sayWordByWord(word.word, id);
      else await sayNormalHighlighted(word.word, id);
      if (!repeatStop && i < times) await delay(700);
    }
    if (!repeatStop && prog) prog.textContent = `✓ 已朗读 ${times} 次`;
    isRepeating = false;
    clearHighlight(id);
    document.querySelectorAll('.say-btn[data-id="' + id + '"]').forEach(b => b.classList.remove('running'));
  }

  function stopRepeat() {
    repeatStop = true; isRepeating = false;
    speechSynthesis.cancel();
    // clear any active highlights
    document.querySelectorAll('.rw-word.active').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.reading-all').forEach(s => s.classList.remove('reading-all'));
  }

  // ── View mode ──
  function setViewMode(mode) {
    viewMode = mode;
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.mode === mode));
    render();
  }

  function revealMask(el, e) {
    e.stopPropagation();
    el.classList.remove('word-mask');
    el.onclick = null;
  }

  // ── Tabs ──
  function showTab(tab) {
    stopRepeat();
    activeTab = tab;
    ['browse','game','add'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    });
    document.getElementById('word-list').style.display  = tab === 'browse' ? 'flex' : 'none';
    document.getElementById('game-panel').classList.toggle('visible', tab === 'game');
    document.getElementById('add-panel').classList.toggle('visible', tab === 'add');
    document.getElementById('view-toggle').style.display = tab === 'browse' ? 'flex' : 'none';
    if (tab === 'add') setTimeout(() => document.getElementById('f-word').focus(), 50);
  }

  // ── Expand/collapse ──
  function toggleCard(id) {
    stopRepeat();
    expandedId = expandedId === id ? null : id;
    render();
  }

  // ── Render ──
  function render() {
    const el = document.getElementById('word-list');
    document.getElementById('count-badge').textContent = allWords.length + ' 词';
    if (!allWords.length) {
      el.innerHTML = '<div class="empty">还没有单词<br>点击 ➕ 添加 开始吧！</div>';
      return;
    }
    const TYPE_LABEL = { word: '单词', phrase: '短语', sentence: '句子' };
    const hideEn = viewMode === 'hide-en';
    const hideZh = viewMode === 'hide-zh';
    el.innerHTML = allWords.map(w => {
      const exp = expandedId === w.id;
      const enMask = hideEn ? ' class="word-en word-mask" onclick="revealMask(this,event)"' : ' class="word-en"';
      const zhMask = hideZh ? ' class="word-zh word-mask" onclick="revealMask(this,event)"' : ' class="word-zh"';
      const isMultiWord = w.word.trim().split(/\s+/).length > 1;
      return `<div class="word-card${exp ? ' expanded' : ''}" onclick="toggleCard('${w.id}')">
        <div class="word-top">
          <span class="word-type">${TYPE_LABEL[w.type] || w.type || '单词'}</span>
          <span id="word-en-${w.id}"${enMask}>${w.word}</span>
        </div>
        <div${zhMask}>${w.zh}</div>
        <div class="word-body">
          ${w.example ? `<div class="word-example">"${w.example}"</div>` : ''}
          ${isMultiWord ? `<div class="mode-row">
            <button class="mode-btn${(cardModes[w.id]||'normal')==='word'?' active':''}" data-id="${w.id}" data-mode="word" onclick="event.stopPropagation();setMode('${w.id}','word')">🔤 逐字</button>
            <button class="mode-btn${(cardModes[w.id]||'normal')==='normal'?' active':''}" data-id="${w.id}" data-mode="normal" onclick="event.stopPropagation();setMode('${w.id}','normal')">🔊 正常</button>
          </div>` : ''}
          <div class="say-row">
            <button class="say-btn" id="say-${w.id}-1" data-id="${w.id}" onclick="event.stopPropagation();startRepeat('${w.id}',1)">▶ 1次</button>
            <button class="say-btn" id="say-${w.id}-3" data-id="${w.id}" onclick="event.stopPropagation();startRepeat('${w.id}',3)">▶ 3次</button>
            <button class="say-btn" id="say-${w.id}-5" data-id="${w.id}" onclick="event.stopPropagation();startRepeat('${w.id}',5)">▶ 5次</button>
            <button class="say-btn" onclick="event.stopPropagation();stopRepeat()" style="border-color:var(--red);color:var(--red);background:rgba(239,68,68,0.1);flex:0 0 auto">⏹</button>
          </div>
          <div class="say-progress" id="prog-${w.id}"></div>
          <button class="del-btn" onclick="event.stopPropagation();deleteWord('${w.id}')">🗑 删除</button>
        </div>
      </div>`;
    }).join('');
  }

  // ── Game ──
  let gameState = null;

  function startGame() {
    if (allWords.length < 2) { alert('至少需要 2 个词才能开始游戏！'); return; }
    const pool = [...allWords].sort(() => Math.random() - 0.5).slice(0, Math.min(6, allWords.length));
    gameState = {
      words:      pool,
      rightOrder: pool.map((_,i) => i).sort(() => Math.random() - 0.5),
      leftSel:    null,
      rightSel:   null,
      matched:    new Set(),
      errors:     0,
      wrongFlash: false
    };
    renderGame();
  }

  function gameSelectLeft(idx) {
    if (!gameState || gameState.wrongFlash || gameState.matched.has(idx)) return;
    gameState.leftSel = idx;
    checkGameMatch();
  }

  function gameSelectRight(pos) {
    if (!gameState || gameState.wrongFlash) return;
    const idx = gameState.rightOrder[pos];
    if (gameState.matched.has(idx)) return;
    gameState.rightSel = idx;
    checkGameMatch();
  }

  function checkGameMatch() {
    renderGame();
    const { leftSel, rightSel, matched, words } = gameState;
    if (leftSel === null || rightSel === null) return;
    if (leftSel === rightSel) {
      const word = words[leftSel];
      matched.add(leftSel);
      gameState.leftSel = null; gameState.rightSel = null;
      renderGame();
      sayEnglish(word.word);
    } else {
      gameState.errors++;
      gameState.wrongFlash = true;
      renderGame();
      setTimeout(() => {
        gameState.leftSel = null; gameState.rightSel = null;
        gameState.wrongFlash = false;
        renderGame();
      }, 500);
    }
  }

  function renderGame() {
    const panel = document.getElementById('game-panel');
    if (!gameState) {
      panel.innerHTML = `
        <div class="game-intro">把左边的英文和右边的中文连起来<br>点击左边一个，再点右边一个</div>
        <button class="game-start-btn" onclick="startGame()">🎮 开始游戏</button>`;
      return;
    }
    const { words, rightOrder, leftSel, rightSel, matched, errors, wrongFlash } = gameState;
    const allDone = matched.size === words.length;
    let html = '';

    if (allDone) {
      html += `<div class="game-win">🎉 全部配对！`;
      html += `<div class="sub">${errors === 0 ? '完美！零错误 🌟' : `错了 ${errors} 次`}</div></div>`;
      html += `<button class="game-start-btn" onclick="startGame()">🔄 再来一局</button>`;
      panel.innerHTML = html; return;
    }

    html += `<div class="game-header">
      <div class="game-score">
        <span class="ok">✅ ${matched.size}/${words.length}</span>
        ${errors > 0 ? `&nbsp;<span class="err">❌ ${errors}</span>` : ''}
      </div>
      <button class="game-new-btn" onclick="startGame()">🔄 换一组</button>
    </div>`;

    html += `<div class="game-grid">`;
    words.forEach((w, i) => {
      const rightWordIdx = rightOrder[i];

      // Left tile (English)
      const lm = matched.has(i), ls = leftSel === i;
      const lw = wrongFlash && ls;
      const lc = 'game-tile' + (lm ? ' matched' : lw ? ' wrong' : ls ? ' selected' : '');
      html += `<button class="${lc}" ${lm ? '' : `onclick="gameSelectLeft(${i})"`}>${lm ? '✓ ' : ''}${w.word}</button>`;

      // Right tile (Chinese)
      const rm = matched.has(rightWordIdx), rs = rightSel === rightWordIdx;
      const rw = wrongFlash && rs;
      const rc = 'game-tile' + (rm ? ' matched' : rw ? ' wrong' : rs ? ' selected' : '');
      html += `<button class="${rc}" ${rm ? '' : `onclick="gameSelectRight(${i})"`}>${rm ? '✓ ' : ''}${words[rightWordIdx].zh}</button>`;
    });
    html += `</div>`;
    panel.innerHTML = html;
  }

  // ── Firebase ──
  async function loadWords() {
    try {
      const res = await fetch(FB_URL + '?t=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      allWords = Array.isArray(data) ? data : [];
    } catch { allWords = []; }
    render();
  }

  async function saveWords() {
    await fetch(FB_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(allWords)
    });
  }

  // ── Auto-translate ──
  let _translateTimer = null;
  function onWordInput() {
    clearTimeout(_translateTimer);
    const word = document.getElementById('f-word').value.trim();
    const status = document.getElementById('translate-status');
    if (!word) { status.textContent = ''; return; }
    status.textContent = '翻译中…';
    _translateTimer = setTimeout(() => autoTranslate(word), 700);
  }
  async function autoTranslate(word) {
    const status = document.getElementById('translate-status');
    try {
      const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|zh');
      const data = await res.json();
      if (data.responseStatus === 200 && data.responseData.translatedText) {
        document.getElementById('f-zh').value = data.responseData.translatedText;
        status.textContent = '✓ 已自动翻译';
      } else { status.textContent = ''; }
    } catch { status.textContent = ''; }
  }

  // ── Add word ──
  async function addWord() {
    const word = document.getElementById('f-word').value.trim();
    const zh   = document.getElementById('f-zh').value.trim();
    if (!word || !zh) { alert('请填写英文和中文意思'); return; }
    const entry = {
      id:      'w' + Date.now(),
      word, zh,
      type:    document.getElementById('f-type').value,
      example: document.getElementById('f-example').value.trim(),
      addedAt: new Date().toISOString().slice(0, 10)
    };
    allWords.unshift(entry);
    await saveWords();
    document.getElementById('f-word').value = '';
    document.getElementById('f-zh').value   = '';
    document.getElementById('f-example').value = '';
    document.getElementById('f-type').value = 'word';
    render();
    showTab('browse');
    expandedId = entry.id;
    render();
  }

  // ── Delete ──
  async function deleteWord(id) {
    if (!confirm('确定删除这个词？')) return;
    allWords = allWords.filter(w => w.id !== id);
    if (expandedId === id) expandedId = null;
    await saveWords();
    render();
  }

  // ── Pull-to-refresh ──
  let pullStartY = 0, pulling = false;
  const PULL_THRESHOLD = 80;
  const pullEl = document.getElementById('pull-indicator');

  document.addEventListener('touchstart', e => {
    if (window.scrollY === 0) { pullStartY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dist = e.touches[0].clientY - pullStartY;
    if (dist > 0) {
      const pct = Math.min(dist / PULL_THRESHOLD, 1);
      pullEl.style.transform = `translateX(-50%) translateY(${-60 + pct * 60}px)`;
      pullEl.textContent = dist >= PULL_THRESHOLD ? '↑ 释放刷新' : '↓ 下拉刷新';
    }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!pulling) return;
    const dist = e.changedTouches[0].clientY - pullStartY;
    pullEl.style.transform = 'translateX(-50%) translateY(-60px)';
    pulling = false;
    if (dist >= PULL_THRESHOLD) {
      pullEl.textContent = '🔄 刷新中…';
      pullEl.style.transform = 'translateX(-50%) translateY(0)';
      loadWords().then(() => setTimeout(() => { pullEl.style.transform = 'translateX(-50%) translateY(-60px)'; }, 800));
    }
  });

  loadWords();
</script>
</body>
</html>
