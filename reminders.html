<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>所有通知</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      padding: 24px 32px 100px;
      max-width: 1280px;
      margin: 0 auto;
    }

    #list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e3a5f;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #f59e0b;
    }

    header a { display: none; }

    .back-btn {
      position: fixed;
      bottom: 32px;
      right: 28px;
      font-size: 18px;
      color: #1a1000;
      text-decoration: none;
      background: #f59e0b;
      border: 2px solid #f59e0b;
      border-radius: 24px;
      padding: 14px 28px;
      z-index: 100;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(245,158,11,0.4);
    }

    .item {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .item-icon { font-size: 36px; flex-shrink: 0; }

    .item-body { flex: 1; }

    .item-type {
      font-size: 13px;
      color: #64b5f6;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .item-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .item-time {
      font-size: 28px;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 6px;
    }

    .item-date {
      font-size: 14px;
      color: #90caf9;
      margin-bottom: 8px;
    }

    .item-note {
      font-size: 16px;
      color: #81c784;
    }

    .day-badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 20px;
      vertical-align: middle;
      margin-left: 10px;
    }
    .day-badge.today    { background: #16a34a; color: #ffffff; }
    .day-badge.tomorrow { background: #ea580c; color: #ffffff; }
    .day-badge.later    { background: #7c3aed; color: #ffffff; }

    .checklist-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px; padding: 7px 14px;
      background: #0d2137; border: 1px solid #1e3a5f;
      border-radius: 10px; cursor: pointer;
      font-size: 14px; color: #90caf9;
      user-select: none;
    }
    .checklist-toggle:hover { border-color: #3b7dd8; }

    .checklist-body {
      margin-top: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .checklist-body.open { display: flex; }

    .checklist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 14px;
      background: #0d2137; border: 1px solid #1e3a5f;
      border-radius: 10px; cursor: pointer;
      font-size: 18px; color: #e2e8f0;
      user-select: none; transition: all .15s;
    }
    .checklist-item.done {
      background: #0a1e0e; border-color: #22c55e44;
      color: #64748b; text-decoration: line-through;
    }
    .checklist-tick {
      width: 24px; height: 24px; border-radius: 6px;
      border: 2px solid #1e3a5f; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; transition: all .15s;
    }
    .checklist-item.done .checklist-tick {
      background: #22c55e; border-color: #22c55e; color: #fff;
    }

    /* ── Item action bar ── */
    .item-actions {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;
    }
    .item-actions button {
      background: transparent; border: 1px solid #1e3a5f; border-radius: 8px;
      color: #64b5f6; font-size: 13px; padding: 5px 12px; cursor: pointer;
      font-family: inherit; transition: all .15s; white-space: nowrap;
    }
    .item-actions button:hover { border-color: #3b7dd8; background: rgba(59,125,216,.08); }
    .item-actions .btn-delete  { color: #f87171; border-color: #3d1515; }
    .item-actions .btn-delete:hover { border-color: #ef4444; background: rgba(239,68,68,.1); }
    .item-actions .btn-archive { color: #a78bfa; border-color: #2d1f4a; }
    .item-actions .btn-archive:hover { border-color: #7c3aed; background: rgba(124,58,237,.1); }

    /* ── Add button ── */
    #add-btn {
      background: #f59e0b; color: #1a1000; border: none;
      border-radius: 12px; padding: 10px 22px;
      font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
      box-shadow: 0 2px 8px rgba(245,158,11,0.3);
    }
    #add-btn:active { opacity: 0.8; }

    /* ── Add modal ── */
    #add-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
    }
    #add-modal.open { display: flex; }
    #add-card {
      background: #112240; border: 1px solid #2e5f9e; border-radius: 20px;
      padding: 28px 32px; width: 100%; max-width: 500px;
      display: flex; flex-direction: column; gap: 14px;
      max-height: 90vh; overflow-y: auto;
    }
    #add-card h2 { font-size: 22px; font-weight: 800; color: #f59e0b; margin-bottom: 4px; }
    .f-row { display: flex; flex-direction: column; gap: 6px; }
    .f-row label { font-size: 13px; color: #64b5f6; letter-spacing: 1px; font-weight: 700; }
    .f-row input, .f-row textarea, .f-row select {
      background: #0a1e35; border: 1px solid #1e3a5f; border-radius: 10px;
      padding: 10px 14px; color: #f0f4f8; font-size: 16px; font-family: inherit;
      outline: none; width: 100%;
    }
    .f-row input:focus, .f-row textarea:focus, .f-row select:focus { border-color: #f59e0b; }
    .f-row textarea { min-height: 72px; resize: vertical; }
    .f-row select option { background: #0a1e35; }
    .pin-pair { display: flex; gap: 8px; align-items: center; }
    .pin-pair input { flex: 1; }
    .pin-pair span { color: #64b5f6; font-size: 14px; white-space: nowrap; }
    .f-hint { font-size: 12px; color: #475569; margin-top: -8px; }
    #modal-status { font-size: 14px; min-height: 18px; }
    #modal-status.ok    { color: #4ade80; }
    #modal-status.error { color: #f87171; }
    #modal-status.loading { color: #94a3b8; }
    .modal-btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 4px; }
    .modal-btns button {
      padding: 11px 28px; border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; border: none; font-family: inherit;
    }
    .modal-btns .btn-cancel { background: #1e3a5f; color: #90caf9; }
    .modal-btns .btn-save   { background: #f59e0b; color: #1a1000; }
    .modal-btns .btn-save:disabled { background: #78450a; color: #94a3b8; cursor: not-allowed; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <header>
    <h1>📋 即将到来的通知</h1>
    <button id="add-btn" onclick="openAddModal()">＋ 新增通知</button>
  </header>
  <a class="back-btn" href="index.html">← 返回</a>

  <!-- Add notification modal -->
  <div id="add-modal">
    <div id="add-card">
      <h2>＋ 新增通知</h2>

      <div class="f-row">
        <label>📅 日期</label>
        <input type="date" id="f-date">
      </div>
      <div class="f-row">
        <label>⏰ 时间</label>
        <input type="time" id="f-time">
      </div>
      <div class="f-row">
        <label>🎨 图标（emoji）</label>
        <input type="text" id="f-icon" placeholder="📋" maxlength="4" style="max-width:80px">
      </div>
      <div class="f-row">
        <label>📝 标题</label>
        <input type="text" id="f-label" placeholder="例：Cindy 来访">
      </div>
      <div class="f-row">
        <label>💬 内容（可选）</label>
        <textarea id="f-message" placeholder="通知正文，留空则不显示"></textarea>
      </div>
      <div class="f-row">
        <label>📌 固定显示时间段（可选）</label>
        <div class="pin-pair">
          <input type="time" id="f-pin-from">
          <span>至</span>
          <input type="time" id="f-pin-until">
        </div>
        <div class="f-hint">设置后该时段内主页会优先显示此通知（支持跨夜）</div>
      </div>

      <div id="modal-status"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeAddModal()">取消</button>
        <button class="btn-save" id="modal-save-btn" onclick="saveNotice()">💾 保存</button>
      </div>
    </div>
  </div>

  <div id="list">加载中...</div>

  <script>
    const ICONS  = { coles: '🚚', visit: '🏠', power: '⚡', custom: '📝', trip: '🧳' };
    const LABELS = { coles: 'Coles 送货', visit: '家庭通知', power: '免费用电', custom: '通知', trip: '家庭旅行' };

    let allData        = [];
    let currentEditIdx = -1;

    function relativeDay(d) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dt = parseItemDateTime(d);
      const itemDay = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
      const diff = Math.round((itemDay - today) / 86400000);
      if (diff === 0) return { text: '今天', cls: 'today' };
      if (diff === 1) return { text: '明天', cls: 'tomorrow' };
      if (diff === 2) return { text: '后天', cls: 'later' };
      return { text: `${diff}天后`, cls: 'later' };
    }

    function badgeHTML(d) {
      const b = relativeDay(d);
      return b ? `<span class="day-badge ${b.cls}">${b.text}</span>` : '';
    }

    function renderItem(d) {
      const icon  = d.icon || ICONS[d.type] || '📝';
      const label = LABELS[d.type] || d.label || '通知';

      let title = '', time = '', date = '', note = '';

      if (d.type === 'coles') {
        title = `${d.date} 送货上门`;
        time  = d.time;
        date  = d.fulldate || '';
        note  = d.note ? `Cindy 说：${d.note}` : '请在家等候送货员 🏠 听到门铃请去开门';
      } else if (d.type === 'visit') {
        title = `${d.who || 'Cindy'} ${d.date}来家里`;
        time  = d.time;
        date  = d.fulldate || '';
        note  = d.note ? `Cindy 说：${d.note}` : '';
      } else if (d.type === 'power') {
        title = `${d.date}免费用电时段`;
        time  = d.time;
        date  = d.fulldate || '';
        note  = d.note ? `Cindy 说：${d.note}` : '请使用洗衣机、烘干机等电器';
      } else if (d.type === 'trip') {
        title = `${d.date} 去 ${d.destination}`;
        time  = d.time;
        date  = d.fulldate || '';
        note  = d.note ? `Cindy 说：${d.note}` : '';
      } else if (d.type === 'custom') {
        title = d.label || '通知';
        note  = d.message || '';
      }

      const clKey = `checklist_${d.fulldate || d.date}_${d.destination || d.label || ''}`;
      const clDone = (() => { try { return new Set(JSON.parse(localStorage.getItem(clKey) || '[]')); } catch { return new Set(); } })();
      const clHTML = d.checklist && d.checklist.length ? `
        <div class="checklist-toggle" onclick="toggleChecklist(this)">☑ 出行清单（${d.checklist.length} 项）▾</div>
        <div class="checklist-body">
          ${d.checklist.map((item, i) => `
            <div class="checklist-item${clDone.has(i) ? ' done' : ''}" onclick="tickItem(this,'${clKey}',${i},${JSON.stringify(d.checklist).replace(/"/g,'&quot;')})">
              <span class="checklist-tick">${clDone.has(i) ? '✓' : ''}</span>
              ${item}
            </div>`).join('')}
        </div>` : '';

      const idx = d._idx;
      return `
        <div class="item">
          <div class="item-icon">${icon}</div>
          <div class="item-body">
            <div class="item-type">${label}</div>
            <div class="item-title">${title}${badgeHTML(d)}</div>
            ${time ? `<div class="item-time">${time}</div>` : ''}
            ${date ? `<div class="item-date">${date}</div>` : ''}
            ${note ? `<div class="item-note">${note}</div>` : ''}
            ${clHTML}
            <div class="item-actions">
              <button onclick="openEditModal(${idx})">✏️ 编辑</button>
              <button class="btn-archive" onclick="archiveNotice(${idx})">📦 归档</button>
              <button class="btn-delete"  onclick="deleteNotice(${idx})">🗑️ 删除</button>
            </div>
          </div>
        </div>`;
    }

    function toggleChecklist(btn) {
      const body = btn.nextElementSibling;
      const open = body.classList.toggle('open');
      btn.textContent = open
        ? btn.textContent.replace('▾', '▴')
        : btn.textContent.replace('▴', '▾');
    }

    function tickItem(el, key, idx, items) {
      let done;
      try { done = new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch { done = new Set(); }
      if (done.has(idx)) { done.delete(idx); el.classList.remove('done'); el.querySelector('.checklist-tick').textContent = ''; }
      else               { done.add(idx);    el.classList.add('done');    el.querySelector('.checklist-tick').textContent = '✓'; }
      localStorage.setItem(key, JSON.stringify([...done]));
    }

    function parseItemDateTime(d) {
      const now = new Date();
      let year = now.getFullYear(), month = now.getMonth(), day = now.getDate();
      if (d.fulldate) {
        const m = d.fulldate.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
        if (m) { year = parseInt(m[1]); month = parseInt(m[2]) - 1; day = parseInt(m[3]); }
      } else if (d.date === '明天') {
        const t = new Date(now); t.setDate(t.getDate() + 1);
        year = t.getFullYear(); month = t.getMonth(); day = t.getDate();
      }
      let hour = 0, minute = 0;
      const tm = (d.time || '').match(/(上午|早上|下午|晚上)?\s*(\d{1,2}):(\d{2})/);
      if (tm) {
        const p = tm[1] || '';
        hour = parseInt(tm[2]); minute = parseInt(tm[3]);
        if ((p === '下午' || p === '晚上') && hour < 12) hour += 12;
        if ((p === '上午' || p === '早上') && hour === 12) hour = 0;
      }
      return new Date(year, month, day, hour, minute);
    }

    fetch('history.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        allData = data;
        if (!data.length) {
          document.getElementById('list').innerHTML = '<p style="color:#546e7a">暂无通知记录</p>';
          return;
        }
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);
        const upcoming = data
          .map((d, i) => ({ ...d, _idx: i }))
          .filter(d => !d.archived && (parseItemDateTime(d) >= todayStart || d.pin_from))
          .sort((a, b) => parseItemDateTime(a) - parseItemDateTime(b));
        document.getElementById('list').innerHTML = upcoming.length
          ? upcoming.map(renderItem).join('')
          : '<p style="color:#546e7a">暂无即将到来的通知</p>';
      });

    // ── GitHub helpers ────────────────────────────────────────
    const TOKEN_KEY = 'gh_sync_token';
    const API = 'https://api.github.com/repos/CindyLiu-AU/parents-reminder/contents/history.json';

    function encodeB64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin);
    }
    function decodeB64(b64) {
      const bin = atob(b64.replace(/\n/g, ''));
      return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
    }

    async function modifyData(mutateFn, commitMsg) {
      let token = localStorage.getItem(TOKEN_KEY);
      if (!token) {
        token = prompt('请输入 GitHub PAT（只需输入一次）：');
        if (!token) return false;
        localStorage.setItem(TOKEN_KEY, token.trim());
        token = token.trim();
      }
      try {
        const getRes = await fetch(API, { headers: { Authorization: `token ${token}` } });
        if (getRes.status === 401) { localStorage.removeItem(TOKEN_KEY); throw new Error('PAT 无效，请刷新重试'); }
        if (!getRes.ok) throw new Error(`GitHub ${getRes.status}`);
        const info    = await getRes.json();
        const current = JSON.parse(decodeB64(info.content));
        mutateFn(current);
        const putRes = await fetch(API, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: commitMsg, content: encodeB64(JSON.stringify(current, null, 2)), sha: info.sha })
        });
        if (!putRes.ok) { const e = await putRes.json().catch(() => ({})); throw new Error(e.message || `GitHub ${putRes.status}`); }
        return true;
      } catch(e) { return e; }
    }

    // ── Date helpers ──────────────────────────────────────────
    function toFulldate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      return `${y}年${m}月${d}日（${days[dt.getDay()]}）`;
    }
    function fulldateToInput(fulldate) {
      const m = (fulldate || '').match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if (!m) return '';
      return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    }

    // ── Modal helpers ─────────────────────────────────────────
    function setModalStatus(msg, cls) {
      const el = document.getElementById('modal-status');
      el.textContent = msg; el.className = cls || '';
    }

    function openAddModal() {
      currentEditIdx = -1;
      document.getElementById('add-card').querySelector('h2').textContent = '＋ 新增通知';
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('f-date').value    = today;
      document.getElementById('f-time').value    = '09:00';
      document.getElementById('f-icon').value    = '';
      document.getElementById('f-label').value   = '';
      document.getElementById('f-message').value = '';
      document.getElementById('f-pin-from').value  = '';
      document.getElementById('f-pin-until').value = '';
      document.getElementById('modal-save-btn').disabled = false;
      setModalStatus('');
      document.getElementById('add-modal').classList.add('open');
    }

    function openEditModal(idx) {
      currentEditIdx = idx;
      const d = allData[idx];
      document.getElementById('add-card').querySelector('h2').textContent = '✏️ 编辑通知';
      document.getElementById('f-date').value    = fulldateToInput(d.fulldate);
      document.getElementById('f-time').value    = d.time || '';
      document.getElementById('f-icon').value    = d.icon || ICONS[d.type] || '📋';
      document.getElementById('f-label').value   = d.label || LABELS[d.type] || '';
      document.getElementById('f-message').value = d.message || d.note || '';
      document.getElementById('f-pin-from').value  = d.pin_from  || '';
      document.getElementById('f-pin-until').value = d.pin_until || '';
      document.getElementById('modal-save-btn').disabled = false;
      setModalStatus('');
      document.getElementById('add-modal').classList.add('open');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('open');
    }

    async function saveNotice() {
      const dateStr  = document.getElementById('f-date').value;
      const timeStr  = document.getElementById('f-time').value;
      const icon     = document.getElementById('f-icon').value.trim() || '📋';
      const label    = document.getElementById('f-label').value.trim();
      const message  = document.getElementById('f-message').value.trim();
      const pinFrom  = document.getElementById('f-pin-from').value;
      const pinUntil = document.getElementById('f-pin-until').value;

      if (!dateStr) { setModalStatus('请选择日期', 'error'); return; }
      if (!timeStr) { setModalStatus('请选择时间', 'error'); return; }
      if (!label)   { setModalStatus('请填写标题', 'error'); return; }

      let notice;
      if (currentEditIdx >= 0) {
        notice = { ...allData[currentEditIdx] };
        notice.fulldate = toFulldate(dateStr);
        notice.time     = timeStr;
        notice.icon     = icon;
        notice.label    = label;
        if (message) { notice.message = message; notice.note = message; }
        else { delete notice.message; delete notice.note; }
        if (pinFrom && pinUntil) { notice.pin_from = pinFrom; notice.pin_until = pinUntil; }
        else { delete notice.pin_from; delete notice.pin_until; }
      } else {
        notice = { type: 'custom', icon, label, fulldate: toFulldate(dateStr), time: timeStr };
        if (message) notice.message = message;
        if (pinFrom && pinUntil) { notice.pin_from = pinFrom; notice.pin_until = pinUntil; }
      }

      setModalStatus('正在保存…', 'loading');
      document.getElementById('modal-save-btn').disabled = true;

      const commitMsg = currentEditIdx >= 0 ? `编辑通知：${label}` : `新增通知：${label}`;
      const result = await modifyData(current => {
        if (currentEditIdx >= 0) current[currentEditIdx] = notice;
        else current.unshift(notice);
      }, commitMsg);

      if (result === true) {
        setModalStatus('✓ 已保存！', 'ok');
        setTimeout(() => { closeAddModal(); location.reload(); }, 1000);
      } else {
        setModalStatus(`❌ ${result?.message || '保存失败'}`, 'error');
        document.getElementById('modal-save-btn').disabled = false;
      }
    }

    // ── Delete / Archive ──────────────────────────────────────
    async function deleteNotice(idx) {
      const d = allData[idx];
      const name = d.label || d.date || '此通知';
      if (!window.confirm(`确认删除「${name}」？此操作无法撤销。`)) return;
      const result = await modifyData(c => c.splice(idx, 1), `删除通知：${name}`);
      if (result === true) location.reload();
      else alert(`删除失败：${result?.message || ''}`);
    }

    async function archiveNotice(idx) {
      const d = allData[idx];
      const name = d.label || d.date || '此通知';
      const result = await modifyData(c => { c[idx].archived = true; }, `归档通知：${name}`);
      if (result === true) location.reload();
      else alert(`归档失败：${result?.message || ''}`);
    }

    // Close modal on backdrop click
    document.getElementById('add-modal').addEventListener('click', function(e) {
      if (e.target === this) closeAddModal();
    });
  </script>
  <script src="theme.js"></script>
</body>
</html>
