name: Sync Coles Orders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync orders from email
        env:
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
        run: python .github/scripts/sync_orders.py

      - name: Commit & push if changed
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git diff --quiet spending.json || (
            git add spending.json &&
            git commit -m "🛒 Auto-sync new Coles orders from email" &&
            git push
          )
