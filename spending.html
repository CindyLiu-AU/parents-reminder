<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cindy 的心意</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      padding: 24px 32px 100px;
      max-width: 1280px;
      margin: 0 auto;
    }

    #list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    header {
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1e3a5f;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    header h1 {
      font-size: 36px;
      font-weight: 700;
      color: #f59e0b;
    }

    header p {
      font-size: 20px;
      color: #546e7a;
      margin-top: 6px;
    }

    .owed-badge { text-align: right; flex-shrink: 0; }
    .owed-label { font-size: 14px; color: #64748b; margin-bottom: 4px; }
    .owed-amount { font-size: 36px; font-weight: 800; color: #f87171; line-height: 1; }
    .owed-sub { font-size: 13px; color: #64748b; margin-top: 3px; }

    .week-card {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }

    .week-title {
      font-size: 24px;
      font-weight: 700;
      color: #64b5f6;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .order-meta { font-size: 18px; color: #546e7a; margin-bottom: 18px; }

    .section-label {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #546e7a;
      margin-bottom: 10px;
      margin-top: 18px;
    }

    .section-label:first-of-type { margin-top: 0; }

    .toggle-btn {
      background: none;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      color: #546e7a;
      font-size: 18px;
      padding: 4px 10px;
      cursor: pointer;
      float: right;
      margin-top: -2px;
    }

    .toggle-btn:hover { color: #90caf9; border-color: #90caf9; }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 6px;
      border-bottom: 1px solid #0d1b2a;
      font-size: 20px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .item-row:last-of-type { border-bottom: none; }
    .item-row:hover { background: #1a2d42; }
    .item-row.fp { background: rgba(245,158,11,0.13); }
    .item-row.fp:hover { background: rgba(245,158,11,0.2); }
    .item-row.fp .item-name   { color: #fde68a; }
    .item-row.fp .item-amount { color: #fbbf24; font-weight: 700; }

    .item-name { color: #cfd8e3; flex: 1; padding-right: 12px; }
    .item-amount { color: #90a4ae; font-weight: 600; white-space: nowrap; }

    .star-tag { font-size: 20px; color: #f59e0b; text-shadow: 0 0 6px #f59e0b80; margin-left: 4px; }
    .star-empty { font-size: 14px; color: #253a52; margin-left: 4px; }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e3a5f;
    }

    .total-label { font-size: 20px; font-weight: 700; color: #90caf9; }
    .total-amount { font-size: 28px; font-weight: 800; color: #90caf9; }

    /* Parent section */
    .parent-section {
      background: #0d2137;
      border: 1px solid #f59e0b44;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 18px;
    }

    .parent-section-title {
      font-size: 20px;
      font-weight: 700;
      color: #f59e0b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .parent-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 6px;
      border-bottom: 1px solid #1e3a5f44;
      font-size: 20px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .parent-item-row:last-of-type { border-bottom: none; }
    .parent-item-row:hover { background: #152a40; }
    .parent-item-name { color: #e2e8f0; flex: 1; padding-right: 8px; }
    .parent-item-amount { color: #f59e0b; font-weight: 700; white-space: nowrap; }
    .parent-item-remove { color: #334155; font-size: 13px; margin-left: 8px; flex-shrink: 0; }
    .parent-item-row:hover .parent-item-remove { color: #f87171; }

    .parent-empty { color: #334155; font-size: 16px; padding: 6px 0 8px; }

    .parent-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 2px solid #f59e0b44;
    }

    .parent-total-label { font-size: 20px; font-weight: 700; color: #fbbf24; }
    .parent-total-amount { font-size: 34px; font-weight: 800; color: #4ade80; }

    .parent-note { font-size: 18px; color: #546e7a; margin-top: 8px; }

    .transfer-badge {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 16px;
      padding: 14px 0;
      border-radius: 12px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .badge-pending { background: #ff4d4d22; border: 2px solid #ff4d4d; color: #ff6b6b; }
    .badge-done    { background: #4ade8022; border: 2px solid #4ade80; color: #4ade80; }

    /* Add item controls */
    .add-parent-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: none;
      border: 1px dashed #2e5f9e;
      border-radius: 8px;
      color: #475569;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .add-parent-btn:hover { color: #90caf9; border-color: #90caf9; }

    .add-item-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }
    .add-input {
      background: #0d1b2a;
      border: 1px solid #2e5f9e;
      border-radius: 8px;
      color: #f0f4f8;
      padding: 8px 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    .add-input:focus { border-color: #f59e0b; }
    .add-input.name { flex: 1; }
    .add-input.amt  { width: 84px; }
    .add-confirm {
      background: #f59e0b; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 16px; font-weight: 700;
      color: #1a1000; cursor: pointer; font-family: inherit; flex-shrink: 0;
    }
    .add-cancel {
      background: #1e3a5f; border: none; border-radius: 8px;
      padding: 8px 12px; font-size: 16px; color: #64748b;
      cursor: pointer; font-family: inherit; flex-shrink: 0;
    }

    .item-row.locked        { cursor: default; }
    .item-row.locked:hover  { background: transparent; }
    .item-row.fp.locked:hover { background: rgba(245,158,11,0.13); }
    .parent-item-row.locked       { cursor: default; }
    .parent-item-row.locked:hover { background: transparent; }

    .transfer-badge { cursor: pointer; transition: filter 0.15s; }
    .transfer-badge:hover { filter: brightness(1.15); }

    .collapsible { overflow: hidden; transition: max-height 0.3s ease; }

    .back-btn {
      position: fixed;
      bottom: 32px;
      right: 28px;
      font-size: 18px;
      color: #1a1000;
      text-decoration: none;
      background: #f59e0b;
      border: 2px solid #f59e0b;
      border-radius: 24px;
      padding: 14px 28px;
      z-index: 100;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(245,158,11,0.4);
    }

    /* Sync button */
    #sync-btn {
      position: fixed;
      bottom: 32px;
      left: 28px;
      background: #1e3a6e;
      border: 1px solid #2e5f9e;
      border-radius: 50%;
      width: 48px; height: 48px;
      font-size: 22px;
      color: #90caf9;
      cursor: pointer;
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background 0.2s;
    }
    #sync-btn:hover { background: #2e5a8f; }

    #sync-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      align-items: center; justify-content: center;
    }
    #sync-overlay.show { display: flex; }
    #sync-box {
      background: #112240;
      border: 1px solid #2e5f9e;
      border-radius: 20px;
      padding: 28px 32px;
      width: 380px;
      display: flex; flex-direction: column; gap: 14px;
    }
    #sync-box h3 { font-size: 18px; color: #f59e0b; margin: 0; }
    #sync-box p  { font-size: 13px; color: #64748b; margin: 0; line-height: 1.5; }
    #sync-token {
      background: #0d1b2a; border: 1px solid #2e5f9e;
      border-radius: 8px; padding: 10px 14px;
      color: #f0f4f8; font-size: 14px; font-family: monospace;
      width: 100%; outline: none;
    }
    #sync-token:focus { border-color: #f59e0b; }
    #sync-go {
      background: #f59e0b; border: none; border-radius: 10px;
      padding: 12px; font-size: 16px; font-weight: 700;
      color: #1a1000; cursor: pointer; font-family: inherit;
    }
    #sync-go:disabled { opacity: 0.5; cursor: default; }
    #sync-cancel {
      background: none; border: 1px solid #2e5f9e; border-radius: 10px;
      padding: 10px; font-size: 14px; color: #64748b;
      cursor: pointer; font-family: inherit;
    }
    #sync-status { font-size: 14px; color: #22c55e; text-align: center; display: none; }
    #sync-error  { font-size: 14px; color: #f87171; text-align: center; display: none; }

    /* Save toast */
    #save-toast {
      position: fixed;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%);
      background: #112240;
      border: 1px solid #2e5f9e;
      border-radius: 12px;
      padding: 10px 22px;
      font-size: 15px;
      color: #90caf9;
      z-index: 400;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #save-toast.visible { opacity: 1; }

    /* Manual entry button + overlay */
    #manual-btn {
      position: fixed;
      bottom: 92px;
      left: 28px;
      background: #1a3a1a;
      border: 1px solid #2e6e2e;
      border-radius: 50%;
      width: 48px; height: 48px;
      font-size: 22px;
      color: #86efac;
      cursor: pointer;
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background 0.2s;
    }
    #manual-btn:hover { background: #254d25; }

    #manual-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 300;
      align-items: center; justify-content: center;
    }
    #manual-overlay.show { display: flex; }
    #manual-box {
      background: #112240;
      border: 1px solid #2e5f9e;
      border-radius: 20px;
      padding: 26px 30px;
      width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    #manual-box h3 { font-size: 18px; color: #86efac; margin: 0; }
    .mf-label { font-size: 13px; color: #64748b; margin-bottom: 2px; }
    .mf-input {
      background: #0d1b2a; border: 1px solid #2e5f9e;
      border-radius: 8px; padding: 9px 12px;
      color: #f0f4f8; font-size: 15px; font-family: inherit;
      width: 100%; outline: none;
    }
    .mf-input:focus { border-color: #86efac; }
    .mf-row { display: flex; gap: 8px; align-items: center; }
    .mf-item-row {
      display: flex; gap: 8px; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #1e3a5f44;
    }
    .mf-item-row:last-of-type { border-bottom: none; }
    .mf-name { flex: 1; }
    .mf-amt  { width: 90px; }
    .mi-star {
      background: none; border: 1px solid #2e5f9e; border-radius: 6px;
      color: #334155; font-size: 18px; padding: 4px 8px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .mi-star.on { color: #f59e0b; border-color: #f59e0b; }
    .mi-del {
      background: none; border: 1px solid #2e3a4e; border-radius: 6px;
      color: #475569; font-size: 14px; padding: 4px 8px; cursor: pointer;
    }
    .mi-del:hover { color: #f87171; border-color: #f87171; }
    #manual-add-row {
      background: none; border: 1px dashed #2e5f9e; border-radius: 8px;
      color: #475569; font-size: 14px; padding: 8px; cursor: pointer;
      font-family: inherit; width: 100%; margin-top: 4px;
    }
    #manual-add-row:hover { color: #86efac; border-color: #86efac; }
    #manual-confirm {
      background: #22c55e; border: none; border-radius: 10px;
      padding: 12px; font-size: 16px; font-weight: 700;
      color: #052e16; cursor: pointer; font-family: inherit;
    }
    #manual-cancel-btn {
      background: none; border: 1px solid #2e5f9e; border-radius: 10px;
      padding: 10px; font-size: 14px; color: #64748b;
      cursor: pointer; font-family: inherit;
    }
    #manual-err { font-size: 13px; color: #f87171; display: none; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <header>
    <div>
      <h1>🎁 Cindy 为爸妈的花费</h1>
      <p>每周 Coles 订单记录 · 爸妈部分单独列出</p>
    </div>
    <div class="owed-badge">
      <div class="owed-label">爸妈未转账合计</div>
      <div class="owed-amount" id="owed-total">—</div>
      <div class="owed-sub" id="owed-orders"></div>
    </div>
  </header>

  <div id="list">加载中...</div>
  <a class="back-btn" href="index.html">← 返回</a>

  <!-- Sync button -->
  <button id="sync-btn" title="同步新订单" onclick="openSync()">📧</button>

  <!-- Manual entry button -->
  <button id="manual-btn" title="线下单独购买" onclick="openManual()">🛍️</button>

  <!-- Manual entry overlay -->
  <div id="manual-overlay">
    <div id="manual-box">
      <h3>🛍️ 线下单独购买</h3>
      <div>
        <div class="mf-label">购买日期</div>
        <input id="mf-date" class="mf-input" type="date" />
      </div>
      <div>
        <div class="mf-label">备注</div>
        <input id="mf-note" class="mf-input" value="线下单独购买（非网上订单）" />
      </div>
      <div>
        <div class="mf-label" style="margin-bottom:8px">商品清单</div>
        <div id="mf-items"></div>
        <button id="manual-add-row" onclick="addManualRow()">➕ 添加商品</button>
      </div>
      <div id="manual-err"></div>
      <button id="manual-confirm" onclick="confirmManual()">✓ 确认添加</button>
      <button id="manual-cancel-btn" onclick="closeManual()">取消</button>
    </div>
  </div>

  <!-- Sync overlay -->
  <div id="sync-overlay">
    <div id="sync-box">
      <h3>📧 同步新订单</h3>
      <p>从邮件自动读取最新 Coles 订单。需要 GitHub Personal Access Token（<code>workflow</code> + <code>contents</code> 权限）。输入后自动记住。</p>
      <input id="sync-token" type="password" placeholder="ghp_xxxxxxxxxxxx" />
      <div id="sync-status"></div>
      <div id="sync-error"></div>
      <button id="sync-go" onclick="runSync()">🚀 开始同步</button>
      <button id="sync-cancel" onclick="closeSync()">取消</button>
    </div>
  </div>

  <!-- Save toast -->
  <div id="save-toast"></div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let data = [];
    let fileSha = '';
    let addingFor = null;          // di index of week with open add-item form
    const expandedSections = new Set(); // track which order-N divs are open

    const REPO      = 'CindyLiu-AU/parents-reminder';
    const WF_ID     = 'sync-orders.yml';
    const TOKEN_KEY = 'gh_sync_token';

    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

    // ── Encoding helpers ───────────────────────────────────────────────────────
    function decodeB64(str) {
      const bytes = Uint8Array.from(atob(str.replace(/\n/g, '')), c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }
    function encodeB64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin);
    }

    // ── Load ───────────────────────────────────────────────────────────────────
    async function init() {
      const token = getToken();
      if (token) {
        try {
          const res = await fetch(
            `https://api.github.com/repos/${REPO}/contents/spending.json`,
            { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }
          );
          if (res.ok) {
            const meta = await res.json();
            fileSha = meta.sha;
            data = JSON.parse(decodeB64(meta.content));
            render();
            return;
          }
        } catch(e) {}
      }
      // Fallback — no GitHub API (no token), can still view but not save
      const res = await fetch('spending.json?t=' + Date.now());
      data = await res.json();
      render();
    }

    // ── Save to GitHub ─────────────────────────────────────────────────────────
    async function saveData(msg) {
      const token = getToken();
      if (!token) {
        showToast('❌ 需要 GitHub Token，请点击 📧 按钮设置');
        return;
      }
      showToast('保存中…');
      try {
        if (!fileSha) {
          const metaRes = await fetch(
            `https://api.github.com/repos/${REPO}/contents/spending.json`,
            { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }
          );
          const meta = await metaRes.json();
          fileSha = meta.sha;
        }
        const res = await fetch(
          `https://api.github.com/repos/${REPO}/contents/spending.json`,
          {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: '✏️ Update spending.json',
              content: encodeB64(JSON.stringify(data, null, 2)),
              sha: fileSha,
            }),
          }
        );
        if (res.ok) {
          const result = await res.json();
          fileSha = result.content.sha;
          showToast(msg || '✅ 已保存');
        } else {
          const err = await res.json().catch(() => ({}));
          showToast('❌ 保存失败：' + (err.message || res.status));
        }
      } catch(e) {
        showToast('❌ 网络错误：' + e.message);
      }
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    function render() {
      // Header totals
      const unpaid = data.filter(w => !w.transferred);
      const owedTotal = unpaid.reduce((s, w) =>
        s + (w.items || []).filter(i => i.forParents).reduce((t, i) => t + (i.amount || 0), 0), 0);
      document.getElementById('owed-total').textContent = '$' + owedTotal.toFixed(2);
      document.getElementById('owed-orders').textContent = `共 ${unpaid.length} 笔未转账`;

      const sortedIdxs = data.map((_, i) => i).sort((a, b) =>
        (data[b].weekStart || '').localeCompare(data[a].weekStart || ''));

      document.getElementById('list').innerHTML = sortedIdxs.map((di, wi) => {
        const week  = data[di];
        const items = week.items || [];
        const pItems = items.filter(i => i.forParents);
        const orderTotal  = items.reduce((s, i) => s + (i.amount || 0), 0);
        const parentTotal = pItems.reduce((s, i) => s + (i.amount || 0), 0);
        const colId = `order-${wi}`;

        const locked = !!week.transferred;

        // Full order item rows (clickable to toggle ★ unless locked)
        const allItemsHTML = items.map((item, ii) => `
          <div class="item-row${item.forParents ? ' fp' : ''}${locked ? ' locked' : ''}"
               ${locked ? '' : `onclick="toggleFP(${di},${ii})" title="点击切换爸妈项目"`}>
            <span class="item-name">${item.name}${
              item.forParents
                ? '<span class="star-tag">★</span>'
                : (locked ? '' : '<span class="star-empty">☆</span>')
            }</span>
            <span class="item-amount">$${item.amount.toFixed(2)}</span>
          </div>`).join('');

        // Parent item rows (click to remove ★ unless locked)
        const parentRowsHTML = pItems.map(item => {
          const ii = items.indexOf(item);
          return `
          <div class="parent-item-row${locked ? ' locked' : ''}"
               ${locked ? '' : `onclick="toggleFP(${di},${ii})" title="点击取消爸妈标记"`}>
            <span class="parent-item-name">${item.name}</span>
            <span class="parent-item-amount">$${item.amount.toFixed(2)}</span>
            ${locked ? '' : '<span class="parent-item-remove">✕</span>'}
          </div>`;
        }).join('');

        // Add-item form or button — hidden when locked
        const addSection = locked ? '' : addingFor === di ? `
          <div class="add-item-form">
            <input id="add-name-${di}" class="add-input name" placeholder="商品名称"
                   onkeydown="if(event.key==='Enter')confirmAdd(${di})" />
            <input id="add-amt-${di}"  class="add-input amt"  placeholder="金额" type="number" step="0.01" min="0"
                   onkeydown="if(event.key==='Enter')confirmAdd(${di})" />
            <button class="add-confirm" onclick="confirmAdd(${di})">✓</button>
            <button class="add-cancel"  onclick="cancelAdd()">✗</button>
          </div>` : `
          <button class="add-parent-btn" onclick="startAdd(${di})">➕ 手动添加项目</button>`;

        const metaParts = [];
        if (week.orderNumber) metaParts.push(`订单 #${week.orderNumber}`);
        if (week.deliveryDate) metaParts.push(`送达 ${week.deliveryDate}`);
        if (week.note)         metaParts.push(week.note);

        return `
          <div class="week-card">
            <div class="week-title">📅 ${week.week}</div>
            ${metaParts.length ? `<div class="order-meta">${metaParts.join(' · ')}</div>` : ''}

            <div class="section-label">
              全部商品
              <button class="toggle-btn" onclick="toggleOrder('${colId}',this)">展开 ▼</button>
            </div>
            <div class="collapsible" id="${colId}" style="max-height:0px">
              ${allItemsHTML}
              <div class="total-row">
                <span class="total-label">订单合计</span>
                <span class="total-amount">$${orderTotal.toFixed(2)}</span>
              </div>
            </div>

            <div class="parent-section">
              <div class="parent-section-title">🧧 爸妈的部分</div>
              ${pItems.length ? parentRowsHTML : '<div class="parent-empty">暂无爸妈项目</div>'}
              ${pItems.length ? `
              <div class="parent-total-row">
                <span class="parent-total-label">爸妈转账金额</span>
                <span class="parent-total-amount">$${parentTotal.toFixed(2)}</span>
              </div>` : ''}
              <div class="transfer-badge ${week.transferred ? 'badge-done' : 'badge-pending'}"
                   onclick="toggleTransferred(${di})"
                   title="${week.transferred ? '点击撤销，标记为未转账' : '点击标记为已转账'}">
                ${week.transferred ? '✅ 已转账' : '⏳ 未转账 — 点击确认'}
              </div>
              ${addSection}
            </div>
          </div>`;
      }).join('');

      // Restore expanded sections after re-render
      expandedSections.forEach(id => {
        const el  = document.getElementById(id);
        const btn = el && el.previousElementSibling && el.previousElementSibling.querySelector('.toggle-btn');
        if (el)  el.style.maxHeight = '3000px';
        if (btn) btn.textContent = '收起 ▲';
      });

      // Focus name input if add-form just opened
      if (addingFor !== null) {
        setTimeout(() => {
          const el = document.getElementById(`add-name-${addingFor}`);
          if (el) el.focus();
        }, 30);
      }
    }

    // ── Toggle forParents ──────────────────────────────────────────────────────
    function toggleFP(di, ii) {
      const item = data[di].items[ii];
      item.forParents = !item.forParents;
      if (!item.forParents) delete item.forParents;
      render();
      saveData(item.forParents ? '★ 已标为爸妈项目' : '已取消爸妈标记');
    }

    // ── Toggle transferred ─────────────────────────────────────────────────────
    function toggleTransferred(di) {
      data[di].transferred = !data[di].transferred;
      if (data[di].transferred && addingFor === di) addingFor = null;
      render();
      saveData(data[di].transferred ? '✅ 已标记为转账' : '⏳ 已撤销转账状态');
    }

    // ── Add item ───────────────────────────────────────────────────────────────
    function startAdd(di) { addingFor = di; render(); }
    function cancelAdd()  { addingFor = null; render(); }

    function confirmAdd(di) {
      const name   = (document.getElementById(`add-name-${di}`).value || '').trim();
      const amount = parseFloat(document.getElementById(`add-amt-${di}`).value);
      if (!name || isNaN(amount) || amount <= 0) {
        document.getElementById(`add-name-${di}`).style.borderColor = '#f87171';
        return;
      }
      data[di].items.push({ name, amount: Math.round(amount * 100) / 100, forParents: true });
      addingFor = null;
      render();
      saveData('✅ 已添加：' + name);
    }

    // ── Toggle order collapsible ───────────────────────────────────────────────
    function toggleOrder(id, btn) {
      const el = document.getElementById(id);
      if (el.style.maxHeight === '0px') {
        el.style.maxHeight = '3000px';
        btn.textContent = '收起 ▲';
        expandedSections.add(id);
      } else {
        el.style.maxHeight = '0px';
        btn.textContent = '展开 ▼';
        expandedSections.delete(id);
      }
    }

    // ── Toast ──────────────────────────────────────────────────────────────────
    function showToast(msg) {
      const el = document.getElementById('save-toast');
      el.textContent = msg;
      el.classList.add('visible');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('visible'), 3000);
    }

    // ── Manual entry overlay ───────────────────────────────────────────────────
    let manualRows = [];

    function weekInfoFromDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const weekNum  = Math.ceil(d.getDate() / 7);
      const week     = `${d.getFullYear()}年${d.getMonth()+1}月第${weekNum}周`;
      const dow      = d.getDay();
      const monday   = new Date(d);
      monday.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
      const weekStart = monday.toISOString().split('T')[0];
      return { week, weekStart };
    }

    function openManual() {
      manualRows = [{ name: '', amount: '', forParents: true }];
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('mf-date').value = today;
      document.getElementById('mf-note').value = '线下单独购买（非网上订单）';
      document.getElementById('manual-err').style.display = 'none';
      renderManualRows();
      document.getElementById('manual-overlay').classList.add('show');
    }

    function closeManual() {
      document.getElementById('manual-overlay').classList.remove('show');
    }

    function renderManualRows() {
      document.getElementById('mf-items').innerHTML = manualRows.map((r, i) => `
        <div class="mf-item-row">
          <input class="mf-input mf-name" placeholder="商品名称" value="${r.name.replace(/"/g,'&quot;')}"
                 oninput="manualRows[${i}].name=this.value" />
          <input class="mf-input mf-amt" placeholder="金额" type="number" step="0.01" min="0" value="${r.amount}"
                 oninput="manualRows[${i}].amount=this.value" />
          <button class="mi-star${r.forParents?' on':''}" onclick="toggleManualFP(${i})"
                  title="爸妈项目">★</button>
          <button class="mi-del" onclick="removeManualRow(${i})">✕</button>
        </div>`).join('');
    }

    function addManualRow() {
      manualRows.push({ name: '', amount: '', forParents: true });
      renderManualRows();
      const inputs = document.querySelectorAll('.mf-name');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }

    function removeManualRow(i) {
      manualRows.splice(i, 1);
      renderManualRows();
    }

    function toggleManualFP(i) {
      manualRows[i].forParents = !manualRows[i].forParents;
      renderManualRows();
    }

    function confirmManual() {
      const dateStr = document.getElementById('mf-date').value;
      const note    = document.getElementById('mf-note').value.trim();
      const errEl   = document.getElementById('manual-err');

      if (!dateStr) { errEl.textContent = '请选择购买日期'; errEl.style.display='block'; return; }

      const validRows = manualRows.filter(r => r.name.trim() && parseFloat(r.amount) > 0);
      if (!validRows.length) { errEl.textContent = '请至少添加一件商品'; errEl.style.display='block'; return; }
      errEl.style.display = 'none';

      const { week, weekStart } = weekInfoFromDate(dateStr);
      const entry = {
        week,
        weekStart,
        deliveryDate: dateStr,
        note: note || '线下单独购买（非网上订单）',
        transferred: false,
        items: validRows.map(r => {
          const item = { name: r.name.trim(), amount: Math.round(parseFloat(r.amount) * 100) / 100 };
          if (r.forParents) item.forParents = true;
          return item;
        }),
      };

      // Prepend (newest first)
      data.unshift(entry);
      closeManual();
      render();
      saveData('✅ 已添加线下记录');
    }

    document.getElementById('manual-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('manual-overlay')) closeManual();
    });

    // ── Sync overlay ───────────────────────────────────────────────────────────
    function openSync() {
      document.getElementById('sync-overlay').classList.add('show');
      document.getElementById('sync-status').style.display = 'none';
      document.getElementById('sync-error').style.display  = 'none';
      document.getElementById('sync-token').value = getToken();
    }

    function closeSync() {
      document.getElementById('sync-overlay').classList.remove('show');
    }

    async function runSync() {
      const token = document.getElementById('sync-token').value.trim();
      if (!token) { showSyncErr('请输入 GitHub Token'); return; }
      localStorage.setItem(TOKEN_KEY, token);

      // Also reload fileSha with new token
      fileSha = '';

      const btn = document.getElementById('sync-go');
      btn.disabled = true;
      showSyncMsg('正在触发同步…');

      try {
        const res = await fetch(
          `https://api.github.com/repos/${REPO}/actions/workflows/${WF_ID}/dispatches`,
          {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ ref: 'main' }),
          }
        );
        if (res.status === 204) {
          showSyncMsg('✅ 已触发！GitHub Action 正在运行（约1分钟），完成后请刷新页面查看新订单。');
        } else {
          const body = await res.json().catch(() => ({}));
          showSyncErr(`失败 (${res.status})：${body.message || '请检查 Token 权限'}`);
          btn.disabled = false;
        }
      } catch(e) {
        showSyncErr('网络错误：' + e.message);
        btn.disabled = false;
      }
    }

    function showSyncMsg(msg) {
      const el = document.getElementById('sync-status');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('sync-error').style.display = 'none';
    }
    function showSyncErr(msg) {
      const el = document.getElementById('sync-error');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('sync-status').style.display = 'none';
    }

    document.getElementById('sync-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('sync-overlay')) closeSync();
    });

    // ── Boot ───────────────────────────────────────────────────────────────────
    init();
  </script>
  <script src="theme.js"></script>
</body>
</html>
