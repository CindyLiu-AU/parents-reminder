<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>常去地点</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: #091525; border-bottom: 2px solid #1e3a5f;
      padding: 10px 12px 8px;
      display: flex; flex-direction: column; gap: 7px;
    }
    /* Row 1: title + manage */
    .header-row1 {
      display: flex; align-items: center; justify-content: space-between;
    }
    #header h1 { font-size: 18px; font-weight: 900; color: #f59e0b; }
    .manage-btn {
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 10px;
      color: #90caf9; font-size: 13px; font-weight: 700; font-family: inherit;
      padding: 7px 13px; cursor: pointer; text-decoration: none; white-space: nowrap;
    }

    /* Row 2: search + sort toggle */
    .header-row2 { display: flex; gap: 8px; align-items: center; }
    .search-wrap { position: relative; flex: 1; }
    .search-input {
      width: 100%; background: #112240; border: 2px solid #1e3a5f; border-radius: 12px;
      color: #f0f4f8; font-size: 16px; font-family: inherit;
      padding: 10px 40px 10px 13px; outline: none;
    }
    .search-input:focus { border-color: #f59e0b; }
    .search-input::placeholder { color: #334d66; }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #546e7a; font-size: 16px;
      cursor: pointer; display: none; padding: 4px;
    }
    .sort-toggle {
      flex-shrink: 0; background: #112240; border: 2px solid #1e3a5f; border-radius: 12px;
      color: #64b5f6; font-size: 13px; font-weight: 800; font-family: inherit;
      padding: 10px 12px; cursor: pointer; white-space: nowrap; transition: all 0.15s;
    }
    .sort-toggle:active { background: #1e3a6e; }

    /* Row 3: category pills (hidden when no categories) */
    .cat-wrap {
      display: none; gap: 6px; overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .cat-wrap.visible { display: flex; }
    .cat-wrap::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0; background: #112240; border: 1px solid #1e3a5f; border-radius: 16px;
      color: #546e7a; font-size: 13px; font-weight: 700; font-family: inherit;
      padding: 5px 12px; cursor: pointer; white-space: nowrap;
    }
    .cat-pill.active { background: #0d2745; border-color: #64b5f6; color: #64b5f6; }

    /* ── Scrollable list ── */
    #place-list {
      position: fixed; top: 120px; bottom: 0; left: 0; right: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(24px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px;
    }

    .empty-state {
      text-align: center; color: #334d66; font-size: 22px;
      padding: 80px 20px; line-height: 2.2;
    }

    /* ── Place card ── */
    .place-card {
      background: #112240; border: 2px solid #1e3a5f; border-radius: 20px;
      padding: 18px 16px; cursor: pointer; active: scale(0.98);
      transition: transform 0.1s;
      user-select: none;
    }
    .place-card:active { transform: scale(0.97); background: #1a2e50; }
    .place-card.top-card { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245,158,11,0.18); }

    .top-label {
      font-size: 14px; font-weight: 800; color: #f59e0b;
      letter-spacing: 1px; margin-bottom: 12px;
    }

    .place-main { display: flex; align-items: center; gap: 14px; }
    .place-emoji { font-size: 44px; flex-shrink: 0; }

    .place-info { flex: 1; min-width: 0; }
    .place-name { font-size: 20px; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 4px; }
    .place-name-en { font-size: 16px; color: #64748b; margin-bottom: 6px; }
    .place-addr { font-size: 15px; color: #64b5f6; line-height: 1.5; word-break: break-word; }

    .place-img {
      width: 100%; border-radius: 14px; max-height: 160px;
      object-fit: cover; margin-bottom: 14px; display: block;
    }

    .maps-icon {
      flex-shrink: 0; background: #1e3a6e; border-radius: 12px;
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }

    .place-stats {
      display: flex; align-items: center; gap: 12px;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid #1e3a5f;
      flex-wrap: wrap;
    }
    .place-count {
      font-size: 16px; font-weight: 800;
      background: #0a1e35; border-radius: 10px; padding: 5px 14px; color: #f59e0b;
    }
    .place-count.zero { color: #334d66; }
    .place-last { font-size: 15px; color: #546e7a; flex: 1; }

    .call-btn {
      display: flex; align-items: center; gap: 8px;
      background: #064e3b; border: 2px solid #34d399; border-radius: 14px;
      color: #34d399; font-size: 18px; font-weight: 800; font-family: inherit;
      padding: 12px 20px; text-decoration: none; margin-top: 10px;
      width: 100%; justify-content: center;
    }
    .call-btn:active { background: #065f46; }

    .edit-place-btn {
      display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid #1e3a5f; border-radius: 10px;
      color: #475569; font-size: 13px; font-weight: 700; font-family: inherit;
      padding: 6px 12px; cursor: pointer; margin-top: 8px; width: 100%;
      text-decoration: none;
    }
    .edit-place-btn:active { background: #112240; color: #90caf9; }
  </style>
</head>
<body>

<div id="header">
  <div class="header-row1">
    <h1>📍 常去地点</h1>
    <a href="places-admin.html" class="manage-btn">✏️ 管理</a>
  </div>
  <div class="header-row2">
    <div class="search-wrap">
      <input class="search-input" id="search-input" placeholder="🔍 搜索地点…" oninput="onSearch(this.value)" />
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <button class="sort-toggle" id="sort-toggle" onclick="toggleSort()">🕐 最近</button>
  </div>
  <div class="cat-wrap" id="cat-wrap"></div>
</div>

<div id="place-list"></div>

<script>
  const CLICKS_KEY = 'place_clicks';
  const CUSTOM_KEY = 'places_custom';
  let allPlaces   = [];
  let sortMode    = 'recent';
  let searchQuery = '';
  let activecat   = '';

  function getClicks() {
    try { return JSON.parse(localStorage.getItem(CLICKS_KEY) || '{}'); } catch { return {}; }
  }

  function recordClick(id, address) {
    const clicks = getClicks();
    if (!clicks[id]) clicks[id] = { count: 0, lastAt: null };
    clicks[id].count++;
    clicks[id].lastAt = new Date().toISOString();
    localStorage.setItem(CLICKS_KEY, JSON.stringify(clicks));
    render();
    window.location.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  }

  function toggleSort() {
    sortMode = sortMode === 'recent' ? 'frequent' : 'recent';
    document.getElementById('sort-toggle').textContent = sortMode === 'recent' ? '🕐 最近' : '⭐ 常去';
    render();
  }

  function onSearch(val) {
    searchQuery = val.trim().toLowerCase();
    document.getElementById('search-clear').style.display = val ? 'flex' : 'none';
    render();
  }

  function clearSearch() {
    document.getElementById('search-input').value = '';
    onSearch('');
    document.getElementById('search-input').focus();
  }

  function setCat(cat) {
    activecat = cat;
    document.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
    render();
  }

  function buildCatPills() {
    const cats = [...new Set(allPlaces.map(p => p.category).filter(Boolean))];
    const wrap = document.getElementById('cat-wrap');
    if (cats.length < 2) { wrap.classList.remove('visible'); return; }
    wrap.classList.add('visible');
    wrap.innerHTML = `<button class="cat-pill active" data-cat="" onclick="setCat('')">全部</button>` +
      cats.map(c => `<button class="cat-pill" data-cat="${c}" onclick="setCat('${c}')">${c}</button>`).join('');
  }

  function timeSince(iso) {
    if (!iso) return '';
    const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days === 0) return '今天';
    if (days === 1) return '昨天';
    if (days < 30)  return days + ' 天前';
    return Math.floor(days / 30) + ' 个月前';
  }

;

  function render() {
    const clicks = getClicks();
    const list   = document.getElementById('place-list');

    if (!allPlaces.length) {
      list.innerHTML = '<div class="empty-state">📭<br>还没有地点<br>请联系 Cindy 添加</div>';
      return;
    }

    let sorted = allPlaces.filter(p => {
      if (activecat && p.category !== activecat) return false;
      if (!searchQuery) return true;
      return (p.name || '').toLowerCase().includes(searchQuery) ||
             (p.nameEn || '').toLowerCase().includes(searchQuery) ||
             (p.address || '').toLowerCase().includes(searchQuery);
    });
    if (!sorted.length) {
      list.innerHTML = '<div class="empty-state">🔍<br>没有找到相关地点</div>';
      return;
    }

    if (sortMode === 'recent') {
      sorted.sort((a, b) => (clicks[b.id]?.lastAt || '').localeCompare(clicks[a.id]?.lastAt || ''));
    } else {
      sorted.sort((a, b) => (clicks[b.id]?.count || 0) - (clicks[a.id]?.count || 0));
    }

    list.innerHTML = sorted.map((p, i) => {
      const c     = clicks[p.id] || { count: 0, lastAt: null };
      const emoji = '📍';
      const isTop = i === 0 && c.count > 0;
      const isNone = c.count === 0;
      const addr  = p.address.replace(/'/g, "\\'");

      const phone = p.phone ? p.phone.replace(/'/g, "\\'") : '';
      return `<div class="place-card${isTop ? ' top-card' : ''}"
                   onclick="recordClick('${p.id}','${addr}')">
        ${isTop ? `<div class="top-label">${sortMode === 'recent' ? '🕐 最近去的' : '⭐ 最常去的'}</div>` : ''}
        ${p.image ? `<img class="place-img" src="${p.image}">` : ''}
        <div class="place-main">
          <span class="place-emoji">${emoji}</span>
          <div class="place-info">
            <div class="place-name">${p.name}</div>
            ${p.nameEn ? `<div class="place-name-en">${p.nameEn}</div>` : ''}
            <div class="place-addr">${p.address}</div>
          </div>
          <div class="maps-icon">🗺️</div>
        </div>
        <div class="place-stats">
          <span class="place-count${isNone ? ' zero' : ''}">${isNone ? '从未去过' : '去过 ' + c.count + ' 次'}</span>
          ${c.lastAt ? `<span class="place-last">上次：${timeSince(c.lastAt)}</span>` : ''}
        </div>
        ${p.phone ? `<a class="call-btn" href="tel:${phone}" onclick="event.stopPropagation()">📞 打电话 ${p.phone}</a>` : ''}
        <a class="edit-place-btn" href="places-admin.html?edit=${p.id}" onclick="event.stopPropagation()">✏️ 编辑此地点</a>
      </div>`;
    }).join('');
  }

  async function init() {
    const t = Date.now();
    const [json, custom] = await Promise.all([
      fetch('places.json?t=' + t).then(r => r.json()).catch(() => []),
      Promise.resolve(JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'))
    ]);
    allPlaces = [...json, ...custom];
    buildCatPills();
    render();
  }

  init();
</script>
</body>
</html>
