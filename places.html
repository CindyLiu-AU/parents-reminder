<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>常去地点</title>
  <style>
    :root {
      --bg: #0d1b2a; --bg-hdr: #091525;
      --card: #112240; --card-hover: #1a2e50; --card-inner: #0a1628; --count-bg: #0a1e35;
      --border: #1e3a5f; --border2: #2e5a8f;
      --text: #f0f4f8; --text-muted: #64748b; --text-dim: #546e7a; --text-faint: #334d66;
      --accent: #f59e0b; --accent-fg: #1a1000; --accent-shadow: rgba(245,158,11,0.18);
      --blue: #64b5f6; --blue2: #90caf9;
      --btn: #1e3a6e; --active-icon-bg: #1a2e10;
      --green-bg: #064e3b; --green: #34d399; --green-hover: #065f46;
      --red: #fca5a5; --edit-col: #475569;
    }
    html[data-theme="light"] {
      --bg: #f0f6ff; --bg-hdr: #e2edfb;
      --card: #ffffff; --card-hover: #e8f0fb; --card-inner: #f0f6ff; --count-bg: #e8f2ff;
      --border: #c5d8f0; --border2: #93b4d0;
      --text: #0f1f35; --text-muted: #475569; --text-dim: #64748b; --text-faint: #94a3b8;
      --accent: #d97706; --accent-fg: #1a0a00; --accent-shadow: rgba(217,119,6,0.15);
      --blue: #1a5fa8; --blue2: #1e4e8c;
      --btn: #dbeafe; --active-icon-bg: #fef3c7;
      --green-bg: #d1fae5; --green: #059669; --green-hover: #a7f3d0;
      --red: #dc2626; --edit-col: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: var(--bg-hdr); border-bottom: 2px solid var(--border);
      padding: 10px 12px 8px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .header-row1 { display: flex; align-items: center; gap: 8px; }
    #header h1 { flex: 1; font-size: 18px; font-weight: 900; color: var(--accent); }
    .icon-btn {
      flex-shrink: 0; background: var(--btn); border: 2px solid var(--border); border-radius: 10px;
      color: var(--blue); font-size: 18px; font-family: inherit;
      width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn.active { border-color: var(--accent); color: var(--accent); background: var(--active-icon-bg); }
    .icon-btn:active { background: var(--card-hover); }
    .manage-btn {
      flex-shrink: 0; background: var(--btn); border: 1px solid var(--border2); border-radius: 10px;
      color: var(--blue2); font-size: 13px; font-weight: 700; font-family: inherit;
      padding: 7px 13px; cursor: pointer; text-decoration: none; white-space: nowrap;
      height: 42px; display: flex; align-items: center;
    }

    .search-expand { display: none; }
    .search-expand.open { display: flex; gap: 8px; align-items: center; }
    .search-wrap { position: relative; flex: 1; }
    .search-input {
      width: 100%; background: var(--btn); border: 2px solid var(--border); border-radius: 12px;
      color: var(--text); font-size: 16px; font-family: inherit;
      padding: 10px 40px 10px 13px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-faint); }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-dim); font-size: 18px;
      cursor: pointer; display: none; padding: 4px;
    }

    .cat-wrap { display: none; gap: 8px; flex-wrap: wrap; }
    .cat-wrap.visible { display: flex; }
    .cat-wrap::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0; background: var(--btn); border: 2px solid var(--border2); border-radius: 20px;
      color: var(--blue2); font-size: 15px; font-weight: 800; font-family: inherit;
      padding: 8px 16px; cursor: pointer; white-space: nowrap;
    }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

    #place-list {
      position: fixed; top: var(--header-h, 120px); bottom: 0; left: 0; right: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(80px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px;
    }

    .empty-state {
      text-align: center; color: var(--text-faint); font-size: 22px;
      padding: 80px 20px; line-height: 2.2;
    }

    .place-card {
      background: var(--card); border: 2px solid var(--border); border-radius: 20px;
      padding: 18px 16px; cursor: pointer;
      transition: transform 0.1s; user-select: none;
    }
    .place-card:active { transform: scale(0.97); background: var(--card-hover); }
    .place-card.top-card { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-shadow); }

    .place-main { display: flex; align-items: flex-start; }
    .place-info { flex: 1; min-width: 0; }
    .place-name { font-size: 19px; font-weight: 900; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
    .place-name-en { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; line-height: 1.3; }
    .place-addr { font-size: 14px; color: var(--blue); line-height: 1.5; word-break: break-all; }

    .place-img { width: 100%; border-radius: 14px; max-height: 160px; object-fit: cover; margin-bottom: 14px; display: block; }

    .place-stats {
      display: flex; align-items: center;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); gap: 8px;
    }
    .place-stats-left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .place-stats-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .place-count {
      font-size: 14px; font-weight: 800; white-space: nowrap;
      background: var(--count-bg); border-radius: 8px; padding: 4px 10px; color: var(--accent);
    }
    .place-count.zero { color: var(--text-faint); }
    .place-last { font-size: 13px; color: var(--text-dim); white-space: nowrap; }

    .call-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--green-bg); border: 2px solid var(--green); border-radius: 14px;
      color: var(--green); font-size: 18px; font-weight: 800; font-family: inherit;
      padding: 12px 20px; text-decoration: none; margin-top: 10px;
      width: 100%; justify-content: center;
    }
    .call-btn:active { background: var(--green-hover); }

    .edit-place-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--edit-col); font-size: 16px; font-family: inherit;
      padding: 4px 8px; cursor: pointer; flex-shrink: 0;
    }
    .edit-place-btn:active { background: var(--btn); color: var(--blue2); }

    .area-select {
      background: var(--accent); border: none; border-radius: 10px;
      color: var(--accent-fg); font-size: 13px; font-weight: 800; font-family: inherit;
      padding: 5px 10px; cursor: pointer; outline: none;
    }

    #pwd-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(9,21,37,0.96);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 40px;
    }
    #pwd-overlay.open { display: flex; }
    .pwd-title { font-size: 22px; font-weight: 900; color: var(--accent); }
    .pwd-input {
      width: 100%; max-width: 260px;
      background: var(--card); border: 2px solid var(--border); border-radius: 16px;
      color: var(--text); font-size: 30px; font-family: inherit;
      padding: 16px 20px; outline: none; text-align: center; letter-spacing: 10px;
    }
    .pwd-input:focus { border-color: var(--accent); }
    .pwd-confirm {
      width: 100%; max-width: 260px;
      background: var(--accent); border: none; border-radius: 16px;
      color: var(--accent-fg); font-size: 20px; font-weight: 900; font-family: inherit;
      padding: 16px; cursor: pointer;
    }
    .pwd-confirm:active { opacity: 0.85; }
    .pwd-cancel { color: var(--text-dim); font-size: 15px; background: none; border: none; font-family: inherit; cursor: pointer; padding: 8px; }
    .pwd-error { color: var(--red); font-size: 15px; min-height: 22px; }
  </style>
</head>
<body>

<div id="pwd-overlay">
  <div class="pwd-title">🔐 请输入密码</div>
  <input class="pwd-input" id="pwd-input" type="password" inputmode="numeric"
         placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter')pwdConfirm()" />
  <button class="pwd-confirm" onclick="pwdConfirm()">确认</button>
  <button class="pwd-cancel" onclick="pwdClose()">取消</button>
  <div class="pwd-error" id="pwd-error"></div>
</div>

<div id="header">
  <div class="header-row1">
    <h1>📍 常去地点</h1>
    <button class="icon-btn" id="search-btn" onclick="toggleSearch()" style="width:auto;padding:0 16px;gap:6px;font-size:15px">🔍 搜索</button>
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
    <button class="manage-btn" onclick="promptAndGo('places-admin.html')">✏️ 管理</button>
  </div>
  <div class="search-expand" id="search-expand">
    <div class="search-wrap">
      <input class="search-input" id="search-input" placeholder="搜索地点…" oninput="onSearch(this.value)" />
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div class="cat-wrap" id="cat-wrap" style="padding:6px 12px 8px">
    <select id="cat-select" onchange="setCat(this.value)" style="width:100%;background:var(--btn);border:2px solid var(--border2);border-radius:12px;color:var(--blue2);font-size:15px;font-weight:800;font-family:inherit;padding:8px 12px;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%2364b5f6%22 stroke-width=%222.5%22><polyline points=%226 9 12 15 18 9%22/></svg>');background-repeat:no-repeat;background-position:right 10px center;background-size:18px;padding-right:36px"></select>
  </div>
</div>

<div id="place-list"></div>

<script>
  const ADMIN_PWD   = '456';
  const CLICKS_KEY  = 'place_clicks';
  const CUSTOM_KEY  = 'places_custom';
  const AREAS_KEY   = 'places_areas';
  const CAT_OVR_KEY = 'places_cat_overrides';
  const THEME_KEY   = 'places_theme';
  const DEFAULT_AREAS = ['金斯顿', '叁地贝', '市中心', '北区', '东区'];
  let allPlaces   = [];
  let sortMode    = 'recent';
  let searchQuery = '';
  let activecat   = '';

  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY) || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('theme-btn').textContent = saved === 'dark' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const cur  = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
  }

  function getAreas() {
    try {
      const s = JSON.parse(localStorage.getItem(AREAS_KEY) || 'null');
      return (s && s.length) ? s : [...DEFAULT_AREAS];
    } catch { return [...DEFAULT_AREAS]; }
  }

  function getCatOverrides() {
    try { return JSON.parse(localStorage.getItem(CAT_OVR_KEY) || '{}'); } catch { return {}; }
  }

  function changeCat(id, val) {
    event.stopPropagation();
    const custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
    const isCustom = custom.some(p => p.id === id);
    if (isCustom) {
      localStorage.setItem(CUSTOM_KEY, JSON.stringify(
        custom.map(p => p.id === id ? {...p, category: val} : p)
      ));
    } else {
      const ovr = getCatOverrides();
      if (val) ovr[id] = val; else delete ovr[id];
      localStorage.setItem(CAT_OVR_KEY, JSON.stringify(ovr));
    }
    allPlaces = allPlaces.map(p => p.id === id ? {...p, category: val} : p);
    scheduleFirebaseSave();
    buildCatPills();
    render();
  }

  let pendingUrl = '';

  function promptAndGo(url) {
    event.stopPropagation();
    pendingUrl = url;
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-error').textContent = '';
    document.getElementById('pwd-overlay').classList.add('open');
    setTimeout(() => document.getElementById('pwd-input').focus(), 100);
  }

  function pwdConfirm() {
    if (document.getElementById('pwd-input').value === ADMIN_PWD) {
      sessionStorage.setItem('admin_unlocked', '1');
      window.location.href = pendingUrl;
    } else {
      document.getElementById('pwd-error').textContent = '密码错误，请重试';
      document.getElementById('pwd-input').value = '';
      document.getElementById('pwd-input').focus();
    }
  }

  function pwdClose() {
    document.getElementById('pwd-overlay').classList.remove('open');
    pendingUrl = '';
  }

  function getClicks() {
    try { return JSON.parse(localStorage.getItem(CLICKS_KEY) || '{}'); } catch { return {}; }
  }

  function recordClick(id, address) {
    const clicks = getClicks();
    if (!clicks[id]) clicks[id] = { count: 0, lastAt: null };
    clicks[id].count++;
    clicks[id].lastAt = new Date().toISOString();
    localStorage.setItem(CLICKS_KEY, JSON.stringify(clicks));
    window.location.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  }

  function toggleSearch() {
    const row = document.getElementById('search-expand');
    const btn = document.getElementById('search-btn');
    const open = row.classList.toggle('open');
    btn.classList.toggle('active', open);
    if (open) {
      setTimeout(() => { document.getElementById('search-input').focus(); fixListTop(); }, 10);
    } else {
      document.getElementById('search-input').value = '';
      onSearch('');
      fixListTop();
    }
  }

  function toggleSort() {
    sortMode = sortMode === 'recent' ? 'frequent' : 'recent';
    document.getElementById('sort-toggle').textContent = sortMode === 'recent' ? '🕐' : '⭐';
    render();
  }

  function onSearch(val) {
    searchQuery = val.trim().toLowerCase();
    document.getElementById('search-clear').style.display = val ? 'flex' : 'none';
    if (searchQuery && activecat) {
      activecat = '';
      const sel = document.getElementById('cat-select');
      if (sel) sel.value = '';
    }
    render();
  }

  function clearSearch() {
    document.getElementById('search-input').value = '';
    onSearch('');
    document.getElementById('search-expand').classList.remove('open');
    document.getElementById('search-btn').classList.remove('active');
    setTimeout(fixListTop, 50);
  }

  function setCat(cat) {
    activecat = cat;
    const sel = document.getElementById('cat-select');
    if (sel) sel.value = cat;
    render();
  }

  const OLD_CATS = new Set(['医疗','购物','餐厅','交通','学校','银行','其他']);

  function buildCatPills() {
    const cats = [...new Set(allPlaces.map(p => p.category).filter(c => c && !OLD_CATS.has(c)))];
    const wrap = document.getElementById('cat-wrap');
    const sel  = document.getElementById('cat-select');
    if (cats.length < 2) { wrap.classList.remove('visible'); fixListTop(); return; }
    wrap.classList.add('visible');
    setTimeout(fixListTop, 0);
    const countOf = c => allPlaces.filter(p => p.category === c).length;
    sel.innerHTML = `<option value="">全部地点 (${allPlaces.length})</option>` +
      cats.map(c => `<option value="${c}">${c} (${countOf(c)})</option>`).join('');
    sel.value = activecat;
  }

  function timeSince(iso) {
    if (!iso) return '';
    const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days === 0) return '今天';
    if (days === 1) return '昨天';
    if (days < 30)  return days + ' 天前';
    return Math.floor(days / 30) + ' 个月前';
  }

  function getCustom() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch { return []; } }

  function render() {
    const clicks = getClicks();
    const areas  = getAreas();
    const list   = document.getElementById('place-list');

    if (!allPlaces.length) {
      list.innerHTML = '<div class="empty-state">📭<br>还没有地点<br>请联系 Cindy 添加</div>';
      return;
    }

    let sorted = allPlaces.filter(p => {
      if (activecat && p.category !== activecat) return false;
      if (!searchQuery) return true;
      return (p.name || '').toLowerCase().includes(searchQuery) ||
             (p.nameEn || '').toLowerCase().includes(searchQuery) ||
             (p.address || '').toLowerCase().includes(searchQuery);
    });
    if (!sorted.length) {
      list.innerHTML = '<div class="empty-state">🔍<br>没有找到相关地点</div>';
      return;
    }

    if (sortMode === 'recent') {
      sorted.sort((a, b) => (clicks[b.id]?.lastAt || '').localeCompare(clicks[a.id]?.lastAt || ''));
    } else {
      sorted.sort((a, b) => (clicks[b.id]?.count || 0) - (clicks[a.id]?.count || 0));
    }

    list.innerHTML = sorted.map((p, i) => {
      const c     = clicks[p.id] || { count: 0, lastAt: null };
      const isNone = c.count === 0;
      const addr  = p.address.replace(/'/g, "\\'");
      const phone = p.phone ? p.phone.replace(/'/g, "\\'") : '';
      return `<div class="place-card" onclick="recordClick('${p.id}','${addr}')">
        ${p.image ? `<img class="place-img" src="${p.image}">` : ''}
        <div class="place-main">
          <div class="place-info">
            <div class="place-name">${p.name}</div>
            ${p.nameEn ? `<div class="place-name-en">${p.nameEn}</div>` : ''}
            <div class="place-addr">${p.address}</div>
          </div>
        </div>
        <div class="place-stats">
          <div class="place-stats-left">
            <span class="place-count${isNone ? ' zero' : ''}">${isNone ? '从未去过' : '去过 ' + c.count + ' 次'}</span>
            ${c.lastAt ? `<span class="place-last">上次：${timeSince(c.lastAt)}</span>` : ''}
          </div>
          <div class="place-stats-right">
            <select class="area-select" onclick="event.stopPropagation()" onchange="changeCat('${p.id}', this.value)">
              <option value="" ${!p.category || OLD_CATS.has(p.category) ? 'selected' : ''}>未分区</option>
              ${areas.map(a => `<option value="${a}"${p.category === a ? ' selected' : ''}>${a}</option>`).join('')}
            </select>
            <button class="edit-place-btn" onclick="promptAndGo('places-admin.html?edit=${p.id}')">✏️</button>
          </div>
        </div>
        ${p.phone ? `<a class="call-btn" href="tel:${phone}" onclick="event.stopPropagation()">📞 打电话 ${p.phone}</a>` : ''}
      </div>`;
    }).join('');
  }

  function fixListTop() {
    const h = document.getElementById('header').offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }

  const FB_URL = 'https://parents-reminder-places-default-rtdb.asia-southeast1.firebasedatabase.app/places.json';

  let fbSaveTimer = null;
  function scheduleFirebaseSave() {
    clearTimeout(fbSaveTimer);
    fbSaveTimer = setTimeout(doFirebaseSave, 2000);
  }
  async function doFirebaseSave() {
    try {
      const payload = { custom: getCustom(), areas: getAreas(), catOverrides: getCatOverrides() };
      await fetch(FB_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } catch(e) { console.error('Firebase save failed:', e); }
  }

  async function init() {
    initTheme();
    const t = Date.now();
    const [json, remote] = await Promise.all([
      fetch('places.json?t=' + t).then(r => r.json()).catch(() => []),
      fetch(FB_URL + '?t=' + t).then(r => r.json()).catch(() => null)
    ]);
    if (remote) {
      if (Array.isArray(remote.custom)     && remote.custom.length > 0)                localStorage.setItem(CUSTOM_KEY,  JSON.stringify(remote.custom));
      if (Array.isArray(remote.areas)      && remote.areas.length  > 0)                localStorage.setItem(AREAS_KEY,   JSON.stringify(remote.areas));
      if (remote.catOverrides              && Object.keys(remote.catOverrides).length)  localStorage.setItem(CAT_OVR_KEY, JSON.stringify(remote.catOverrides));
    } else {
      const localCustom = getCustom();
      if (localCustom.length > 0) doFirebaseSave();
    }
    const overrides = getCatOverrides();
    const custom    = getCustom();
    allPlaces = [
      ...json.map(p => overrides[p.id] ? {...p, category: overrides[p.id]} : p),
      ...custom
    ];
    buildCatPills();
    render();
    fixListTop();
  }

  window.addEventListener('resize', fixListTop);
  init();
</script>
</body>
</html>
