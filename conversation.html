<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话翻译</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #091525;
      border-bottom: 2px solid #1e3a5f;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100;
    }
    #header h1 { font-size: 20px; font-weight: 800; color: #f59e0b; }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 10px;
      color: #90caf9; font-size: 14px; font-weight: 600; font-family: inherit;
      padding: 7px 14px; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; gap: 5px;
    }
    .header-btn:hover { background: #2e5a8f; }

    /* ── Main display area ── */
    #main-display {
      position: fixed;
      top: 66px; bottom: 210px;
      left: 0; right: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 28px;
      text-align: center;
      overflow: hidden;
    }

    /* ── Idle state ── */
    #idle-state { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .idle-icon { font-size: 80px; }
    .idle-title { font-size: 28px; font-weight: 700; color: #64748b; }
    .idle-sub   { font-size: 20px; color: #475569; line-height: 1.9; }

    /* ── Listening state ── */
    #listening-state { display: none; flex-direction: column; align-items: center; gap: 20px; }
    .listen-mic { font-size: 96px; animation: mic-pulse 0.7s ease-in-out infinite alternate; }
    @keyframes mic-pulse {
      from { transform: scale(1);    opacity: 1; }
      to   { transform: scale(1.15); opacity: 0.7; }
    }
    .listen-label { font-size: 32px; font-weight: 800; color: #f59e0b; }
    .listen-sub   { font-size: 22px; color: #64748b; }

    /* ── Translating state ── */
    #translating-state { display: none; flex-direction: column; align-items: center; gap: 16px; }
    .trans-spinner { font-size: 64px; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .trans-label { font-size: 28px; font-weight: 700; color: #64b5f6; }

    /* ── Result state ── */
    #result-state {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; width: 100%;
    }
    #result-original {
      font-size: 40px; color: #64748b;
      line-height: 1.4; max-width: 100%;
      word-break: break-word;
    }
    #result-translation {
      font-size: 58px; font-weight: 800;
      line-height: 1.4; max-width: 100%;
      word-break: break-word;
    }
    #result-translation.zh-result { color: #4ade80; }
    #result-translation.en-result { color: #64b5f6; }

    .replay-btn {
      margin-top: 8px;
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 16px;
      color: #90caf9; font-size: 22px; font-weight: 700; font-family: inherit;
      padding: 16px 36px; cursor: pointer;
      white-space: nowrap;
    }
    .replay-btn:hover { background: #2e5a8f; }

    /* ── Mic buttons ── */
    #btn-area {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: grid; grid-template-columns: 1fr 1fr;
      height: 210px;
      background: #0a0a0a;
      border-top: 2px solid #222;
    }
    .mic-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      border: none; cursor: pointer; font-family: inherit;
      transition: background 0.15s; padding: 12px 8px;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    /* Blue for English speaker */
    .mic-btn.en-btn { background: #0a1f5c; border-right: 3px solid #111; }
    .mic-btn.en-btn:active, .mic-btn.en-btn.active { background: #1740b0; }
    /* Red for Chinese speaker */
    .mic-btn.zh-btn { background: #5c0a0a; }
    .mic-btn.zh-btn:active, .mic-btn.zh-btn.active { background: #b01717; }

    .btn-mic-icon { font-size: 52px; line-height: 1; }
    .mic-btn.active .btn-mic-icon { animation: mic-pulse 0.7s ease-in-out infinite alternate; }

    .rec-dot {
      position: absolute; top: 12px; right: 16px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; display: none;
      animation: dot-blink 0.6s ease-in-out infinite alternate;
    }
    .mic-btn.active .rec-dot { display: block; }
    @keyframes dot-blink { from { opacity:1; } to { opacity:0.15; } }

    .btn-label-main { font-size: 22px; font-weight: 800; }
    .mic-btn.en-btn .btn-label-main { color: #93c5fd; }
    .mic-btn.zh-btn .btn-label-main { color: #fca5a5; }
    .btn-label-lang { font-size: 15px; color: #64748b; }
    .btn-label-hint { font-size: 15px; color: #475569; margin-top: 2px; }
    .mic-btn.active .btn-label-hint { color: #f59e0b; font-weight: 700; }

    /* ── Error toast ── */
    #err-toast {
      position: fixed; bottom: 222px; left: 50%; transform: translateX(-50%);
      background: #450a0a; border: 1px solid #dc2626; color: #fca5a5;
      font-size: 18px; font-weight: 600; padding: 10px 24px; border-radius: 16px;
      display: none; z-index: 200; white-space: nowrap; text-align: center;
    }

    /* ── Light mode ── */
    html.light body { background: #f5f5f0; color: #1e293b; }
    html.light #header { background: #ffffff; border-color: #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    html.light #header h1 { color: #1e293b; }
    html.light .header-btn { background: #f1f5f9; border-color: #cbd5e1; color: #1e293b; }
    html.light .header-btn:hover { background: #e2e8f0; }
    html.light #main-display { background: #f5f5f0; }
    html.light .idle-icon { filter: none; }
    html.light .idle-title { color: #1e293b; font-size: 32px; }
    html.light .idle-sub   { color: #475569; }
    html.light .listen-mic { filter: none; }
    html.light .listen-label { color: #d97706; }
    html.light .listen-sub { color: #475569; }
    html.light .trans-spinner { filter: none; }
    html.light .trans-label { color: #2563eb; }
    html.light #result-original { color: #475569; }
    html.light #result-translation.zh-result { color: #16a34a; }
    html.light #result-translation.en-result { color: #1d4ed8; }
    html.light .replay-btn { background: #1e293b; border-color: #334155; color: #f8fafc; }
    html.light .replay-btn:hover { background: #334155; }
    html.light #btn-area { background: #e2e8f0; border-color: #cbd5e1; }
    html.light .mic-btn.en-btn { background: #1d4ed8; border-right-color: #cbd5e1; }
    html.light .mic-btn.zh-btn { background: #dc2626; }
    html.light .mic-btn.en-btn .btn-label-main { color: #ffffff; }
    html.light .mic-btn.zh-btn .btn-label-main { color: #ffffff; }
    html.light .mic-btn.en-btn:active,
    html.light .mic-btn.en-btn.active { background: #2563eb; }
    html.light .mic-btn.zh-btn:active,
    html.light .mic-btn.zh-btn.active { background: #ef4444; }
    html.light .btn-label-hint { color: #94a3b8; }
    #theme-toggle { display: none !important; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div id="header">
  <h1>💬 对话翻译</h1>
  <div class="header-actions">
    <button class="secondary-theme-toggle" onclick="toggleColorTheme()" title="切换亮色/暗色"></button>
    <button class="header-btn" onclick="openKeyModal()" title="设置 OpenAI API Key">🔑</button>
    <button class="header-btn" onclick="clearDisplay()">🗑 清除</button>
  </div>
</div>

<!-- API key modal -->
<div id="key-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;">
  <div style="background:#0d1b2a;border:1px solid #2e5a8f;border-radius:18px;padding:28px 24px;width:90%;max-width:420px;display:flex;flex-direction:column;gap:16px;">
    <div style="font-size:20px;font-weight:800;color:#f59e0b;">🔑 OpenAI API Key</div>
    <div style="font-size:14px;color:#64748b;line-height:1.6;">输入你的 OpenAI API Key，仅储存在本机，不会上传。<br>前往 platform.openai.com 获取。</div>
    <input id="key-input" type="password" placeholder="sk-..." style="background:#091525;border:1px solid #2e5a8f;border-radius:10px;color:#f0f4f8;font-size:16px;padding:12px 14px;font-family:inherit;outline:none;width:100%;box-sizing:border-box;">
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeKeyModal()" style="background:#1e293b;border:1px solid #334155;border-radius:10px;color:#94a3b8;font-size:15px;font-family:inherit;padding:10px 20px;cursor:pointer;">取消</button>
      <button onclick="confirmKey()" style="background:#1d4ed8;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;padding:10px 24px;cursor:pointer;">保存</button>
    </div>
  </div>
</div>

<div id="main-display">

  <!-- idle -->
  <div id="idle-state">
    <div class="idle-icon">💬</div>
    <div class="idle-title">对话翻译</div>
    <div class="idle-sub">
      Press the blue button for English speakers<br>
      点击下方绿色按钮，自己说中文
    </div>
  </div>

  <!-- listening -->
  <div id="listening-state">
    <div class="listen-mic">🎤</div>
    <div class="listen-label" id="listen-label">正在听…</div>
    <div class="listen-sub" id="listen-sub">说完自动停止</div>
  </div>

  <!-- translating -->
  <div id="translating-state">
    <div class="trans-spinner">⟳</div>
    <div class="trans-label">翻译中…</div>
  </div>

  <!-- result -->
  <div id="result-state">
    <div id="result-original"></div>
    <div id="result-translation"></div>
    <div style="display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;justify-content:center;">
      <button class="replay-btn" id="replay-btn">🔊 朗读</button>
    </div>
  </div>

</div>

<div id="err-toast"></div>

<div id="btn-area">
  <button class="mic-btn en-btn" id="en-btn" onclick="toggleRec('en')">
    <div class="rec-dot"></div>
    <div class="btn-mic-icon">🎤</div>
    <div class="btn-label-main">Speak English</div>
  </button>
  <button class="mic-btn zh-btn" id="zh-btn" onclick="toggleRec('zh')">
    <div class="rec-dot"></div>
    <div class="btn-mic-icon">🎤</div>
    <div class="btn-label-main">我说中文</div>
  </button>
</div>

<script>
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;
  let lastZhText  = '';
  let lastEnText  = '';
  let currentAudio = null;

  /* ── State display ───────────────────────────────────────── */
  function showState(name) {
    ['idle-state','listening-state','translating-state','result-state']
      .forEach(id => document.getElementById(id).style.display = id === name ? 'flex' : 'none');
  }
  showState('idle-state');

  /* ── Error toast ─────────────────────────────────────────── */
  let errTimer;
  function showErr(msg) {
    const el = document.getElementById('err-toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(errTimer);
    errTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  /* ── TTS (OpenAI tts-1-hd) ───────────────────────────────── */
  function stopAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  }

  async function speakTTS(text, lang) {
    if (!text) return;
    stopAudio();
    const key = getApiKey();
    if (!key) return;
    const voice = lang.startsWith('zh') ? 'nova' : 'alloy';
    try {
      const res = await fetch('https://api.openai.com/v1/audio/speech', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'tts-1-hd', input: text, voice })
      });
      if (!res.ok) throw new Error('TTS error');
      const url = URL.createObjectURL(await res.blob());
      currentAudio = new Audio(url);
      currentAudio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; };
      await currentAudio.play();
    } catch(e) { console.error('TTS failed:', e); }
  }

  function replayZH() { if (lastZhText) speakTTS(lastZhText, 'zh-CN'); }
  function replayEN() { if (lastEnText) speakTTS(lastEnText, 'en-AU'); }

  /* ── Recording ───────────────────────────────────────────── */
  function toggleRec(mode) {
    if (isRecording) { stopRec(); return; }
    startRec(mode);
  }

  function startRec(mode) {
    if (!SR) { showErr('此设备不支持语音识别，请使用 Chrome 浏览器'); return; }
    stopAudio();
    isRecording = true;
    recognition = new SR();
    recognition.lang            = mode === 'zh' ? 'zh-CN' : 'en-AU';
    recognition.continuous      = false;
    recognition.interimResults  = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      setBtn(mode, true);
      document.getElementById('listen-label').textContent =
        mode === 'zh' ? '正在听… 请说中文' : 'Listening… speak English';
      document.getElementById('listen-sub').textContent = '说完自动停止';
      showState('listening-state');
    };

    recognition.onresult = async (e) => {
      const text = e.results[0][0].transcript.trim();
      if (text) await handleSpeech(mode, text);
    };

    recognition.onerror = (e) => {
      const msgs = {
        'no-speech':   '没有听到说话，请再试一次',
        'not-allowed': '麦克风权限被拒绝，请在浏览器设置中允许',
        'network':     '网络错误，请检查网络连接',
      };
      showErr(msgs[e.error] || ('识别出错：' + e.error));
      finishRec();
      showState('idle-state');
    };

    recognition.onend = () => finishRec();

    try { recognition.start(); }
    catch(e) { showErr('无法启动麦克风：' + e.message); finishRec(); }
  }

  function stopRec() {
    if (recognition) { try { recognition.stop(); } catch(_) {} }
  }

  function finishRec() {
    isRecording = false;
    setBtn('zh', false);
    setBtn('en', false);
  }

  function setBtn(mode, active) {
    const btn = document.getElementById(mode + '-btn');
    btn.classList.toggle('active', active);
  }

  /* ── OpenAI API key ─────────────────────────────────────── */
  const API_KEY_STORE = 'openai_api_key';
  function getApiKey() { return localStorage.getItem(API_KEY_STORE) || ''; }
  function saveApiKey(k) { localStorage.setItem(API_KEY_STORE, k.trim()); }

  function openKeyModal() {
    document.getElementById('key-input').value = getApiKey();
    document.getElementById('key-modal').style.display = 'flex';
  }
  function closeKeyModal() {
    document.getElementById('key-modal').style.display = 'none';
  }
  function confirmKey() {
    const v = document.getElementById('key-input').value.trim();
    if (v) { saveApiKey(v); closeKeyModal(); }
  }

  /* ── Translation (GPT-4o-mini) ───────────────────────────── */
  async function translate(text, from, to) {
    const key = getApiKey();
    if (!key) { openKeyModal(); throw new Error('需要 OpenAI API Key'); }

    const fromLabel = from === 'zh' ? 'Simplified Chinese' : 'English';
    const toLabel   = to   === 'zh' ? 'Simplified Chinese' : 'English';

    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        max_tokens: 300,
        messages: [
          { role: 'system', content: `You are a translator. Translate naturally and conversationally as spoken language between ${fromLabel} and ${toLabel}. Return ONLY the translation, nothing else.` },
          { role: 'user', content: text }
        ]
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || '翻译服务错误');
    }
    const data = await res.json();
    return data.choices[0].message.content.trim();
  }

  function fitResultText() {
    const container = document.getElementById('main-display');
    const state     = document.getElementById('result-state');
    const trans     = document.getElementById('result-translation');
    const orig      = document.getElementById('result-original');
    let transPx = 58, origPx = 40;
    trans.style.fontSize = transPx + 'px';
    orig.style.fontSize  = origPx  + 'px';
    while (state.offsetHeight > container.clientHeight - 16 && transPx > 18) {
      transPx -= 3;
      origPx   = Math.max(16, Math.round(transPx * 0.69));
      trans.style.fontSize = transPx + 'px';
      orig.style.fontSize  = origPx  + 'px';
    }
  }

  async function handleSpeech(mode, original) {
    finishRec();
    showState('translating-state');

    const fromLang = mode === 'zh' ? 'zh' : 'en';
    const toLang   = mode === 'zh' ? 'en' : 'zh';
    const transLang = mode === 'zh' ? 'en-AU' : 'zh-CN';
    const transClass = mode === 'zh' ? 'en-result' : 'zh-result';

    let translated = '';
    try {
      translated = await translate(original, fromLang, toLang);
    } catch(e) {
      translated = mode === 'zh' ? '（翻译失败，请检查网络）' : '(Translation failed)';
    }

    lastZhText = mode === 'zh' ? original   : translated;
    lastEnText = mode === 'zh' ? translated : original;

    document.getElementById('result-original').textContent    = original;
    const transEl = document.getElementById('result-translation');
    transEl.textContent = translated;
    transEl.className   = transClass;

    // Show only the button for the translated language
    const btn = document.getElementById('replay-btn');
    if (mode === 'zh') {
      btn.textContent = '🔊 朗读英文';
      btn.onclick = replayEN;
    } else {
      btn.textContent = '🔊 Read Chinese / 朗读中文';
      btn.onclick = replayZH;
    }

    showState('result-state');
    requestAnimationFrame(fitResultText);
    speakTTS(translated, transLang);
  }

  /* ── Clear ───────────────────────────────────────────────── */
  function clearDisplay() {
    stopAudio();
    if (recognition) { try { recognition.stop(); } catch(_) {} }
    finishRec();
    lastZhText = '';
    lastEnText = '';
    showState('idle-state');
  }
</script>
<script src="theme.js"></script>
</body>
</html>
