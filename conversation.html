<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话翻译</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #091525;
      border-bottom: 2px solid #1e3a5f;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100;
    }
    #header h1 { font-size: 20px; font-weight: 800; color: #f59e0b; }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 10px;
      color: #90caf9; font-size: 14px; font-weight: 600; font-family: inherit;
      padding: 7px 14px; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; gap: 5px;
    }
    .header-btn:hover { background: #2e5a8f; }

    /* ── Main display area ── */
    #main-display {
      position: fixed;
      top: 66px; bottom: 210px;
      left: 0; right: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 28px;
      text-align: center;
      overflow: hidden;
    }

    /* ── Idle state ── */
    #idle-state { display: flex; flex-direction: column; align-items: stretch; gap: 18px; width: 100%; max-width: 480px; }
    .idle-card {
      display: flex; align-items: center; gap: 20px;
      border-radius: 18px; padding: 22px 24px;
    }
    .idle-card.en-card { background: rgba(29,78,216,0.18); border: 2px solid #1d4ed8; }
    .idle-card.zh-card { background: rgba(220,38,38,0.18); border: 2px solid #dc2626; }
    .idle-card-dot { font-size: 28px; flex-shrink: 0; }
    .idle-card-text { display: flex; flex-direction: column; gap: 4px; text-align: left; }
    .idle-card-main { font-size: 26px; font-weight: 800; }
    .idle-card.en-card .idle-card-main { color: #93c5fd; }
    .idle-card.zh-card .idle-card-main { color: #fca5a5; }
    .idle-card-sub { font-size: 17px; color: #64748b; }

    /* ── Listening state ── */
    #listening-state { display: none; flex-direction: column; align-items: center; gap: 20px; }
    .listen-mic { font-size: 96px; animation: mic-pulse 0.7s ease-in-out infinite alternate; }
    @keyframes mic-pulse {
      from { transform: scale(1);    opacity: 1; }
      to   { transform: scale(1.15); opacity: 0.7; }
    }
    .listen-label { font-size: 32px; font-weight: 800; color: #f59e0b; }
    .listen-sub   { font-size: 22px; color: #64748b; }

    /* ── Translating state ── */
    #translating-state { display: none; flex-direction: column; align-items: center; gap: 16px; }
    .trans-spinner { font-size: 64px; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .trans-label { font-size: 28px; font-weight: 700; color: #64b5f6; }

    /* ── Result state ── */
    #result-state {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; width: 100%;
    }
    #result-original {
      font-size: 40px; color: #64748b;
      line-height: 1.4; max-width: 100%;
      word-break: break-word;
    }
    #result-translation {
      font-size: 58px; font-weight: 800;
      line-height: 1.4; max-width: 100%;
      word-break: break-word;
    }
    #result-translation.zh-result { color: #4ade80; }
    #result-translation.en-result { color: #64b5f6; }

    .replay-btn {
      margin-top: 8px;
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 16px;
      color: #90caf9; font-size: 22px; font-weight: 700; font-family: inherit;
      padding: 16px 36px; cursor: pointer;
      white-space: nowrap;
    }
    .replay-btn:hover { background: #2e5a8f; }

    /* ── Mic buttons ── */
    #btn-area {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: grid; grid-template-columns: 1fr 1fr;
      height: 210px;
      background: #0a0a0a;
      border-top: 2px solid #222;
    }
    .mic-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      border: none; cursor: pointer; font-family: inherit;
      transition: background 0.15s; padding: 12px 8px;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    /* Blue for English speaker */
    .mic-btn.en-btn { background: #0a1f5c; border-right: 3px solid #111; }
    .mic-btn.en-btn:active, .mic-btn.en-btn.active { background: #1740b0; }
    /* Red for Chinese speaker */
    .mic-btn.zh-btn { background: #5c0a0a; }
    .mic-btn.zh-btn:active, .mic-btn.zh-btn.active { background: #b01717; }

    .btn-mic-icon { font-size: 52px; line-height: 1; }
    .mic-btn.active .btn-mic-icon { animation: mic-pulse 0.7s ease-in-out infinite alternate; }

    .rec-dot {
      position: absolute; top: 12px; right: 16px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; display: none;
      animation: dot-blink 0.6s ease-in-out infinite alternate;
    }
    .mic-btn.active .rec-dot { display: block; }
    @keyframes dot-blink { from { opacity:1; } to { opacity:0.15; } }

    .btn-label-main { font-size: 22px; font-weight: 800; }
    .mic-btn.en-btn .btn-label-main { color: #93c5fd; }
    .mic-btn.zh-btn .btn-label-main { color: #fca5a5; }
    .btn-label-lang { font-size: 15px; color: #64748b; }
    .btn-label-hint { font-size: 15px; color: #475569; margin-top: 2px; }
    .mic-btn.active .btn-label-hint { color: #f59e0b; font-weight: 700; }

    /* ── Error toast ── */
    #err-toast {
      position: fixed; bottom: 222px; left: 50%; transform: translateX(-50%);
      background: #450a0a; border: 1px solid #dc2626; color: #fca5a5;
      font-size: 18px; font-weight: 600; padding: 10px 24px; border-radius: 16px;
      display: none; z-index: 200; white-space: nowrap; text-align: center;
    }

    #theme-toggle { display: none !important; }
    .voice-pick-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: #091525; border: 2px solid #2e5a8f; border-radius: 14px;
      color: #f0f4f8; font-family: inherit; padding: 14px 8px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .voice-pick-btn.selected { background: #1e3a6e; border-color: #60a5fa; }
    .vp-label { font-size: 16px; font-weight: 700; }
    .vp-sub   { font-size: 12px; color: #64748b; }
  </style>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* ── Match theme toggle to header-btn style ── */
    #header .secondary-theme-toggle {
      background: #1e3a6e !important; border: 1px solid #2e5a8f !important;
      border-radius: 10px !important; color: #90caf9 !important;
      font-size: 22px !important; font-weight: 600 !important;
      padding: 7px 14px !important; cursor: pointer;
      width: auto !important; height: auto !important;
      display: flex !important; align-items: center !important;
    }
    #header .secondary-theme-toggle:hover { background: #2e5a8f !important; }
    html.light #header .secondary-theme-toggle {
      background: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #1e293b !important;
    }
    html.light #header .secondary-theme-toggle:hover { background: #e2e8f0 !important; }

    /* ── Light mode overrides (after theme.css so they win the cascade) ── */
    html.light body { background: #f5f5f0 !important; color: #1e293b !important; }
    html.light #header { background: #ffffff !important; border-color: #e2e8f0 !important; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    html.light #header h1 { color: #1e293b !important; }
    html.light .header-btn { background: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #1e293b !important; }
    html.light .header-btn:hover { background: #e2e8f0 !important; }
    html.light #main-display { background: #f5f5f0 !important; }
    html.light .idle-card.en-card { background: rgba(29,78,216,0.10) !important; border-color: #1d4ed8 !important; }
    html.light .idle-card.zh-card { background: rgba(220,38,38,0.10) !important; border-color: #dc2626 !important; }
    html.light .idle-card.en-card .idle-card-main { color: #1d4ed8 !important; }
    html.light .idle-card.zh-card .idle-card-main { color: #dc2626 !important; }
    html.light .idle-card-sub { color: #64748b !important; }
    html.light .listen-label { color: #d97706 !important; }
    html.light .listen-sub { color: #475569 !important; }
    html.light .trans-label { color: #2563eb !important; }
    html.light #result-original { color: #475569 !important; }
    html.light #result-translation.zh-result { color: #16a34a !important; }
    html.light #result-translation.en-result { color: #1d4ed8 !important; }
    html.light .replay-btn { background: #1e293b !important; border-color: #334155 !important; color: #f8fafc !important; }
    html.light .replay-btn:hover { background: #334155 !important; }
    html.light #btn-area { background: #e2e8f0 !important; border-color: #cbd5e1 !important; }
    html.light .mic-btn.en-btn { background: #1d4ed8 !important; }
    html.light .mic-btn.zh-btn { background: #dc2626 !important; }
    html.light .mic-btn.en-btn .btn-label-main { color: #ffffff !important; }
    html.light .mic-btn.zh-btn .btn-label-main { color: #ffffff !important; }
    html.light .mic-btn.en-btn:active,
    html.light .mic-btn.en-btn.active { background: #2563eb !important; }
    html.light .mic-btn.zh-btn:active,
    html.light .mic-btn.zh-btn.active { background: #ef4444 !important; }
  </style>
</head>
<body>

<div id="header">
  <h1>💬 对话翻译</h1>
  <div class="header-actions">
    <button class="secondary-theme-toggle" onclick="toggleColorTheme()" title="切换亮色/暗色"></button>
    <button class="header-btn" onclick="openPinModal()" title="设置" style="font-size:22px;padding:6px 10px;">⚙️</button>
    <button class="header-btn" onclick="clearDisplay()">🗑 清除</button>
  </div>
</div>

<!-- PIN modal -->
<div id="pin-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:600;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#0d1b2a;border:1px solid #2e5a8f;border-radius:20px;padding:28px 24px;width:100%;max-width:300px;display:flex;flex-direction:column;gap:16px;align-items:center;">
    <div style="font-size:20px;font-weight:800;color:#f59e0b;">🔒 输入密码</div>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="10" placeholder="••••"
      style="background:#091525;border:2px solid #2e5a8f;border-radius:12px;color:#f0f4f8;font-size:28px;letter-spacing:8px;padding:12px 20px;font-family:inherit;outline:none;width:100%;box-sizing:border-box;text-align:center;"
      onkeydown="if(event.key==='Enter') confirmPin()">
    <div id="pin-err" style="font-size:14px;color:#ef4444;min-height:20px;"></div>
    <div style="display:flex;gap:10px;width:100%;">
      <button onclick="closePinModal()" style="flex:1;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#94a3b8;font-size:15px;font-family:inherit;padding:12px;cursor:pointer;">取消</button>
      <button onclick="confirmPin()" style="flex:1;background:#1d4ed8;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;padding:12px;cursor:pointer;">确认</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div id="key-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#0d1b2a;border:1px solid #2e5a8f;border-radius:20px;padding:28px 24px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px;">

    <div style="font-size:20px;font-weight:800;color:#f59e0b;">⚙️ 设置</div>

    <!-- API Key -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:14px;font-weight:700;color:#90caf9;">🔑 OpenAI API Key</div>
      <input id="key-input" type="password" placeholder="sk-..." style="background:#091525;border:1px solid #2e5a8f;border-radius:10px;color:#f0f4f8;font-size:15px;padding:11px 14px;font-family:inherit;outline:none;width:100%;box-sizing:border-box;">
      <div style="font-size:12px;color:#475569;">仅储存在本机，不会上传。platform.openai.com 获取。</div>
    </div>

    <!-- My voice (parents speak Chinese → output is English) -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:14px;font-weight:700;color:#93c5fd;">🔵 我的声音 · My Voice</div>
      <div style="font-size:12px;color:#475569;margin-top:-6px;">爸妈说中文后，英文翻译用的声音</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button id="btn-en-female" class="voice-pick-btn" onclick="pickVoice('en','shimmer')">
          <span style="font-size:22px;">👩</span>
          <span class="vp-label">女声 Female</span>
          <span class="vp-sub">Shimmer</span>
        </button>
        <button id="btn-en-male" class="voice-pick-btn" onclick="pickVoice('en','echo')">
          <span style="font-size:22px;">👨</span>
          <span class="vp-label">男声 Male</span>
          <span class="vp-sub">Echo</span>
        </button>
      </div>
    </div>

    <!-- English speaker's voice (they speak English → output is Chinese) -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:14px;font-weight:700;color:#fca5a5;">🔴 对方的声音 · English Speaker's Voice</div>
      <div style="font-size:12px;color:#475569;margin-top:-6px;">对方说英文后，中文翻译用的声音</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button id="btn-zh-female" class="voice-pick-btn" onclick="pickVoice('zh','nova')">
          <span style="font-size:22px;">👩</span>
          <span class="vp-label">女声 Female</span>
          <span class="vp-sub">Nova</span>
        </button>
        <button id="btn-zh-male" class="voice-pick-btn" onclick="pickVoice('zh','onyx')">
          <span style="font-size:22px;">👨</span>
          <span class="vp-label">男声 Male</span>
          <span class="vp-sub">Onyx</span>
        </button>
      </div>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeKeyModal()" style="background:#1e293b;border:1px solid #334155;border-radius:10px;color:#94a3b8;font-size:15px;font-family:inherit;padding:10px 20px;cursor:pointer;">取消</button>
      <button onclick="confirmKey()" style="background:#1d4ed8;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;padding:10px 24px;cursor:pointer;">保存</button>
    </div>
  </div>
</div>

<div id="main-display">

  <!-- idle -->
  <div id="idle-state">
    <div class="idle-card en-card">
      <div class="idle-card-dot">🔵</div>
      <div class="idle-card-text">
        <div class="idle-card-main">Speak English</div>
        <div class="idle-card-sub">Press the blue button below</div>
      </div>
    </div>
    <div class="idle-card zh-card">
      <div class="idle-card-dot">🔴</div>
      <div class="idle-card-text">
        <div class="idle-card-main">说中文</div>
        <div class="idle-card-sub">按下方红色按钮</div>
      </div>
    </div>
  </div>

  <!-- listening -->
  <div id="listening-state">
    <div class="listen-mic">🎤</div>
    <div class="listen-label" id="listen-label">正在听…</div>
    <div class="listen-sub" id="listen-sub">说完自动停止</div>
  </div>

  <!-- translating -->
  <div id="translating-state">
    <div class="trans-spinner">⟳</div>
    <div class="trans-label">翻译中…</div>
  </div>

  <!-- result -->
  <div id="result-state">
    <div id="result-original"></div>
    <div id="result-translation"></div>
    <div style="display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;justify-content:center;">
      <button class="replay-btn" id="replay-btn">🔊 朗读</button>
    </div>
  </div>

</div>

<div id="err-toast"></div>

<div id="btn-area">
  <button class="mic-btn en-btn" id="en-btn" onclick="toggleRec('en')">
    <div class="rec-dot"></div>
    <div class="btn-mic-icon">🎤</div>
    <div class="btn-label-main">Speak English</div>
  </button>
  <button class="mic-btn zh-btn" id="zh-btn" onclick="toggleRec('zh')">
    <div class="rec-dot"></div>
    <div class="btn-mic-icon">🎤</div>
    <div class="btn-label-main">我说中文</div>
  </button>
</div>

<script>
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;
  let recTimeout  = null;
  let lastZhText  = '';
  let lastEnText  = '';
  let currentSource = null;
  let audioCtx = null;

  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      /* Play a silent buffer to fully unlock autoplay */
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
    } catch(_) {}
  }

  /* ── State display ───────────────────────────────────────── */
  function showState(name) {
    ['idle-state','listening-state','translating-state','result-state']
      .forEach(id => document.getElementById(id).style.display = id === name ? 'flex' : 'none');
  }
  showState('idle-state');

  /* ── Error toast ─────────────────────────────────────────── */
  let errTimer;
  function showErr(msg) {
    const el = document.getElementById('err-toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(errTimer);
    errTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  /* ── TTS (OpenAI tts-1-hd via AudioContext) ─────────────── */
  function stopAudio() {
    if (currentSource) { try { currentSource.stop(); } catch(_) {} currentSource = null; }
  }

  async function speakTTS(text, lang) {
    if (!text) return;
    stopAudio();
    const key = getApiKey();
    if (!key) return;
    const voice = lang.startsWith('zh')
      ? (localStorage.getItem('voice_zh') || 'nova')
      : (localStorage.getItem('voice_en') || 'shimmer');
    try {
      const res = await fetch('https://api.openai.com/v1/audio/speech', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: 'tts-1-hd', input: text, voice })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'HTTP ' + res.status);
      }
      const arrayBuffer = await res.arrayBuffer();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      const src = audioCtx.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(audioCtx.destination);
      src.onended = () => { currentSource = null; };
      currentSource = src;
      src.start(0);
    } catch(e) {
      console.error('TTS failed:', e);
      showErr('语音失败：' + e.message);
    }
  }

  function replayZH() { unlockAudio(); if (lastZhText) speakTTS(lastZhText, 'zh-CN'); }
  function replayEN() { unlockAudio(); if (lastEnText) speakTTS(lastEnText, 'en-AU'); }

  /* ── Recording ───────────────────────────────────────────── */
  function toggleRec(mode) {
    unlockAudio();
    if (isRecording) { stopRec(); return; }
    startRec(mode);
  }

  function startRec(mode) {
    if (!SR) { showErr('此设备不支持语音识别，请使用 Chrome 浏览器'); return; }
    stopAudio();
    isRecording = true;
    recognition = new SR();
    recognition.lang            = mode === 'zh' ? 'zh-CN' : 'en-AU';
    recognition.continuous      = false;
    recognition.interimResults  = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      setBtn(mode, true);
      document.getElementById('listen-label').textContent =
        mode === 'zh' ? '正在听… 请说中文' : 'Listening… speak English';
      document.getElementById('listen-sub').textContent = '说完自动停止';
      showState('listening-state');
      /* Safety: auto-stop after 12s in case browser never fires onend */
      recTimeout = setTimeout(() => stopRec(), 12000);
    };

    /* Stop as soon as the user goes silent — don't wait for browser delay */
    recognition.onspeechend = () => {
      try { recognition.stop(); } catch(_) {}
    };

    recognition.onresult = async (e) => {
      const text = e.results[0][0].transcript.trim();
      if (text) await handleSpeech(mode, text);
    };

    recognition.onerror = (e) => {
      /* 'aborted' = user manually cancelled — not an error, go back silently */
      if (e.error === 'aborted') { finishRec(); showState('idle-state'); return; }
      const msgs = {
        'no-speech':   '没有听到说话，请再试一次',
        'not-allowed': '麦克风权限被拒绝，请在浏览器设置中允许',
        'network':     '网络错误，请检查网络连接',
      };
      showErr(msgs[e.error] || ('识别出错：' + e.error));
      finishRec();
      showState('idle-state');
    };

    recognition.onend = () => finishRec();

    try { recognition.start(); }
    catch(e) { showErr('无法启动麦克风：' + e.message); finishRec(); }
  }

  function stopRec() {
    if (recognition) { try { recognition.stop(); } catch(_) {} }
  }

  function finishRec() {
    isRecording = false;
    if (recTimeout) { clearTimeout(recTimeout); recTimeout = null; }
    setBtn('zh', false);
    setBtn('en', false);
  }

  function setBtn(mode, active) {
    const btn = document.getElementById(mode + '-btn');
    btn.classList.toggle('active', active);
  }

  /* ── PIN gate ───────────────────────────────────────────── */
  const SETTINGS_PIN = '123';

  function openPinModal() {
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-err').textContent = '';
    document.getElementById('pin-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('pin-input').focus(), 100);
  }
  function closePinModal() {
    document.getElementById('pin-modal').style.display = 'none';
  }
  function confirmPin() {
    const v = document.getElementById('pin-input').value;
    if (v === SETTINGS_PIN) {
      closePinModal();
      openKeyModal();
    } else {
      const el = document.getElementById('pin-err');
      el.textContent = '密码错误，请重试';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
    }
  }

  /* ── OpenAI API key ─────────────────────────────────────── */
  const API_KEY_STORE = 'openai_api_key';
  function getApiKey() { return localStorage.getItem(API_KEY_STORE) || ''; }
  function saveApiKey(k) { localStorage.setItem(API_KEY_STORE, k.trim()); }

  function pickVoice(lang, voice) {
    localStorage.setItem('voice_' + lang, voice);
    refreshVoiceBtns();
  }

  function refreshVoiceBtns() {
    const zh = localStorage.getItem('voice_zh') || 'nova';
    const en = localStorage.getItem('voice_en') || 'shimmer';
    document.getElementById('btn-zh-female').classList.toggle('selected', zh === 'nova');
    document.getElementById('btn-zh-male').classList.toggle('selected',   zh === 'onyx');
    document.getElementById('btn-en-female').classList.toggle('selected', en === 'shimmer');
    document.getElementById('btn-en-male').classList.toggle('selected',   en === 'echo');
  }

  function openKeyModal() {
    document.getElementById('key-input').value = getApiKey();
    refreshVoiceBtns();
    document.getElementById('key-modal').style.display = 'flex';
  }
  function closeKeyModal() {
    document.getElementById('key-modal').style.display = 'none';
  }
  function confirmKey() {
    const v = document.getElementById('key-input').value.trim();
    if (v) saveApiKey(v);
    closeKeyModal();
  }

  /* ── Translation (GPT-4o-mini) ───────────────────────────── */
  async function translate(text, from, to) {
    const key = getApiKey();
    if (!key) { openKeyModal(); throw new Error('需要 OpenAI API Key'); }

    const fromLabel = from === 'zh' ? 'Simplified Chinese' : 'English';
    const toLabel   = to   === 'zh' ? 'Simplified Chinese' : 'English';

    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        max_tokens: 300,
        messages: [
          { role: 'system', content: `You are a translator. Translate naturally and conversationally as spoken language between ${fromLabel} and ${toLabel}. Return ONLY the translation, nothing else.` },
          { role: 'user', content: text }
        ]
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || '翻译服务错误');
    }
    const data = await res.json();
    return data.choices[0].message.content.trim();
  }

  function fitResultText() {
    const container = document.getElementById('main-display');
    const state     = document.getElementById('result-state');
    const trans     = document.getElementById('result-translation');
    const orig      = document.getElementById('result-original');
    let transPx = 58, origPx = 40;
    trans.style.fontSize = transPx + 'px';
    orig.style.fontSize  = origPx  + 'px';
    while (state.offsetHeight > container.clientHeight - 16 && transPx > 18) {
      transPx -= 3;
      origPx   = Math.max(16, Math.round(transPx * 0.69));
      trans.style.fontSize = transPx + 'px';
      orig.style.fontSize  = origPx  + 'px';
    }
  }

  async function handleSpeech(mode, original) {
    finishRec();
    showState('translating-state');

    const fromLang = mode === 'zh' ? 'zh' : 'en';
    const toLang   = mode === 'zh' ? 'en' : 'zh';
    const transLang = mode === 'zh' ? 'en-AU' : 'zh-CN';
    const transClass = mode === 'zh' ? 'en-result' : 'zh-result';

    let translated = '';
    try {
      translated = await translate(original, fromLang, toLang);
    } catch(e) {
      translated = mode === 'zh' ? '（翻译失败，请检查网络）' : '(Translation failed)';
    }

    const zhText = mode === 'zh' ? original   : translated;
    const enText = mode === 'zh' ? translated : original;
    lastZhText = zhText;
    lastEnText = enText;

    document.getElementById('result-original').textContent    = original;
    const transEl = document.getElementById('result-translation');
    transEl.textContent = translated;
    transEl.className   = transClass;

    // Capture text in closure so replay always uses this result's text
    const btn = document.getElementById('replay-btn');
    if (mode === 'zh') {
      btn.textContent = '🔊 朗读英文';
      btn.onclick = () => { unlockAudio(); speakTTS(enText, 'en-AU'); };
    } else {
      btn.textContent = '🔊 Read Chinese / 朗读中文';
      btn.onclick = () => { unlockAudio(); speakTTS(zhText, 'zh-CN'); };
    }

    showState('result-state');
    requestAnimationFrame(fitResultText);
    speakTTS(translated, transLang);
  }

  /* ── Clear ───────────────────────────────────────────────── */
  function clearDisplay() {
    stopAudio();
    if (recognition) { try { recognition.stop(); } catch(_) {} }
    finishRec();
    lastZhText = '';
    lastEnText = '';
    showState('idle-state');
  }
</script>
<script src="theme.js"></script>
</body>
</html>
