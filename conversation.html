<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话翻译</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #0d1b2a;
      color: #f0f4f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #091525;
      border-bottom: 2px solid #1e3a5f;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    #header h1 { font-size: 28px; font-weight: 800; color: #f59e0b; }
    .header-actions { display: flex; gap: 10px; }
    .header-btn {
      background: #1e3a6e; border: 1px solid #2e5a8f; border-radius: 10px;
      color: #90caf9; font-size: 17px; font-weight: 600; font-family: inherit;
      padding: 9px 18px; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .header-btn:hover { background: #2e5a8f; }

    /* ── Conversation scroll area ── */
    #conv-area {
      position: fixed;
      top: 70px;
      bottom: 220px;
      left: 0; right: 0;
      overflow-y: auto;
      padding: 18px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; color: #475569; padding: 40px 20px;
    }
    #empty-state .es-icon { font-size: 72px; margin-bottom: 18px; }
    #empty-state .es-title { font-size: 26px; font-weight: 700; margin-bottom: 10px; color: #64748b; }
    #empty-state .es-sub { font-size: 20px; color: #475569; line-height: 1.8; }

    /* ── Bubbles ── */
    .bubble {
      max-width: 88%;
      border-radius: 22px;
      padding: 18px 22px;
    }
    .bubble.me   { align-self: flex-end;   background: #0a3a20; border: 2px solid #16a34a44; }
    .bubble.them { align-self: flex-start; background: #0d1e38; border: 2px solid #1e3a6e; }

    .bubble-who {
      font-size: 15px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px;
    }
    .bubble.me   .bubble-who { color: #4ade80; }
    .bubble.them .bubble-who { color: #64b5f6; }

    .bubble-original {
      font-size: 30px; font-weight: 700; color: #f0f4f8;
      line-height: 1.5; margin-bottom: 10px;
    }

    .bubble-translated {
      font-size: 26px; line-height: 1.5; margin-bottom: 12px;
    }
    .bubble.me   .bubble-translated { color: #86efac; }
    .bubble.them .bubble-translated { color: #7dd3fc; }

    .bubble-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .tts-btn {
      background: #1e3a6e22; border: 1px solid #2e5a8f;
      border-radius: 10px; color: #90caf9;
      font-size: 16px; font-family: inherit; font-weight: 600;
      padding: 7px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .tts-btn:hover { background: #1e3a6e; }
    .bubble.me   .tts-btn { border-color: #16a34a66; color: #86efac; }
    .bubble.me   .tts-btn:hover { background: #0a3a20; }

    /* ── Status bar ── */
    #status-bar {
      position: fixed;
      bottom: 214px;
      left: 0; right: 0;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      padding: 6px 16px;
      min-height: 40px;
      color: #475569;
      transition: color 0.2s;
    }
    #status-bar.listening   { color: #f59e0b; }
    #status-bar.translating { color: #64b5f6; }
    #status-bar.error       { color: #ef4444; }

    /* ── Mic buttons ── */
    #btn-area {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: grid; grid-template-columns: 1fr 1fr;
      height: 214px;
      background: #091525;
      border-top: 2px solid #1e3a5f;
    }

    .mic-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      border: none; cursor: pointer; font-family: inherit;
      transition: background 0.15s; padding: 12px 8px;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .mic-btn.en-btn { background: #0d1b35; border-right: 1px solid #1e3a5f; }
    .mic-btn.zh-btn { background: #0a2a1a; }

    .mic-btn.zh-btn:active, .mic-btn.zh-btn.active { background: #064e3b; }
    .mic-btn.en-btn:active, .mic-btn.en-btn.active { background: #1e3a6e; }

    .mic-icon { font-size: 56px; line-height: 1; transition: transform 0.15s; }
    .mic-btn.active .mic-icon { animation: mic-pulse 0.7s ease-in-out infinite alternate; }

    @keyframes mic-pulse {
      from { transform: scale(1);    opacity: 1; }
      to   { transform: scale(1.18); opacity: 0.75; }
    }

    .rec-dot {
      position: absolute; top: 14px; right: 18px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #ef4444;
      display: none;
      animation: dot-blink 0.6s ease-in-out infinite alternate;
    }
    .mic-btn.active .rec-dot { display: block; }

    @keyframes dot-blink {
      from { opacity: 1; }
      to   { opacity: 0.15; }
    }

    .mic-label-main {
      font-size: 24px; font-weight: 800;
    }
    .mic-btn.zh-btn .mic-label-main { color: #4ade80; }
    .mic-btn.en-btn .mic-label-main { color: #64b5f6; }

    .mic-label-lang {
      font-size: 16px; color: #64748b;
    }

    .mic-label-hint {
      font-size: 16px; color: #475569; margin-top: 2px;
    }
    .mic-btn.active .mic-label-hint { color: #f59e0b; font-weight: 700; }

    /* ── Light mode ── */
    html.light body { background: #f8fafc; color: #1e293b; }
    html.light #header { background: #f1f5f9; border-color: #e2e8f0; }
    html.light .header-btn { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
    html.light #empty-state .es-title { color: #94a3b8; }
    html.light #empty-state .es-sub   { color: #cbd5e1; }
    html.light .bubble.me   { background: #f0fdf4; border-color: #86efac; }
    html.light .bubble.them { background: #eff6ff; border-color: #bfdbfe; }
    html.light .bubble-original { color: #1e293b; }
    html.light .bubble.me   .bubble-translated { color: #15803d; }
    html.light .bubble.them .bubble-translated { color: #1d4ed8; }
    html.light .tts-btn { border-color: #93c5fd; color: #1d4ed8; background: #dbeafe44; }
    html.light .tts-btn:hover { background: #dbeafe; }
    html.light .bubble.me   .tts-btn { border-color: #86efac; color: #15803d; background: #f0fdf444; }
    html.light .bubble.me   .tts-btn:hover { background: #dcfce7; }
    html.light #btn-area { background: #f1f5f9; border-color: #e2e8f0; }
    html.light .mic-btn.zh-btn { background: #f0fdf4; border-color: #e2e8f0; }
    html.light .mic-btn.zh-btn:active,
    html.light .mic-btn.zh-btn.active { background: #dcfce7; }
    html.light .mic-btn.en-btn { background: #eff6ff; }
    html.light .mic-btn.en-btn:active,
    html.light .mic-btn.en-btn.active { background: #dbeafe; }
    html.light .mic-label-hint { color: #94a3b8; }
    html.light #status-bar:not(.listening):not(.translating):not(.error) { color: #94a3b8; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div id="header">
  <h1>💬 对话翻译</h1>
  <div class="header-actions">
    <button class="header-btn" onclick="clearConv()">🗑 清除</button>
    <a class="header-btn" href="index.html">🏠 返回</a>
  </div>
</div>

<div id="conv-area">
  <div id="empty-state">
    <div class="es-icon">💬</div>
    <div class="es-title">对话翻译</div>
    <div class="es-sub">
      点击下方绿色按钮，说中文<br>
      点击下方蓝色按钮，让对方说英文<br>
      自动翻译，大声朗读
    </div>
  </div>
</div>

<div id="status-bar">准备好了</div>

<div id="btn-area">
  <button class="mic-btn en-btn" id="en-btn" onclick="toggleRec('en')">
    <div class="rec-dot"></div>
    <div class="mic-icon">🎤</div>
    <div class="mic-label-main">对方说英文</div>
    <div class="mic-label-lang">English → 中文</div>
    <div class="mic-label-hint" id="en-hint">点击开始</div>
  </button>
  <button class="mic-btn zh-btn" id="zh-btn" onclick="toggleRec('zh')">
    <div class="rec-dot"></div>
    <div class="mic-icon">🎤</div>
    <div class="mic-label-main">我说中文</div>
    <div class="mic-label-lang">中文 → English</div>
    <div class="mic-label-hint" id="zh-hint">点击开始</div>
  </button>
</div>

<script>
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition  = null;
  let isRecording  = false;
  let currentMode  = null;
  let messages     = [];

  /* ── TTS voices ──────────────────────────────────────────── */
  let voiceEN = null, voiceZH = null;
  function initVoices() {
    const vv = speechSynthesis.getVoices();
    voiceEN = vv.find(v => v.lang === 'en-AU')
           || vv.find(v => v.lang === 'en-GB')
           || vv.find(v => v.lang.startsWith('en') && v.localService)
           || vv.find(v => v.lang.startsWith('en')) || null;
    voiceZH = vv.find(v => v.lang === 'zh-CN')
           || vv.find(v => v.lang === 'zh-TW')
           || vv.find(v => v.lang.startsWith('zh')) || null;
  }
  if (speechSynthesis.onvoiceschanged !== undefined)
    speechSynthesis.addEventListener('voiceschanged', initVoices);
  initVoices();

  function speakTTS(text, lang) {
    if (!text || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const utt  = new SpeechSynthesisUtterance(text);
    utt.lang   = lang;
    utt.rate   = lang.startsWith('zh') ? 0.85 : 0.9;
    if (lang.startsWith('zh') && voiceZH) utt.voice = voiceZH;
    if (lang.startsWith('en') && voiceEN) utt.voice = voiceEN;
    // Resume in case the synthesis engine was suspended
    speechSynthesis.resume();
    speechSynthesis.speak(utt);
  }

  /* ── Recording ───────────────────────────────────────────── */
  function toggleRec(mode) {
    if (isRecording) { stopRec(); return; }
    startRec(mode);
  }

  function startRec(mode) {
    if (!SR) {
      setStatus('此设备不支持语音识别，请使用 Chrome 浏览器', 'error');
      return;
    }
    speechSynthesis.cancel();
    currentMode = mode;
    isRecording = true;
    recognition = new SR();
    recognition.lang            = mode === 'zh' ? 'zh-CN' : 'en-AU';
    recognition.continuous      = false;
    recognition.interimResults  = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      setBtn(mode, true);
      setStatus(mode === 'zh' ? '🔴 正在听… 请说中文' : '🔴 Listening… speak English', 'listening');
    };

    recognition.onresult = async (e) => {
      const text = e.results[0][0].transcript.trim();
      if (text) await handleSpeech(mode, text);
    };

    recognition.onerror = (e) => {
      const msgs = {
        'no-speech': '没有听到说话，请再试一次',
        'not-allowed': '麦克风权限被拒绝，请在浏览器设置中允许',
        'network': '网络错误，请检查网络连接',
      };
      setStatus(msgs[e.error] || ('识别出错：' + e.error), 'error');
      finishRec();
    };

    recognition.onend = () => finishRec();

    try { recognition.start(); }
    catch(e) { setStatus('无法启动麦克风：' + e.message, 'error'); finishRec(); }
  }

  function stopRec() {
    if (recognition) { try { recognition.stop(); } catch(_) {} }
  }

  function finishRec() {
    isRecording = false;
    currentMode = null;
    setBtn('zh', false);
    setBtn('en', false);
  }

  function setBtn(mode, active) {
    const btn  = document.getElementById(mode + '-btn');
    const hint = document.getElementById(mode + '-hint');
    btn.classList.toggle('active', active);
    hint.textContent = active ? '点击停止' : '点击开始';
    if (!active && document.getElementById('status-bar').className === 'listening') {
      setStatus('准备好了', '');
    }
  }

  /* ── Translation ─────────────────────────────────────────── */
  async function translate(text, from, to) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.responseStatus === 200) return data.responseData.translatedText;
    throw new Error('翻译服务错误');
  }

  async function handleSpeech(mode, original) {
    finishRec();
    setStatus('翻译中…', 'translating');
    const fromLang  = mode === 'zh' ? 'zh' : 'en';
    const toLang    = mode === 'zh' ? 'en' : 'zh';
    const ttsOrig   = mode === 'zh' ? 'zh-CN' : 'en-AU';
    const transTTS  = mode === 'zh' ? 'en-AU' : 'zh-CN';

    let translated = '';
    try {
      translated = await translate(original, fromLang, toLang);
    } catch(e) {
      translated = mode === 'zh' ? '（翻译失败，请检查网络）' : '(Translation failed)';
    }

    setStatus('', '');
    addBubble(mode, original, translated, ttsOrig, transTTS);
    // Small delay lets the browser release audio from speech recognition before TTS starts
    setTimeout(() => speakTTS(translated, transTTS), 400);
  }

  /* ── Bubble ──────────────────────────────────────────────── */
  function addBubble(mode, original, translated, origLang, transLang) {
    const area  = document.getElementById('conv-area');
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    const isMe   = mode === 'zh';
    const who    = isMe ? '👤 我（中文）' : '🧑 对方（英文）';
    const idx    = messages.length;
    messages.push({ original, translated, origLang, transLang });

    const div = document.createElement('div');
    div.className = `bubble ${isMe ? 'me' : 'them'}`;
    div.innerHTML = `
      <div class="bubble-who">${who}</div>
      <div class="bubble-original">${esc(original)}</div>
      <div class="bubble-translated">${esc(translated)}</div>
      <div class="bubble-actions">
        <button class="tts-btn" onclick="replayMsg(${idx},'orig')">🔊 原文</button>
        <button class="tts-btn" onclick="replayMsg(${idx},'trans')">🔊 翻译</button>
      </div>`;
    area.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function replayMsg(idx, part) {
    const m = messages[idx];
    if (!m) return;
    speakTTS(part === 'orig' ? m.original : m.translated,
             part === 'orig' ? m.origLang  : m.transLang);
  }

  /* ── Utils ───────────────────────────────────────────────── */
  function setStatus(msg, cls) {
    const el = document.getElementById('status-bar');
    el.textContent = msg || '';
    el.className   = cls || '';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function clearConv() {
    messages = [];
    speechSynthesis.cancel();
    if (recognition) { try { recognition.stop(); } catch(_) {} }
    finishRec();
    setStatus('准备好了', '');
    document.getElementById('conv-area').innerHTML = `
      <div id="empty-state">
        <div class="es-icon">💬</div>
        <div class="es-title">对话翻译</div>
        <div class="es-sub">
          点击下方绿色按钮，说中文<br>
          点击下方蓝色按钮，让对方说英文<br>
          自动翻译，大声朗读
        </div>
      </div>`;
  }
</script>
<script src="theme.js"></script>
</body>
</html>
